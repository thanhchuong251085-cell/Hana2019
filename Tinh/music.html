<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MusicPlaylist",
  "name": "Tuyển Tập V-Pop, Ballad &amp; Remix Hấp Dẫn",
  "description": "Danh sách các bài hát nhạc trẻ, ballad nhẹ nhàng và remix sôi động được yêu thích nhất.",
  "numTracks": "2",
  "track": [
    {
      "@type": "MusicRecording",
      "position": "1",
      "name": "Tên Bài Hát Ballad Mẫu",
      "byArtist": {
        "@type": "MusicGroup",
        "name": "Tên Ca Sĩ"
      },
      "duration": "PT4M15S", 
      "url": "https://tinhlagi.pro/music/song/1"
    },
    {
      "@type": "MusicRecording",
      "position": "2",
      "name": "Tên Bài Hát Remix Mẫu",
      "byArtist": {
        "@type": "MusicGroup",
        "name": "Tên DJ / Ca Sĩ"
      },
      "duration": "PT3M30S",
      "url": "https://tinhlagi.pro/music/song/2"
    }
  ]

</head>
<body>
    <main>
        <a href="index.html" class="home-logo-link" aria-label="Về trang chủ" target="_blank">
            <img src="images/logo.jpg" alt="Trang Chủ - Retro Player Chill" class="home-logo" width="60" height="60" fetchpriority="high">
        </a>

        <canvas id="shooting-stars"></canvas>

        <div id="start-overlay">
            <button class="start-btn" onclick="startExperience()" aria-label="Bắt đầu nghe nhạc">🎵 Bắt đầu nghe nhạc</button>
        </div>

        <aside class="wish-container">
            <div class="wish-header"><h2>✨ Điều Ước Năm Mới 2026 ✨</h2></div>
            <div class="wish-input-group">
                <input type="text" id="wishInput" placeholder="Nhập điều ước của bạn..." aria-label="Nhập điều ước">
                <button onclick="addWish()" aria-label="Gửi điều ước">Gửi</button>
            </div>
            <div id="wishWall" class="wish-wall"></div>
        </aside>

        <section class="player-container" aria-label="Trình phát nhạc">
            <div class="player-header">
                <h1>Retro Player Chill V3.9</h1>
                <div class="status-dot" id="status-dot" aria-label="Trạng thái kết nối"></div>
            </div>

            <div class="visual-display">
                <canvas id="visualizer"></canvas>
                <div class="disk-spin" id="disk"></div>
                <div id="yt-player-wrapper">
                    <div id="youtube-iframe"></div>
                </div>
            </div>

            <div class="song-info">
                <p class="song-title" id="current-song-title">Vui lòng nhấn Bắt đầu...</p>
            </div>

            <nav class="controls" aria-label="Điều khiển nhạc">
                <button class="ctrl-btn" id="repeat-btn" onclick="toggleRepeat()" aria-label="Lặp lại">🔁 Off</button>
                <button class="ctrl-btn" onclick="prevSong()" aria-label="Bài trước">⏮</button>
                <button class="ctrl-btn" onclick="togglePlay()" id="play-btn" aria-label="Phát hoặc Tạm dừng">▶ Play</button>
                <button class="ctrl-btn" onclick="nextSong(true)" aria-label="Bài tiếp theo">⏭</button>
                <button class="ctrl-btn" id="shuffle-btn" onclick="toggleShuffle()" aria-label="Phát ngẫu nhiên">🔀</button>
            </nav>

            <div class="playlist-box">
                <ul class="playlist" id="playlist"></ul>
            </div>

            <div class="add-music-area">
                <input type="text" id="link-input" placeholder="Dán link YouTube hoặc MP3..." aria-label="Dán link nhạc">
                <button class="ctrl-btn" onclick="addSongFromInput()" aria-label="Thêm nhạc">Thêm</button>
                
                <div class="timer-area">
                    <label for="sleep-timer">⏱ Hẹn giờ: </label>
                    <select id="sleep-timer" onchange="setSleepTimer()">
                        <option value="0">Tắt</option>
                        <option value="15">15p</option>
                        <option value="30">30p</option>
                        <option value="60">60p</option>
                    </select>
                    <span id="timer-display" style="color:#db2777; font-weight:bold;"></span>
                </div>
            </div>

            <audio id="audio-player" crossorigin="anonymous" onended="handleSongEnd()"></audio>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer=""></script>
