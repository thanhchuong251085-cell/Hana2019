name: Build Independent Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create tvapp com.player.app "TV Player"
          cd tvapp
          cordova platform add android@12.0.0
          
          # Cấu hình tự động chuyển hướng thẳng đến link Karaoke của bạn
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=https://thanhchuong251085-cell.github.io/Hana2019/Kara/player.html">
              <script type="text/javascript">
                  window.location.href = "https://thanhchuong251085-cell.github.io/Hana2019/Kara/player.html";
              </script>
          </head>
          <body>
          </body>
          </html>
          EOF

      - name: Build Android APK
        run: |
          cd tvapp
          cordova build android --debug

      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: Standalone-TV-Player-APK
          path: tvapp/platforms/android/app/build/outputs/apk/debug/*.apk
