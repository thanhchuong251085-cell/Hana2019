name: Build Independent Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Web Wrapper APK
        run: |
          npx -y web-to-apk --url "https://thanhchuong251085-cell.github.io/Hana2019/Kara/player.html" --name "TV Player" --package-name "com.player.app" --icon ""

      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: Standalone-TV-Player-APK
          path: output/*.apk
