                            }
                        } catch(e) { /* ignore */ }
                    }

                    if (Object.keys(clearKeys).length === 0 && keyString && (keyString.startsWith('http://') || keyString.startsWith('https://'))) {
                        try {
                            const userAgent = (channel.props && channel.props['http-user-agent']) || 'Dalvik/2.1.0';
                            const keyResp = await fetch(keyString, {
                                headers: { 'User-Agent': userAgent, 'Accept': '*/*' }
                            });
                            if (keyResp.ok) {
                                const keyText = await keyResp.text();
                                try {
                                    const keyData = JSON.parse(keyText);
                                    if (keyData.keys && Array.isArray(keyData.keys)) {
                                        keyData.keys.forEach(k => {
                                            clearKeys[base64ToHex(k.kid)] = base64ToHex(k.k);
                                        });
                                    } else if (keyData.kid && keyData.k) {
                                        clearKeys[base64ToHex(keyData.kid)] = base64ToHex(keyData.k);
                                    }
                                } catch(e) {
                                    const trimmed = keyText.trim();
                                    if (trimmed.includes(':')) {
                                        const parts = trimmed.split(':');
                                        if (parts.length === 2 && /^[0-9a-fA-F]+$/.test(parts[0]) && /^[0-9a-fA-F]+$/.test(parts[1])) {
                                            clearKeys[parts[0].toLowerCase()] = parts[1].toLowerCase();
                                        }
                                    }
                                }
                                console.log(`Fetched ClearKey from license URL:`, clearKeys);
                            }
                        } catch(e) {
                            console.warn(`Không thể fetch license key từ URL ${keyString}:`, e.message);
                        }
                    }

                    if (Object.keys(clearKeys).length === 0 && keyString) {
                        try {
                            const keyData = JSON.parse(keyString);
                            if (keyData.keys && Array.isArray(keyData.keys)) {
                                keyData.keys.forEach(k => {
                                    clearKeys[base64ToHex(k.kid)] = base64ToHex(k.k);
                                });
                            } else if (keyData.kid && keyData.k) {
                                clearKeys[base64ToHex(keyData.kid)] = base64ToHex(keyData.k);
                            }
                        } catch (e) {
                            if (keyString && keyString.includes(':')) {
                                const parts = keyString.split(':');
                                if (parts.length === 2 && /^[0-9a-fA-F]+$/.test(parts[0]) && /^[0-9a-fA-F]+$/.test(parts[1])) {
                                    clearKeys[parts[0].toLowerCase()] = parts[1].toLowerCase();
                                }
                            }
                        }
                    }

                    if (Object.keys(clearKeys).length > 0) {
                        shakaInstance.configure({
                            drm: {
                                clearKeys: clearKeys,
                                servers: {},
                                advanced: {
                                    'com.widevine.alpha': { serverCertificate: null },
                                    'com.microsoft.playready': { serverCertificate: null }
                                }
                            }
                        });
                        console.log("Configured ClearKey DRM (hex):", clearKeys);
                    }
                }

                shakaInstance.addEventListener('error', (event) => {
                    console.error('Shaka Error:', event.detail);
                });

                try {
                    await shakaInstance.load(resolvedUrl);
                    videoPlayer.play();

                    if (shakaInstance.isLive()) {
                        videoPlayer.classList.add('is-live');
                        const seekRange = shakaInstance.seekRange();
                        videoPlayer.currentTime = seekRange.end;
                    } else {
                        videoPlayer.classList.remove('is-live');
                    }

                    const qualitySelector = document.getElementById('quality-selector');
                    const tracks = shakaInstance.getVariantTracks();
                    const uniqueHeights = [...new Set(tracks.map(t => t.height).filter(h => h > 0))].sort((a, b) => b - a);
                    if (uniqueHeights.length > 1) {
                        const activeTrack = tracks.find(t => t.active);
                        const activeH = activeTrack ? activeTrack.height : uniqueHeights[0];
                        qualitySelector.innerHTML = `<option value="auto">Auto${activeH ? ' (' + activeH + 'p)' : ''}</option>`;
                        uniqueHeights.forEach(h => {
                            const opt = document.createElement('option');
                            opt.value = h;
                            opt.textContent = `${h}p`;
                            qualitySelector.appendChild(opt);
                        });
                        qualitySelector.classList.remove('hidden');

                        shakaInstance.addEventListener('adaptation', () => {
                            if (!shakaInstance) return;
                            const abrConfig = shakaInstance.getConfiguration().abr;
                            if (abrConfig && abrConfig.enabled && qualitySelector.value === 'auto') {
                                const currentTrack = shakaInstance.getVariantTracks().find(t => t.active);
                                const h = currentTrack ? currentTrack.height : 0;
                                const autoOpt = qualitySelector.querySelector('option[value="auto"]');
                                if (autoOpt) {
                                    autoOpt.textContent = h ? `Auto (${h}p)` : 'Auto';
                                }
                            }
                        });
                    } else {
                        const h = uniqueHeights.length === 1 ? uniqueHeights[0] : 0;
                        qualitySelector.innerHTML = `<option value="${h || 0}" id="single-quality-opt">${h ? h + 'p' : 'Đang tải...'}</option>`;
                        qualitySelector.classList.remove('hidden');

                        videoPlayer.addEventListener('resize', function updateRes() {
                            const realHeight = videoPlayer.videoHeight;
                            const opt = document.getElementById('single-quality-opt');
                            if (realHeight && opt && opt.textContent === 'Đang tải...') {
                                opt.textContent = `${realHeight}p`;
                                videoPlayer.removeEventListener('resize', updateRes);
                            }
                        });
                    }
                } catch (e) {
                    showToast('Lỗi phát DASH/DRM: ' + e.message, 'error');
                }

                if (shakaInstance && shakaInstance.isLive && shakaInstance.isLive()) {
                    if (liveEdgeCheckInterval) clearInterval(liveEdgeCheckInterval);
                    liveEdgeCheckInterval = setInterval(() => {
                        if (!shakaInstance || !shakaInstance.isLive()) return;
                        try {
                            const seekRange = shakaInstance.seekRange();
                            const currentPos = videoPlayer.currentTime;
                            const liveEdge = seekRange.end;
                            const drift = liveEdge - currentPos;
                            if (drift > 15 && !videoPlayer.paused) {
                                console.warn(`[Audio Fix][Shaka] Drift ${drift.toFixed(1)}s, seeking to live edge...`);
                                videoPlayer.currentTime = liveEdge - 2;
                            }
                        } catch (e) { /* Shaka may be destroyed */ }
                    }, 30000);
                }

            }
            else if (typeof Hls !== 'undefined' && Hls.isSupported() && !isMPD) {
                hlsInstance = new Hls({
                    enableWorker: false,
                    lowLatencyMode: false,
                    backBufferLength: 10,
                    maxBufferLength: 30,
                    maxMaxBufferLength: 60,
                    maxBufferSize: 60 * 1000 * 1000,
                    manifestLoadingMaxRetry: 10,
                    manifestLoadingRetryDelay: 1000,
                    manifestLoadingMaxRetryTimeout: 64000,
                    levelLoadingMaxRetry: 10,
                    fragLoadingMaxRetry: 10,
                    fragLoadingRetryDelay: 1000,
                    startLevel: -1,
                    abrEwmaFastLive: 3,
                    abrEwmaSlowLive: 9,
                    abrEwmaFastVoD: 3,
                    abrEwmaSlowVoD: 9,
                    abrBandWidthFactor: 0.7,
                    abrBandWidthUpFactor: 0.5,
                    abrMaxWithRealBitrate: true,
                    abrEwmaDefaultEstimate: 500000,
                    abrEwmaDefaultEstimateMax: 5000000,
                    liveSyncDurationCount: 3,
                    liveMaxLatencyDurationCount: 6,
                    stretchShortVideoTrack: true,
                    maxBufferHole: 2.0,
                    highBufferWatchdogPeriod: 2,
                    forceKeyFrameOnDiscontinuity: true,
                    progressive: false,
                    maxAudioFramesDrift: 1,
                    initialLiveManifestSize: 3,
                });

                hlsInstance.loadSource(resolvedUrl);
                hlsInstance.attachMedia(videoPlayer);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoPlayer.play().catch(e => {
                        showToast('Nhấn nút Play để chạy luồng.', 'warning');
                        loadingOverlay.classList.add('hidden');
                    });

                    if (hlsInstance.levels && hlsInstance.levels.length > 0) {
                        const allAudioOnly = hlsInstance.levels.every(l => !l.videoCodec || l.videoCodec === '');
                        if (allAudioOnly) {
                            showAudioVisualizer(channel);
                        }
                    }

                    const qualitySelector = document.getElementById('quality-selector');
                    if (hlsInstance.levels && hlsInstance.levels.length > 1) {
                        const currentLvl = hlsInstance.levels[hlsInstance.currentLevel] || hlsInstance.levels[0];
                        const initH = currentLvl ? currentLvl.height : 0;
                        qualitySelector.innerHTML = `<option value="-1">Auto${initH ? ' (' + initH + 'p)' : ''}</option>`;
                        hlsInstance.levels.forEach((level, i) => {
                            const opt = document.createElement('option');
                            opt.value = i;
                            opt.textContent = level.height ? `${level.height}p` : `Chất lượng ${i + 1}`;
                            qualitySelector.appendChild(opt);
                        });
                        qualitySelector.classList.remove('hidden');
                    } else {
                        const h = hlsInstance.levels && hlsInstance.levels.length === 1 ? hlsInstance.levels[0].height : 0;
                        qualitySelector.innerHTML = `<option value="0" id="single-quality-opt">${h ? h + 'p' : 'Đang tải...'}</option>`;
                        qualitySelector.classList.remove('hidden');

                        videoPlayer.addEventListener('resize', function updateRes() {
                            const realHeight = videoPlayer.videoHeight;
                            const opt = document.getElementById('single-quality-opt');
                            if (realHeight && opt && opt.textContent === 'Đang tải...') {
                                opt.textContent = `${realHeight}p`;
                                videoPlayer.removeEventListener('resize', updateRes);
                            }
                        });
                    }
                });

                hlsInstance.on(Hls.Events.LEVEL_SWITCHED, (event, data) => {
                    const qualitySelector = document.getElementById('quality-selector');
                    if (!qualitySelector) return;
                    if (hlsInstance.autoLevelEnabled && qualitySelector.value === '-1') {
                        const level = hlsInstance.levels[data.level];
                        const h = level ? level.height : 0;
                        const autoOpt = qualitySelector.querySelector('option[value="-1"]');
                        if (autoOpt) {
                            autoOpt.textContent = h ? `Auto (${h}p)` : 'Auto';
                        }
                    }
                });

                let liveEdgeSetup = false;
                hlsInstance.on(Hls.Events.LEVEL_LOADED, (event, data) => {
                    if (data.details && data.details.live && !liveEdgeSetup) {
                        liveEdgeSetup = true;
                        if (liveEdgeCheckInterval) clearInterval(liveEdgeCheckInterval);
                        liveEdgeCheckInterval = setInterval(() => {
                            if (!hlsInstance || !hlsInstance.liveSyncPosition) return;
                            const liveEdge = hlsInstance.liveSyncPosition;
                            const currentPos = videoPlayer.currentTime;
                            const drift = liveEdge - currentPos;

                            if (drift > 15 && !videoPlayer.paused) {
                                console.warn(`[Audio Fix] Drift ${drift.toFixed(1)}s, seeking to live edge...`);
                                videoPlayer.currentTime = liveEdge - 2;
                            }
                        }, 30000);
                    }
                });

                hlsInstance.on(Hls.Events.FRAG_CHANGED, (event, data) => {
                    if (data.frag && data.frag.tagList && data.frag.tagList.includes('DISCONTINUITY')) {
                        console.warn('[Audio-Fix] Discontinuity detected, letting Hls.js sync...');
                    }
                });
                let hlsErrorRecoveries = 0;
                let hlsNetworkRecoveries = 0;

                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.warn('HLS network error, retrying...', data.details);
                                if (hlsNetworkRecoveries < 5) {
                                    hlsNetworkRecoveries++;
                                    hlsInstance.startLoad();
                                } else if (hlsErrorRecoveries < 2) {
                                    hlsErrorRecoveries++;
                                    hlsNetworkRecoveries = 0;
                                    hlsInstance.startLoad();
                                } else {
                                    showToast('Lỗi mạng kéo dài, đang tải lại luồng...', 'warning');
                                    setTimeout(() => { if (currentPlayingUrl === url) playChannel(channel); }, 5000);
                                }
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.warn('HLS media error, recovering...', data.details);
                                if (hlsErrorRecoveries < 3) {
                                    hlsErrorRecoveries++;
                                    hlsInstance.recoverMediaError();
                                } else if (hlsErrorRecoveries === 3) {
                                    hlsErrorRecoveries++;
                                    hlsInstance.swapAudioCodec();
                                    hlsInstance.recoverMediaError();
                                } else {
                                    showToast('Lỗi dữ liệu luồng không thể phục hồi, đang tải lại...', 'error');
                                    setTimeout(() => { if (currentPlayingUrl === url) playChannel(channel); }, 5000);
                                }
                                break;
                            default:
                                console.error('HLS Fatal Error:', data);
                                hlsInstance.destroy();
                                setTimeout(() => {
                                    if (currentPlayingUrl === url) playChannel(channel);
                                }, 5000);
                                break;
                        }
                    }
                });

            }
            else if (typeof mpegts !== 'undefined' && mpegts.isSupported() && isRawTS) {
                mpegtsInstance = mpegts.createPlayer({
                    type: 'mpegts',
                    isLive: true,
                    url: resolvedUrl
                }, {
                    enableWorker: true,
                    liveBufferLatencyChasing: false,
                    liveBufferLatencyMaxLatency: 5,
                    liveBufferLatencyMinRemain: 1.0,
                    autoCleanupSourceBuffer: true,
                    autoCleanupMaxBackwardDuration: 30,
                    autoCleanupMinBackwardDuration: 15,
                    fixAudioTimestampGap: true,
                });

                mpegtsInstance.attachMediaElement(videoPlayer);
                mpegtsInstance.load();
                mpegtsInstance.play().catch(e => {
                    showToast('Nhấn nút Play để chạy luồng TS.', 'warning');
                    loadingOverlay.classList.add('hidden');
                });

                let mpegtsRetries = 0;
                mpegtsInstance.on(mpegts.Events.ERROR, (errorType, errorDetail, errorInfo) => {
                    console.error('mpegts.js Error:', errorType, errorDetail, errorInfo);
                    if (errorType === mpegts.ErrorTypes.NETWORK_ERROR) {
                        if (mpegtsRetries < 3) {
                            mpegtsRetries++;
                            console.log(`Mpegts network error, retry ${mpegtsRetries}...`);
                        } else {
                            showToast('Lỗi mạng luồng TS. Đang thử lại...', 'error');
                            setTimeout(() => {
                                if (currentPlayingUrl === url) playChannel(channel);
                            }, 5000);
                        }
                    }
                });

                document.getElementById('quality-selector').classList.add('hidden');
            }
            else {
                videoPlayer.src = resolvedUrl;
                videoPlayer.play().catch(e => {
                    loadingOverlay.classList.add('hidden');
                    showToast('Đang chờ trình duyệt tải video...', 'info');
                });
            }

            videoPlayer.onplaying = () => {
                loadingOverlay.classList.add('hidden');

                const isKnownAudioSource = currentPlayingUrl.includes('zmp3.zmdcdn.me') ||
                    currentPlayingUrl.includes('mp3.zing.vn') ||
                    /\.(mp3|aac|ogg|flac|opus)(\?|$)/i.test(currentPlayingUrl);
                if (isKnownAudioSource) {
                    showAudioVisualizer(channel);
                }
            };

            videoPlayer.onwaiting = () => {
                loadingOverlay.classList.remove('hidden');
            };

            videoPlayer.onerror = () => {
                if (!hlsInstance && !shakaInstance && !mpegtsInstance) {
                    showToast('Lỗi phát luồng trình duyệt. Đang thử lại...', 'error');
                    setTimeout(() => {
                        if (currentPlayingUrl === url) playChannel(channel);
                    }, 4000);
                }
            };
        }

        document.getElementById('quality-selector').addEventListener('change', (e) => {
            const val = e.target.value;
            const label = e.target.options[e.target.selectedIndex].text;

            if (hlsInstance) {
                hlsInstance.currentLevel = val === 'auto' || val === '-1' ? -1 : parseInt(val);
            } else if (shakaInstance) {
                if (val === 'auto') {
                    shakaInstance.configure({ abr: { enabled: true } });
                } else {
                    shakaInstance.configure({ abr: { enabled: false } });
                    const targetHeight = parseInt(val);
                    const tracks = shakaInstance.getVariantTracks();
                    const match = tracks.find(t => t.height === targetHeight);
                    if (match) shakaInstance.selectVariantTrack(match, true);
                }
            }
            showToast(`Chất lượng: ${label}`, 'success');
        });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        });

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => fetchEPG(), 100);
        });
    </script>
</body>
