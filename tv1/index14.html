<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src *; media-src * blob: data:; img-src * data:;">
    <title>Lotus Player</title>
    <link rel="icon" href="TV.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-main: #19202c;
            --header-bg: #1e2837;
            --card-bg: #2b3648;
            --active-blue: #2563eb;
            --live-red: #dc2626;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            margin: 0;
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        /* Channel Item Styles */
        .channel-item {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 8px;
        }

        .channel-item:hover {
            background-color: #354257;
        }

        .channel-item.active {
            background-color: var(--active-blue) !important;
        }

        /* Floating Controls & Overlays */
        .player-float-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .video-container:hover .player-float-controls {
            opacity: 1;
        }

        .ctrl-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* EPG Side Panel */
        #epg-panel {
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 40;
        }
        #epg-panel.open {
            transform: translateX(0);
        }
    </style>
</head>

<body class="flex flex-col h-screen w-screen overflow-hidden">
    <div id="toast-container"></div>

    <!-- TOP HEADER -->
    <header class="h-14 bg-[#1e2837] px-4 flex items-center justify-between border-b border-slate-700/50 shrink-0">
        <div class="flex items-center gap-2">
            <i data-lucide="tv" class="w-5 h-5 text-cyan-400"></i>
            <h1 class="font-bold text-red-500 text-base tracking-wider uppercase">LOTUS PLAYER</h1>
        </div>
        <div class="bg-slate-800/80 border border-slate-700 px-3 py-1 rounded-md text-xs text-slate-300 flex items-center gap-1.5">
            <span class="text-slate-400">Đang phát:</span>
            <span id="current-playing-title" class="font-medium text-white">Chưa chọn kênh</span>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="flex-1 flex flex-col overflow-hidden">
        
        <!-- VIDEO PLAYER SECTION -->
        <main class="w-full bg-black relative shrink-0 aspect-video max-h-[40vh] sm:max-h-[50vh] video-container overflow-hidden">
            <video id="video-player" class="w-full h-full object-contain" playsinline controls></video>

            <!-- Overlay Intro -->
            <div id="player-overlay" class="absolute inset-0 flex items-center justify-center bg-black/80 pointer-events-none">
                <div class="w-16 h-16 rounded-full bg-indigo-600/30 flex items-center justify-center">
                    <i data-lucide="play" class="w-8 h-8 text-indigo-400 fill-indigo-400 ml-1"></i>
                </div>
            </div>

            <!-- Audio Visualizer -->
            <div id="audio-visualizer" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 hidden z-10">
                <i id="audio-visualizer-icon" data-lucide="radio" class="w-12 h-12 text-cyan-400 mb-2"></i>
                <img id="audio-visualizer-logo" src="" class="max-w-[120px] mb-2 hidden">
                <h3 id="audio-visualizer-title" class="text-white font-semibold">Radio Stream</h3>
                <p id="audio-visualizer-desc" class="text-xs text-slate-400">Đang phát âm thanh</p>
            </div>

            <!-- Floating Player Controls -->
            <div class="player-float-controls" id="float-controls">
                <button class="ctrl-btn" title="Dừng" onclick="stopChannel()"><i data-lucide="square" class="w-4 h-4 fill-current"></i></button>
                <select id="quality-selector" class="bg-black/80 text-white text-xs px-2 py-1 rounded border border-slate-700 hidden">
                    <option value="-1">Auto</option>
                </select>
                <button class="ctrl-btn" title="Toàn màn hình" onclick="toggleFullscreen()"><i data-lucide="maximize" class="w-4 h-4"></i></button>
            </div>

            <!-- Loading Spinner -->
            <div id="loading-overlay" class="absolute inset-0 bg-black/70 flex flex-col items-center justify-center hidden z-20">
                <div class="w-8 h-8 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
                <p id="resolve-status" class="text-xs text-cyan-300 mt-2">Đang tải stream...</p>
            </div>

            <!-- EPG Panel -->
            <div id="epg-panel" class="absolute inset-y-0 left-0 w-72 bg-slate-900/95 p-4 flex flex-col border-r border-slate-700">
                <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                    <h2 class="text-sm font-bold text-white flex items-center gap-2">
                        <i data-lucide="calendar" class="w-4 h-4 text-cyan-400"></i>
                        <span id="epg-title">Lịch phát sóng</span>
                    </h2>
                    <button onclick="toggleEPG()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
                <div id="epg-content" class="flex-1 overflow-y-auto mt-2 text-xs custom-scrollbar">
                    <p class="text-slate-500 text-center mt-4">Chọn kênh để xem lịch</p>
                </div>
            </div>

            <button id="epg-toggle-btn" onclick="toggleEPG()" class="absolute top-3 left-3 z-30 p-2 rounded-lg bg-black/60 text-white hidden">
                <i data-lucide="calendar" class="w-4 h-4"></i>
            </button>
        </main>

        <!-- CATEGORIES / GROUP TITLE AREA -->
        <div class="bg-[#19202c] px-4 py-3 flex items-center justify-between shrink-0 border-b border-slate-800">
            <h2 id="current-group-label" class="text-sm font-bold tracking-wider text-slate-200 uppercase">DANH SÁCH KÊNH</h2>
            <div class="flex items-center gap-2">
                <span class="bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded">LIVE</span>
                <button onclick="openAddDialog()" class="w-7 h-7 bg-blue-600 hover:bg-blue-700 text-white rounded flex items-center justify-center transition-colors">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- CHANNEL LIST AREA -->
        <aside id="sidebar" class="flex-1 overflow-y-auto px-4 py-2 custom-scrollbar bg-[#19202c]">
            <!-- Search & Actions Bar -->
            <div class="mb-3 relative">
                <input type="text" id="search-input" placeholder="Tìm kiếm kênh..." 
                    class="w-full bg-[#2b3648] text-xs text-white pl-9 pr-8 py-2 rounded-md border border-slate-700/50 focus:outline-none focus:border-blue-500"
                    oninput="filterChannels()">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2"></i>
                <button id="clear-search-btn" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hidden" 
                    onclick="const inp = document.getElementById('search-input'); inp.value=''; filterChannels();">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
            </div>

            <!-- Categories Scroll Tabs -->
            <div id="category-tabs" class="flex gap-2 overflow-x-auto pb-2 mb-2 no-scrollbar">
                <!-- Group Tabs Rendered by JS -->
            </div>

            <!-- Channels Container -->
            <ul id="channel-list" class="space-y-1">
                <div id="empty-state" class="py-12 text-center text-slate-500">
                    <i data-lucide="layout-list" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
                    <p class="text-xs">Chưa có kênh nào. Bấm (+) để thêm playlist</p>
                </div>
            </ul>
        </aside>

        <!-- FOOTER INFO -->
        <footer class="bg-[#1e2837] px-4 py-2 flex items-center justify-between text-[11px] text-slate-400 border-t border-slate-800 shrink-0">
            <span id="channel-count">0 Kênh</span>
            <button onclick="clearList()" class="hover:text-red-400 font-medium">Dọn dẹp</button>
        </footer>
    </div>

    <!-- ADD PLAYLIST MODAL -->
    <div id="add-dialog" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 opacity-0 pointer-events-none transition-opacity">
        <div id="add-dialog-content" class="bg-[#1e2837] border border-slate-700 rounded-xl p-5 w-full max-w-sm flex flex-col gap-4 text-white shadow-2xl transition-transform scale-95">
            <div class="flex items-center justify-between border-b border-slate-700 pb-2">
                <h3 class="font-bold text-sm flex items-center gap-2">
                    <i data-lucide="list-plus" class="w-4 h-4 text-cyan-400"></i> Thêm Nguồn Phát
                </h3>
                <button onclick="closeAddDialog()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>

            <div class="flex flex-col gap-2">
                <label class="text-xs text-slate-400">Nguồn phát nhanh</label>
                <!-- Đã chỉnh sửa grid thành grid-cols-3 để tránh bị tràn/xuống dòng thừa -->
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="loadPredefinedUrl('https://raw.githubusercontent.com/hieu-TQS/error/refs/heads/main/error.m3u')" class="p-2 bg-slate-800 hover:bg-slate-700 rounded text-xs font-semibold text-center border border-slate-700 truncate">TV</button>
                    <button onclick="loadPredefinedUrl('https://tinyurl.com/HoiQuanClick/')" class="p-2 bg-slate-800 hover:bg-slate-700 rounded text-xs font-semibold text-center border border-slate-700 truncate">Hội Quán</button>
                    <button onclick="loadPredefinedUrl('https://raw.githubusercontent.com/thanhchuong251085-cell/Hana2019/main/tviptv.m3u')" class="p-2 bg-slate-800 hover:bg-slate-700 rounded text-xs font-semibold text-center border border-slate-700 truncate">Bóng Đá</button>
                </div>
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-xs text-slate-400">URL Playlist M3U</label>
                <div class="flex gap-1">
                    <input type="text" id="url-input" placeholder="https://..." class="flex-1 bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
                    <button onclick="loadFromUrl(); closeAddDialog();" class="bg-blue-600 hover:bg-blue-700 px-3 py-1.5 rounded text-xs font-medium shrink-0">Tải</button>
                </div>
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-xs text-slate-400">Mở File từ thiết bị</label>
                <input type="file" id="file-upload" accept=".m3u,.m3u8,.json" class="hidden" onchange="handleFileUpload(event); closeAddDialog();">
                <label for="file-upload" class="cursor-pointer bg-slate-800 hover:bg-slate-700 border border-slate-700 p-2 rounded text-xs text-center font-medium block">
                    Chọn tệp .m3u
                </label>
            </div>
        </div>
    </div>

    <script>
        // Khởi tạo icons
        lucide.createIcons();
        if (typeof shaka !== 'undefined') shaka.polyfill.installAll();

        // ============================================================
        // LINK RESOLVER ENGINE V4 — XHR + BLOB URL
        // ============================================================
        async function resolveStreamUrl(url, channelProps = {}) {
            if (isDirectStreamUrl(url)) return url;

            console.log(`[Resolver] Resolving PHP: ${url.substring(0, 100)}`);
            const startTime = Date.now();

            try {
                const result = await xhrFetchText(url);
                if (result.text && result.text.length > 5) {
                    const parsed = parseResponseForStream(result.text, result.finalUrl || url, url);
                    if (parsed) {
                        const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                        console.log(`[Resolver] ✅ XHR OK (${elapsed}s): ${String(parsed).substring(0, 120)}`);
                        return parsed;
                    }
                    if (result.finalUrl && result.finalUrl !== url && /\.(m3u8|mpd|ts)(\?|#|$)/i.test(result.finalUrl)) {
                        console.log(`[Resolver] ✅ XHR finalUrl: ${result.finalUrl.substring(0,120)}`);
                        return result.finalUrl;
                    }
                }
            } catch (e) {
                console.warn('[Resolver] XHR failed:', e.message);
            }

            try {
                const response = await fetch(url, {
                    headers: {
                        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                        'Accept': '*/*',
                        'Referer': 'https://vietanhtv.id.vn/',
                    },
                    redirect: 'follow',
                });
                if (response.ok) {
                    const finalUrl = response.url;
                    const text = await response.text();
                    const parsed = parseResponseForStream(text, finalUrl, url);
                    if (parsed) {
                        const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                        console.log(`[Resolver] ✅ Fetch OK (${elapsed}s): ${String(parsed).substring(0, 120)}`);
                        return parsed;
                    }
                    if (finalUrl !== url && !finalUrl.includes('.php')) return finalUrl;
                }
            } catch (e) {
                console.warn('[Resolver] Fetch failed:', e.message);
            }

            const CORS_PROXIES = [
                'https://api.allorigins.win/raw?url=',
                'https://corsproxy.io/?url=',
            ];
            for (const proxy of CORS_PROXIES) {
                try {
                    const proxyUrl = proxy + encodeURIComponent(url);
                    const resp = await fetch(proxyUrl, { redirect: 'follow' });
                    if (resp.ok) {
                        const text = await resp.text();
                        if (text && text.length > 5) {
                            const parsed = parseResponseForStream(text, url, url);
                            if (parsed) {
                                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                                console.log(`[Resolver] ✅ Proxy ${proxy} OK (${elapsed}s): ${String(parsed).substring(0, 120)}`);
                                return parsed;
                            }
                            if (text.includes('#EXTM3U') || text.includes('#EXTINF')) {
                                const blob = new Blob([text], { type: 'application/vnd.apple.mpegurl' });
                                if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
                                currentBlobUrl = URL.createObjectURL(blob);
                                console.log(`[Resolver] ✅ Proxy ${proxy} → Blob URL: ${currentBlobUrl.substring(0,50)}`);
                                return currentBlobUrl;
                            }
                        }
                    }
                } catch (e) {
                    console.warn(`[Resolver] Proxy ${proxy} failed:`, e.message);
                }
            }

            console.warn(`[Resolver] ❌ Thất bại sau ${((Date.now()-startTime)/1000).toFixed(1)}s`);
            return url;
        }

        function xhrFetchText(url) {
            return new Promise((resolve, reject) => {
                try {
                    const xhr = new XMLHttpRequest();
                    xhr.open('GET', url, true);
                    xhr.timeout = 20000;
                    xhr.setRequestHeader('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36');
                    xhr.setRequestHeader('Accept', '*/*');
                    xhr.setRequestHeader('Referer', 'https://vietanhtv.id.vn/');
                    xhr.responseType = 'text';

                    xhr.onload = function() {
                        if (xhr.status === 200 || xhr.status === 302 || xhr.status === 301 || xhr.status === 0) {
                            resolve({
                                text: xhr.responseText,
                                finalUrl: xhr.responseURL || url
                            });
                        } else {
                            reject(new Error(`HTTP ${xhr.status}`));
                        }
                    };
                    xhr.onerror = () => reject(new Error('XHR error'));
                    xhr.ontimeout = () => reject(new Error('XHR timeout'));
                    xhr.send();
                } catch (e) {
                    reject(e);
                }
            });
        }

        function parseResponseForStream(text, finalUrl, originalUrl) {
            if (!text || text.length < 5) return null;
            const trimmed = text.trim();

            if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
                try {
                    const json = JSON.parse(trimmed);
                    const url = findUrlInJson(json);
                    if (url) return url;
                    if (json.keys || json.kid) return trimmed;
                } catch { /* not JSON */ }
            }

            if (text.includes('#EXTM3U') || text.includes('#EXTINF')) {
                const lines = text.split('\n');
                for (const line of lines) {
                    const l = line.trim();
                    if (l.startsWith('http') && (l.includes('.m3u8') || l.includes('.ts') || l.includes('.mp4'))) {
                        return l;
                    }
                    if (l.endsWith('.m3u8') || l.endsWith('.ts')) {
                        try { return new URL(l, finalUrl || originalUrl).href; } catch { return l; }
                    }
                }
                if (finalUrl && finalUrl !== originalUrl && !finalUrl.includes('.php')) return finalUrl;
                return text;
            }

            if (text.includes('<MPD') || (text.includes('<?xml') && text.includes('mpd:'))) {
                if (finalUrl && finalUrl !== originalUrl) return finalUrl;
                return text;
            }

            const urls = [...trimmed.matchAll(/https?:\/\/[^\s<>"']+/g)].map(m => m[0]);
            const streamUrls = urls.filter(u => /\.(m3u8|mpd|ts|mp4|flv|aac|mp3|m4a)(\?|#|$)/i.test(u));
            if (streamUrls.length > 0) return streamUrls[0];
            if (urls.length === 1) return urls[0];

            if (text.includes('<html') || text.includes('<!DOCTYPE')) {
                const patterns = [
                    /<iframe[^>]+src=["'](https?:\/\/[^"']+)["']/i,
                    /<video[^>]+src=["'](https?:\/\/[^"']+)["']/i,
                    /<source[^>]+src=["'](https?:\/\/[^"']+)["']/i,
                    /<a[^>]+href=["'](https?:\/\/[^"']+\.(?:m3u8|mpd|ts)[^"']*)["']/i,
                    /embed["']?\s*:\s*["'](https?:\/\/[^"']+)["']/i,
                    /file["']?\s*:\s*["'](https?:\/\/[^"']+)["']/i,
                ];
                for (const pattern of patterns) {
                    const match = text.match(pattern);
                    if (match) return match[1];
                }
                for (const u of urls) {
                    if (/\.(m3u8|mpd|ts)(\?|#|$)/i.test(u)) return u;
                }
            }

            const deepMatch = text.match(/https?:\/\/[^'"\s<>)]+\.(?:m3u8|mpd|ts)[^'"\s<>)]*/i);
            if (deepMatch) return deepMatch[0];

            return null;
        }

        function findUrlInJson(json) {
            if (!json || typeof json !== 'object') return null;
            const keys = ['url', 'link', 'src', 'source', 'file', 'location', 'redirect',
                'stream', 'stream_url', 'streamUrl', 'hls', 'dash', 'm3u8', 'mpd'];
            for (const key of keys) {
                if (typeof json[key] === 'string' && json[key].startsWith('http')) return json[key];
            }
            for (const key of Object.keys(json)) {
                if (typeof json[key] === 'object') {
                    const result = findUrlInJson(json[key]);
                    if (result) return result;
                }
            }
            if (Array.isArray(json)) {
                for (const item of json) {
                    const result = findUrlInJson(item);
                    if (result) return result;
                }
            }
            return null;
        }

        function isDirectStreamUrl(url) {
            if (!url) return false;
            return /\.(m3u8|mpd|ts|mp4|flv|aac|mp3|m4a|ogg|webm)(\?|#|$)/i.test(url) ||
                   url.includes('Manifest') || url.includes('playlist.m3u') ||
                   url.includes('/play/') || url.includes(':2086/') || url.includes(':2087/');
        }

        function detectStreamType(url) {
            if (!url) return 'unknown';
            if (url.includes('.mpd') || url.includes('Manifest') || url.includes('mpd:')) return 'dash';
            if (url.includes('.m3u8') || url.includes('m3u8') || url.includes('playlist.m3u')) return 'hls';
            if (url.includes('.ts') || url.includes('extension=ts')) return 'mpegts';
            if (url.includes('.mp3') || url.includes('.aac') || url.includes('.ogg') || url.includes('.flac') || url.includes('.opus')) return 'audio';
            if (url.includes('.mp4') || url.includes('.flv') || url.includes('.webm')) return 'video';
            return 'unknown';
        }

        // Trạng thái
        let allChannels = [];
        let hlsInstance = null;
        let shakaInstance = null;
        let mpegtsInstance = null;
        let currentPlayingUrl = null;
        let selectedChannelId = null;

        let liveEdgeCheckInterval = null;
        let bufferCleanupInterval = null;

        const DEFAULT_EPG_URL = 'https://vnepg.site/epg.xml';
        let epgData = new Map();
        let epgChannels = new Map();
        let isEPGPanelOpen = false;
        let epgFetchStatus = 'idle';

        const videoPlayer = document.getElementById('video-player');
        const channelListEl = document.getElementById('channel-list');
        const emptyStateEl = document.getElementById('empty-state');
        const channelCountEl = document.getElementById('channel-count');
        const searchInput = document.getElementById('search-input');
        const playerOverlay = document.getElementById('player-overlay');
        const loadingOverlay = document.getElementById('loading-overlay');
        const videoContainer = document.querySelector('.video-container');

        videoPlayer.addEventListener('resize', () => {
            const audioVis = document.getElementById('audio-visualizer');
            if (audioVis && videoPlayer.videoHeight > 0) {
                audioVis.classList.add('hidden');
            }
        });

        let inactivityTimeout;
        const CONTROLS_TIMEOUT = 2500;

        function showControls() {
            videoContainer.classList.remove('hide-cursor');
            videoContainer.classList.add('controls-active');
            clearTimeout(inactivityTimeout);
            inactivityTimeout = setTimeout(hideControls, CONTROLS_TIMEOUT);
        }

        function hideControls() {
            videoContainer.classList.remove('controls-active');
            if (document.fullscreenElement) {
                videoContainer.classList.add('hide-cursor');
            }
        }

        videoContainer.addEventListener('mousemove', showControls);
        videoContainer.addEventListener('mousedown', showControls);
        videoContainer.addEventListener('mouseleave', () => {
            clearTimeout(inactivityTimeout);
            hideControls();
        });

        videoContainer.addEventListener('touchstart', (e) => {
            const tag = e.target.tagName;

        let globalEPGUrl = '';

        function parseM3U(text) {
            text = text.replace(/http:\/\/vietanhtv\.id\.vn/g, 'https://vietanhtv.id.vn');
            text = text.replace(/http:\/\/xem\.hoiquan\.click/g, 'https://tinyurl.com/HoiQuanClick');
            const lines = text.split('\n');
            const channels = [];
            let currentChannel = null;

            const m3uHeader = lines.find(l => l.toUpperCase().startsWith('#EXTM3U'));
            if (m3uHeader) {
                const epgMatch = m3uHeader.match(/x-tvg-url="([^"]+)"/i) || m3uHeader.match(/url-tvg="([^"]+)"/i);
                if (epgMatch && epgMatch[1]) {
                    globalEPGUrl = epgMatch[1];
                    console.log("Tìm thấy EPG URL từ playlist:", globalEPGUrl);
                    fetchEPG(globalEPGUrl);
                }
            }

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.toUpperCase().includes('EXTINF:')) {
                    currentChannel = {
                        name: 'Kênh ẩn danh',
                        logo: '',
                        group: 'Khác',
                        url: '',
                        id: '',
                        props: {}
                    };

                    const commaIndex = line.lastIndexOf(',');
                    if (commaIndex !== -1) currentChannel.name = line.substring(commaIndex + 1).trim() || 'Kênh ẩn danh';

                    const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                    if (logoMatch && logoMatch[1]) currentChannel.logo = logoMatch[1];

                    const groupMatch = line.match(/group-title="([^"]+)"/i);
                    if (groupMatch && groupMatch[1]) currentChannel.group = groupMatch[1];

                    const idMatch = line.match(/tvg-id="([^"]+)"/i);
                    if (idMatch && idMatch[1]) currentChannel.id = idMatch[1];

                    const catchupMatch = line.match(/catchup="([^"]+)"/i);
                    if (catchupMatch) currentChannel.props.catchup = catchupMatch[1];

                    const catchupDaysMatch = line.match(/catchup-days="([^"]+)"/i);
                    if (catchupDaysMatch) currentChannel.props.catchupDays = catchupDaysMatch[1];

                    const catchupSourceMatch = line.match(/catchup-source="([^"]+)"/i);
                    if (catchupSourceMatch) currentChannel.props.catchupSource = catchupSourceMatch[1];

                } else if (line.toUpperCase().startsWith('#KODIPROP:')) {
                    if (currentChannel) {
                        const propLine = line.substring(10).trim();
                        const equalIdx = propLine.indexOf('=');
                        if (equalIdx !== -1) {
                            const key = propLine.substring(0, equalIdx).trim();
                            const val = propLine.substring(equalIdx + 1).trim();
                            currentChannel.props[key] = val;
                        }
                    }
                } else if (line.toUpperCase().startsWith('#EXTVLCOPT:')) {
                    if (currentChannel) {
                        const optLine = line.substring(11).trim();
                        const equalIdx = optLine.indexOf('=');
                        if (equalIdx !== -1) {
                            const key = optLine.substring(0, equalIdx).trim();
                            const val = optLine.substring(equalIdx + 1).trim();
                            currentChannel.props[key] = val;
                        }
                    }
                } else if (line !== '' && !line.startsWith('#')) {
                    if (currentChannel) {
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = null;
                    } else {
                        channels.push({
                            name: line.split('/').pop() || 'Luồng trực tiếp',
                            logo: '',
                            group: 'Khác',
                            url: line,
                            id: '',
                            props: {}
                        });
                    }
                }
            }
            return channels;
        }

        function parseJSON(data) {
            let dataStr = JSON.stringify(data);
            dataStr = dataStr.replace(/http:\/\/vietanhtv\.id\.vn/g, 'https://vietanhtv.id.vn');
            dataStr = dataStr.replace(/http:\/\/xem\.hoiquan\.click/g, 'https://tinyurl.com/HoiQuanClick');
            data = JSON.parse(dataStr);

            if (data && data.groups && Array.isArray(data.groups)) {
                const channels = [];
                data.groups.forEach(group => {
                    if (group.channels && Array.isArray(group.channels)) {
                        group.channels.forEach(channel => {
                            let streamUrl = '';
                            if (channel.sources && channel.sources[0] &&
                                channel.sources[0].contents && channel.sources[0].contents[0] &&
                                channel.sources[0].contents[0].streams && channel.sources[0].contents[0].streams[0] &&
                                channel.sources[0].contents[0].streams[0].stream_links &&
                                channel.sources[0].contents[0].streams[0].stream_links[0]) {
                                streamUrl = channel.sources[0].contents[0].streams[0].stream_links[0].url;
                            }

                            if (streamUrl) {
                                channels.push({
                                    name: channel.name || 'Kênh Live Sport',
                                    url: streamUrl,
                                    logo: (channel.image && channel.image.url) ? channel.image.url : '',
                                    group: group.name || 'Bóng Đá'
                                });
                            }
                        });
                    }
                });
                return channels;
            }

            if (!Array.isArray(data)) data = data.channels || [];
            return data.map(item => ({
                name: item.name || item.title || item.channel || 'Kênh ẩn danh',
                url: item.url || item.link || item.stream || '',
                logo: item.logo || item.icon || item.tvg_logo || '',
                group: item.group || item.category || 'Khác'
            })).filter(item => item.url !== '');
        }

        async function loadFromUrl() {
            const urlInput = document.getElementById('url-input').value.trim();
            if (!urlInput) return showToast('Vui lòng dán đường dẫn URL!', 'error');

            const isDirectM3U8 = /\.m3u8(\?|#|$)/i.test(urlInput);
            const isDirectMPD = /\.mpd(\?|#|$)/i.test(urlInput);
            const isDirectTS = /\.ts(\?|#|$)/i.test(urlInput) || /extension=ts/i.test(urlInput);

            if (isDirectM3U8 || isDirectMPD || isDirectTS) {
                closeAddDialog();
                try {
                    const pathParts = new URL(urlInput).pathname.split('/');
                    var streamName = decodeURIComponent(pathParts.filter(p => p).pop() || 'Luồng trực tiếp');
                    streamName = streamName.replace(/\.(m3u8|mpd|ts)$/i, '');
                } catch (e) {
                    var streamName = 'Luồng trực tiếp';
                }
                showToast(`Đang phát: ${streamName}`, 'success');
                playChannel({
                    name: streamName,
                    url: urlInput,
                    logo: '',
                    group: 'Phát trực tiếp',
                    props: {}
                });
                return;
            }

            showToast('Đang kết nối URL...', 'success');
            let text = '';

            const isLocal = !urlInput.startsWith('http');
            const proxies = isLocal ? [''] : [
                '', 
                'https://api.allorigins.win/raw?url=', 
                'https://corsproxy.io/?url=', 
                'https://crossorigin.me/', 
            ];

            let success = false;
            let lastError = null;

            for (const proxy of proxies) {
                try {
                    const fetchUrl = proxy ? proxy + encodeURIComponent(urlInput) : urlInput;
                    const response = await fetch(fetchUrl, {
                        headers: {
                            'Accept': 'text/plain, */*'
                        }
                    });

                    if (response.ok) {
                        text = await response.text();
                        const isM3U = text.includes('#EXTM3U') || text.toUpperCase().includes('EXTINF:');
                        const isJSON = text.trim().startsWith('{') || text.trim().startsWith('[');

                        if (isM3U || isJSON) {
                            success = true;
                            console.log(`Đã tải nguồn phát thành công bằng luồng: ${proxy ? 'Proxy ' + proxy : 'Direct'}`);
                            break; 
                        } else {
                            throw new Error('Nội dung trả về không phải định dạng nguồn phát hợp lệ.');
                        }
                    } else {
                        throw new Error(`Mã lỗi HTTP: ${response.status}`);
                    }
                } catch (e) {
                    lastError = e;
                    console.warn(`Thử fetch thất bại với ${proxy ? 'proxy ' + proxy : 'luồng trực tiếp'}:`, e.message);
                }
            }

            if (!success) {
                console.error("Lỗi get link cuối cùng:", lastError);
                return showToast('Website gốc đang chặn quyền truy cập (CORS) hoặc bị lỗi kĩ thuật.', 'error');
            }

            try { processData(parseJSON(JSON.parse(text))); }
            catch (e) { processData(parseM3U(text)); }
        }

        function base64ToHex(base64) {
            if (!base64) return '';
            let b64 = base64.replace(/-/g, '+').replace(/_/g, '/');
            while (b64.length % 4 !== 0) b64 += '=';
            try {
                const raw = atob(b64);
                let result = '';
                for (let i = 0; i < raw.length; i++) {
                    const hex = raw.charCodeAt(i).toString(16);
                    result += (hex.length === 2 ? hex : '0' + hex);
                }
                return result.toLowerCase();
            } catch (e) {
                console.error("Lỗi giải mã Base64:", e);
                return '';
            }
        }

        async function fetchEPG(url) {
            if (epgFetchStatus === 'fetching' && !url) return;
            epgFetchStatus = 'fetching';

            const localUrl = 'http://data.local/epg.xml';
            const remoteUrl = url || DEFAULT_EPG_URL;

            let text = '';
            let success = false;

            try {
                const localResponse = await fetch(localUrl);
                if (localResponse.ok) {
                    text = await localResponse.text();
                    if (text.length > 1000 && text.includes('<?xml')) {
                        success = true;
                        console.log('[EPG] Đọc từ local epg.xml thành công, kích thước:', text.length);
                    }
                }
            } catch (e) {
                console.log('[EPG] Không có file local, thử tải từ mạng...');
            }

            if (!success) {
                console.log('[EPG] Đang tải EPG từ:', remoteUrl);
                try {
                    const response = await fetch(remoteUrl);
                    if (response.ok) {
                        text = await response.text();
                        if (text.length > 1000 && text.includes('<?xml')) success = true;
                    }
                } catch (e) {
                    console.warn('[EPG] Fetch trực tiếp thất bại:', e.message);
                }
            }

            if (!success) {
                epgFetchStatus = 'error';
                showToast('Không thể tải lịch phát sóng. Vui lòng thử lại.', 'error');
                return;
            }

            try {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(text, "text/xml");

                const channels = xmlDoc.getElementsByTagName('channel');
                for (let ch of channels) {
                    const id = ch.getAttribute('id');
                    const name = ch.getElementsByTagName('display-name')[0]?.textContent || id;
                    epgChannels.set(id, name);
                }

                const programmes = xmlDoc.getElementsByTagName('programme');
                const tempEpgData = new Map();

                for (let prog of programmes) {
                    const channelId = prog.getAttribute('channel');
                    const startStr = prog.getAttribute('start');
                    const stopStr = prog.getAttribute('stop');
                    const title = prog.getElementsByTagName('title')[0]?.textContent || 'Không tên';
                    const desc = prog.getElementsByTagName('desc')[0]?.textContent || '';

                    if (!tempEpgData.has(channelId)) tempEpgData.set(channelId, []);

                    tempEpgData.get(channelId).push({
                        start: parseXMLTVDate(startStr),
                        stop: parseXMLTVDate(stopStr),
                        title,
                        desc
                    });
                }

                epgData = tempEpgData;
                epgFetchStatus = 'success';
                console.log(`Đã tải xong EPG cho ${epgData.size} kênh.`);
                showToast(`Đã cập nhật lịch phát sóng (${epgData.size} kênh)`);

                filterChannels();
            } catch (e) {
                console.error("Lỗi parse XMLTV:", e);
                epgFetchStatus = 'error';
                showToast('Lỗi khi tải lịch phát sóng.', 'error');
            }
        }

        function findEPGId(id) {
            if (!id) return null;
            const cleanId = id.toLowerCase().trim();

            if (epgData.has(id)) return id;

            for (let key of epgData.keys()) {
                if (key.toLowerCase() === cleanId) return key;
            }

            const mapped = CHANNEL_NAME_MAP[cleanId];
            if (mapped && epgData.has(mapped)) return mapped;

            for (let [epgId, epgName] of epgChannels.entries()) {
                if (epgName && epgName.toLowerCase().trim() === cleanId) return epgId;
            }

            for (let key of epgData.keys()) {
                const stripped = key.toLowerCase().replace(/(hd2?|vn|sd)$/, '');
                if (stripped === cleanId) return key;
            }

            for (let [epgId, epgName] of epgChannels.entries()) {
                if (!epgName) continue;
                const lName = epgName.toLowerCase();
                if ((lName === cleanId) ||
                    (lName.startsWith(cleanId) && lName.length - cleanId.length <= 4) ||
                    (cleanId.startsWith(lName) && cleanId.length - lName.length <= 4)) {
                    return epgId;
                }
            }

            return null;
        }

        function parseXMLTVDate(str) {
            if (!str) return new Date();
            const y = str.substring(0, 4);
            const m = str.substring(4, 6) - 1;
            const d = str.substring(6, 8);
            const h = str.substring(8, 10);
            const min = str.substring(10, 12);
            const s = str.substring(12, 14);

            const date = new Date(Date.UTC(y, m, d, h, min, s));
            const tzMatch = str.match(/([+-])(\d{2})(\d{2})$/);
            if (tzMatch) {
                const sign = tzMatch[1] === '+' ? 1 : -1;
                const hours = parseInt(tzMatch[2]);
                const minutes = parseInt(tzMatch[3]);
                const offsetMs = (hours * 60 + minutes) * 60000 * sign;
                return new Date(date.getTime() - offsetMs);
            }
            return date;
        }

        function renderEPG(channelIdOrName) {
            const container = document.getElementById('epg-content');
            container.innerHTML = '';

            const epgId = findEPGId(channelIdOrName);

            const titleEl = document.getElementById('epg-title');
            if (titleEl) {
                const channel = allChannels.find(c => (c.id === channelIdOrName || c.name === channelIdOrName));
                if (channel) {
                    titleEl.textContent = channel.name;
                } else if (epgId && epgChannels.has(epgId)) {
                    titleEl.textContent = epgChannels.get(epgId);
                } else if (channelIdOrName) {
                    titleEl.textContent = channelIdOrName;
                } else {
                    titleEl.textContent = 'Lịch Phát Sóng';
                }
            }

            if (!epgId || !epgData.has(epgId)) {
                container.innerHTML = `
                        <div class="h-full flex flex-col items-center justify-center text-center opacity-40 p-6">
                            <i data-lucide="info" class="w-8 h-8 mb-3"></i>
                            <p class="text-xs">Không có dữ liệu lịch phát sóng cho: ${channelIdOrName || 'N/A'}</p>

                        </div>
                    `;
                lucide.createIcons({ root: container });
                return;
            }

            const programs = epgData.get(epgId).sort((a, b) => a.start - b.start);
            const now = new Date();

            const filtered = programs.filter(p => {
                const end = new Date(p.stop);
                return end >= now;
            }).slice(0, 50);

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-center text-muted text-xs p-10">Hết lịch phát sóng hôm nay.</p>`;
                return;
            }

            const fragment = document.createDocumentFragment();
            filtered.forEach(p => {
                const isCurrent = p.start <= now && p.stop >= now;
                const item = document.createElement('div');
                item.className = `epg-item p-3 mb-2 rounded-xl bg-white/[0.03] border border-white/5 ${isCurrent ? 'current' : ''}`;

                const startTime = p.start.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
                const endTime = p.stop.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

                let progressHtml = '';
                if (isCurrent) {
                    const total = p.stop - p.start;
                    const elapsed = now - p.start;
                    const percent = Math.min(100, Math.max(0, (elapsed / total) * 100));
                    progressHtml = `
                            <div class="epg-progress">
                                <div class="epg-progress-bar" style="width: ${percent}%"></div>
                            </div>
                        `;
                }

                item.innerHTML = `
                        <div class="flex justify-between items-start mb-1">
                            <span class="text-[10px] font-bold text-indigo-400">${startTime} - ${endTime}</span>
                            ${isCurrent ? '<span class="px-1.5 py-0.5 rounded-md bg-indigo-500 text-[8px] font-bold text-white animate-pulse">LIVE</span>' : ''}
                        </div>
                        <h4 class="text-xs font-semibold text-white/90 mb-1 leading-snug">${p.title}</h4>
                        ${p.desc ? `<p class="text-[10px] text-muted line-clamp-2">${p.desc}</p>` : ''}
                        ${progressHtml}
                    `;
                fragment.appendChild(item);
            });

            container.appendChild(fragment);
            setTimeout(() => {
                const current = container.querySelector('.epg-item.current');
                if (current) current.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        async function playChannel(channel) {

                epgBtn.classList.remove('hidden');

            let resolvedUrl = url;

            if (needsResolve) {
                if (resolveEnabled) {
                    loadingOverlay.classList.remove('hidden');
                    const statusEl = document.getElementById('resolve-status');
                    if (statusEl) statusEl.classList.remove('hidden');

                    let responseText = null;

                        console.log(`[Resolver] XHR OK, final URL: ${finalUrl.substring(0,100)}`);
                    } catch (e) {
                        console.warn('[Resolver] XHR thất bại, thử fetch:', e.message);
                        try {
                            const resp = await fetch(url, {
                                headers: {
                                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                                    'Accept': '*/*',
                                    'Referer': 'https://vietanhtv.id.vn/',
                                },
                                redirect: 'follow',
                            });
                            if (resp.ok) {
                                responseText = await resp.text();
                                finalUrl = resp.url;
                                console.log(`[Resolver] Fetch OK, final URL: ${finalUrl.substring(0,100)}`);
                            }
                        } catch (e2) {
                            console.warn('[Resolver] Fetch cũng thất bại:', e2.message);
                        }
                    }

                    if (responseText && responseText.length > 5) {
                        const parsed = parseResponseForStream(responseText, finalUrl || url, url);
                        if (parsed) {
                            if (parsed.startsWith('http')) {
                                resolvedUrl = parsed;
                                console.log(`[Resolver] ✅ Tìm thấy stream URL: ${resolvedUrl.substring(0,120)}`);
                            } else {
                                try {
                                    const isM3U = parsed.includes('#EXTM3U') || parsed.includes('#EXTINF');
                                    const isJSON = parsed.trim().startsWith('{') || parsed.trim().startsWith('[');
                                    const mimeType = isM3U ? 'application/vnd.apple.mpegurl' :
                                                    isJSON ? 'application/json' : 'text/plain';
                                    const blob = new Blob([parsed], { type: mimeType });
                                    if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
                                    currentBlobUrl = URL.createObjectURL(blob);
                                    resolvedUrl = currentBlobUrl;
                                    console.log(`[Resolver] ✅ Đã tạo Blob URL (${mimeType}): ${resolvedUrl.substring(0,50)}`);
                                } catch (e) {
                                    console.warn('[Resolver] Không thể tạo Blob URL:', e.message);
                                }
                            }
                        } else {
                            if (finalUrl && finalUrl !== url && /\.(m3u8|mpd|ts)(\?|#|$)/i.test(finalUrl)) {
                                resolvedUrl = finalUrl;
                                console.log(`[Resolver] ✅ Dùng finalUrl sau redirect: ${resolvedUrl.substring(0,120)}`);
                            } else if (finalUrl && finalUrl !== url && (finalUrl.includes(':2086/') || finalUrl.includes(':2087/') || finalUrl.includes('/play/'))) {
                                resolvedUrl = finalUrl;
                                console.log(`[Resolver] ✅ Dùng finalUrl raw stream: ${resolvedUrl.substring(0,120)}`);
                            } else if (responseText.includes('#EXTM3U') || responseText.includes('#EXTINF')) {
                                try {
                                    const blob = new Blob([responseText], { type: 'application/vnd.apple.mpegurl' });
                                    if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
                                    currentBlobUrl = URL.createObjectURL(blob);

                                    console.log(`[Resolver] ✅ Dùng responseText làm M3U playlist (Blob URL)`);
                                } catch (e) {
                                    console.warn('[Resolver] Không thể tạo Blob URL từ responseText:', e.message);
                                }

                    } else {

                        const CORS_PROXIES = [
                            'https://api.allorigins.win/raw?url=',
                            'https://corsproxy.io/?url=',
                        ];
                        for (const proxy of CORS_PROXIES) {
                            try {
                                const proxyUrl = proxy + encodeURIComponent(url);
                                const resp = await fetch(proxyUrl, { redirect: 'follow' });
                                if (resp.ok) {
                                    const text = await resp.text();
                                    if (text && text.length > 5) {
                                        const parsed = parseResponseForStream(text, url, url);
                                        if (parsed) {
                                            if (parsed.startsWith('http')) {
                                                resolvedUrl = parsed;
                                                console.log(`[Resolver] ✅ Proxy ${proxy} → stream URL: ${resolvedUrl.substring(0,120)}`);
                                                break;
                                            } else {
                                                const isM3U = parsed.includes('#EXTM3U') || parsed.includes('#EXTINF');
                                                const mimeType = isM3U ? 'application/vnd.apple.mpegurl' : 'text/plain';
                                                const blob = new Blob([parsed], { type: mimeType });
                                                if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
                                                currentBlobUrl = URL.createObjectURL(blob);
                                                resolvedUrl = currentBlobUrl;
                                                console.log(`[Resolver] ✅ Proxy ${proxy} → Blob URL: ${resolvedUrl.substring(0,50)}`);
                                                break;
                                            }
                                        }
                                        if (text.includes('#EXTM3U') || text.includes('#EXTINF')) {
                                            const blob = new Blob([text], { type: 'application/vnd.apple.mpegurl' });
                                            if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
                                            currentBlobUrl = URL.createObjectURL(blob);
                                            resolvedUrl = currentBlobUrl;
                                            console.log(`[Resolver] ✅ Proxy ${proxy} → M3U Blob URL`);
                                            break;
                                        }
                                    }
                                }
                            } catch (e) {
                                console.warn(`[Resolver] Proxy ${proxy} failed:`, e.message);
                            }
                        }
                    }

                    if (statusEl) statusEl.classList.add('hidden');
                    console.log(`[Resolver] Kết quả cuối: ${url.substring(0,80)} → ${String(resolvedUrl).substring(0,120)}`);
                } else {
                    console.log('[Resolver] Resolve TẮT, chỉ follow redirect...');
                    try {
                        const xhrResult = await xhrFetchText(url);
                        const finalUrl = xhrResult.finalUrl || url;
                        if (finalUrl !== url && /\.(m3u8|mpd|ts)(\?|#|$)/i.test(finalUrl)) {
                            resolvedUrl = finalUrl;
                            console.log(`[Resolver] ✅ Redirect đến: ${resolvedUrl.substring(0,120)}`);
                        } else if (xhrResult.text && xhrResult.text.length > 5) {
                            const parsed = parseResponseForStream(xhrResult.text, finalUrl, url);
                            if (parsed && parsed.startsWith('http')) {
                                resolvedUrl = parsed;
                                console.log(`[Resolver] ✅ Tìm thấy trong response: ${resolvedUrl.substring(0,120)}`);
                            }
                        }
                    } catch (e) {
                        console.warn('[Resolver] XHR redirect thất bại, thử fetch:', e.message);
                        try {
                            const resp = await fetch(url, {
                                headers: {
                                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                                    'Accept': '*/*',
                                },
                                redirect: 'follow',
                            });
                            if (resp.ok) {
                                const finalUrl = resp.url;
                                if (finalUrl !== url) {
                                    resolvedUrl = finalUrl;
                                    console.log(`[Resolver] ✅ Fetch redirect đến: ${resolvedUrl.substring(0,120)}`);
                                }
                            }
                        } catch (e2) {
                            console.warn('[Resolver] Fetch redirect cũng thất bại:', e2.message);
                        }
                    }
                }
            }

            const isMPD = resolvedUrl.includes('.mpd') || (channel.props && channel.props['inputstream.adaptive.manifest_type'] === 'mpd');
            const isRawTS = /\.ts(\?|$)/i.test(resolvedUrl) || /extension=ts/i.test(resolvedUrl) ||
                            resolvedUrl.includes(':2086/') || resolvedUrl.includes(':2087/') ||
                            resolvedUrl.includes('/play/');

            if (typeof shaka !== 'undefined' && isMPD && shaka.Player.isBrowserSupported()) {

                if (drmType === 'widevine' && licenseKey) {

                    let keyString = licenseKey;
                    const clearKeys = {};

                    if (resolvedUrl && (resolvedUrl.startsWith('{') || resolvedUrl.startsWith('['))) {
                        try {
                            const proxyData = JSON.parse(resolvedUrl);
                            let kid = proxyData.kid || (proxyData.keys && proxyData.keys[0]?.kid);
                            let key = proxyData.k || (proxyData.keys && proxyData.keys[0]?.k);
                            const streamUrl = proxyData.url || proxyData.data?.url || proxyData.stream?.url || proxyData.location;
                            if (streamUrl) resolvedUrl = streamUrl;
                            if (kid && key) {
                                clearKeys[base64ToHex(kid)] = base64ToHex(key);
