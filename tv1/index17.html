<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotus Player - Truyền Hình Trực Tuyến</title>
    <!-- Thư viện Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .channel-btn.active {
            background-color: #2563eb;
            color: #ffffff;
            font-weight: bold;
            border-left: 4px solid #ef4444;
        }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col font-sans overflow-hidden">

    <!-- Thanh tiêu đề (Header) - Cố định gọn gàng -->
    <header class="bg-gray-800 px-4 py-2.5 border-b border-gray-700 flex justify-between items-center shadow-lg shrink-0">
        <h1 class="text-lg font-bold text-red-500 flex items-center gap-2">
            📺 LOTUS PLAYER
        </h1>
        <span id="current-title" class="text-xs bg-gray-700 px-3 py-1 rounded-full text-gray-200">
            Đang phát: THVL 1 HD
        </span>
    </header>

    <!-- Khung nội dung chính: Khóa chiều cao, chia 2 cột độc lập trên PC/TV -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- Khung xem Video (Player) -->
        <div class="flex-1 bg-black relative h-[250px] md:h-full shrink-0">
            <iframe 
                id="tv-player" 
                src="https://www.thvli.vn/live/thvl1-hd" 
                class="w-full h-full absolute inset-0 border-0"
                allow="autoplay; encrypted-media; fullscreen" 
                allowfullscreen>
            </iframe>
        </div>

        <!-- Khung bên phải: Danh sách kênh & Lịch phát sóng (Có thanh cuộn riêng độc lập) -->
        <div class="w-full md:w-80 bg-gray-800 p-3 border-t md:border-t-0 md:border-l border-gray-700 flex flex-col flex-1 md:flex-initial overflow-hidden">
            <h2 class="text-sm font-semibold mb-2 text-gray-300 border-b border-gray-700 pb-2 flex justify-between items-center shrink-0">
                <span id="panel-title">DANH SÁCH KÊNH</span>
                <div class="flex items-center gap-2">
                    <!-- Nút Chuyển đổi Danh sách Kênh / Lịch phát sóng -->
                    <button id="live-toggle-btn" onclick="toggleChannelMenu()" class="text-xs bg-red-600 hover:bg-red-700 px-2.5 py-1 rounded text-white font-bold cursor-pointer transition active:scale-95 shadow">
                        LIVE
                    </button>
                    <!-- Nút Thêm Nguồn Phát (+), Mở Cửa sổ Modal -->
                    <button onclick="openModal()" class="text-xs bg-blue-600 hover:bg-blue-700 px-2.5 py-1 rounded text-white font-bold cursor-pointer transition active:scale-95 shadow flex items-center justify-center">
                        +
                    </button>
                </div>
            </h2>
            
            <!-- Danh sách kênh (Tự cuộn riêng biệt) -->
            <div id="channel-list" class="flex flex-col gap-2 overflow-y-auto flex-1 pr-1">
                <!-- Danh sách kênh sinh tự động -->
            </div>

            <!-- Khung Lịch phát sóng (Ban đầu ẩn, tự cuộn riêng biệt) -->
            <div id="epg-schedule" class="hidden flex-col gap-2 overflow-y-auto flex-1 pr-1">
                <!-- Lịch phát sóng sinh tự động -->
            </div>
        </div>

    </div>

    <!-- Chân trang thu gọn tối ưu không gian -->
    <footer class="bg-gray-800 py-1.5 text-center text-[11px] text-gray-400 border-t border-gray-700 shrink-0">
        Lotus Player © 2026 - Tự động phát trực tuyến ổn định
    </footer>

    <!-- CỬA SỔ POPUP (MODAL): THÊM NGUỒN PHÁT -->
    <div id="source-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-800 w-full max-w-md rounded-2xl border border-gray-700 p-5 shadow-2xl relative text-gray-200">
            
            <!-- Tiêu đề Cửa sổ & Nút Đóng -->
            <div class="flex justify-between items-center pb-3 border-b border-gray-700 mb-4">
                <h3 class="text-lg font-bold flex items-center gap-2 text-white">
                    <span class="text-blue-500">≡+</span> Thêm Nguồn Phát
                </h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl font-bold p-1">✕</button>
            </div>

            <!-- Mục: Nguồn phát nhanh -->
            <div class="mb-5">
                <div class="text-xs font-semibold text-gray-400 mb-2 flex items-center gap-1">
                    ⚡ Nguồn phát nhanh
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="loadDefaultTV()" class="bg-gray-700/60 hover:bg-blue-600/30 hover:border-blue-500 border border-transparent py-2.5 rounded-xl font-medium text-sm transition">
                        TV Online
                    </button>
                    <button onclick="loadFromUrl('https://raw.githubusercontent.com/thanhchuong251085-cell/Hana2019/main/tv.json')" class="bg-gray-700/60 hover:bg-blue-600/30 hover:border-blue-500 border border-transparent py-2.5 rounded-xl font-medium text-sm transition">
                        Truyen Hinh
                    </button>
                    <button onclick="loadFromUrl('https://raw.githubusercontent.com/thanhchuong251085-cell/Hana2019/main/tviptv.m3u')" class="col-span-2 bg-gray-700/60 hover:bg-blue-600/30 hover:border-blue-500 border border-transparent py-2.5 rounded-xl font-medium text-sm transition">
                        Bóng Đá
                    </button>
                </div>
            </div>

            <div class="text-center text-xs text-gray-500 tracking-wider mb-4">TÙY CHỈNH</div>

            <!-- Mục: Nhập liên kết URL thủ công -->
            <div class="mb-5">
                <label class="block text-xs font-semibold text-gray-400 mb-1.5">Nhập Liên kết URL thủ công</label>
                <div class="flex items-center gap-2 bg-gray-900 border border-gray-700 rounded-xl p-1.5 focus-within:border-blue-500">
                    <span class="pl-2 text-gray-400">🔗</span>
                    <input id="custom-url-input" type="text" placeholder="https://..." class="bg-transparent border-none outline-none text-xs text-white w-full px-1">
                    <button onclick="loadCustomUrl()" class="bg-cyan-500 hover:bg-cyan-600 text-gray-900 font-bold text-xs px-3 py-1.5 rounded-lg transition">
                        TẢI
                    </button>
                </div>
            </div>

            <div class="text-center text-xs text-gray-500 tracking-wider mb-4">HOẶC</div>

            <!-- Mục: Mở file từ máy -->
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1.5">Mở File từ máy tính cục bộ</label>
                <label class="flex items-center justify-center gap-2 w-full bg-gray-700/50 hover:bg-gray-700 border border-gray-600 rounded-xl py-2.5 cursor-pointer transition text-xs font-medium">
                    📁 Tải tệp từ máy (.m3u)
                    <input type="file" id="local-file-input" accept=".m3u,.m3u8" onchange="handleFileUpload(event)" class="hidden">
                </label>
            </div>

        </div>
    </div>

    <!-- Script xử lý -->
    <script>
        const defaultChannels = [
            // --- NHÓM TRUYỀN HÌNH VĨNH LONG (THVL) ---
            { group: "TRUYỀN HÌNH VĨNH LONG (THVL)", name: "THVL 1 HD", url: "https://www.thvli.vn/live/thvl1-hd" },
            { group: "TRUYỀN HÌNH VĨNH LONG (THVL)", name: "THVL 2 HD", url: "https://www.thvli.vn/live/thvl2-hd" },
            { group: "TRUYỀN HÌNH VĨNH LONG (THVL)", name: "THVL 3 HD", url: "https://www.thvli.vn/live/thvl3-hd" },

            { group: "TRUYỀN HÌNH VĨNH LONG (THVL)", name: "THVL 5 HD", url: "https://www.thvli.vn/live/thvl5-hd" },

            // --- NHÓM KÊNH VTV ---
            { group: "ĐÀI TRUYỀN HÌNH VIỆT NAM (VTV)", name: "VTV Home", url: "https://vtvgo.vn/xem-truc-tuyen/vtv1-1.html" },
            { group: "ĐÀI TRUYỀN HÌNH VIỆT NAM (VTV)", name: "VTV1 HD", url: "https://live.fptplay53.net/live/media/vtv1/live247-hls-avc/vtv1-avc1_5600000=10000-mp4a_131600=20000.m3u8" },
            { group: "ĐÀI TRUYỀN HÌNH VIỆT NAM (VTV)", name: "VTV2 HD", url: "https://vips-livecdn.fptplay.net/live/media/vtv2/live247-hls-avc/vtv2-avc1_5600000=10000-mp4a_131600=20000.m3u8" },
            { group: "ĐÀI TRUYỀN HÌNH VIỆT NAM (VTV)", name: "VTV3 HD", url: "https://vips-livecdn.fptplay.net/live/media/vtv3/live247-hls-avc/vtv3-avc1_5600000=10000-mp4a_140800_vie=20000.m3u8" },
            { group: "ĐÀI TRUYỀN HÌNH VIỆT NAM (VTV)", name: "VTV4 HD", url: "https://live.fptplay53.net/live/media/vtv4/live247-hls-avc/vtv4-avc1_5600000=10000-mp4a_131600=20000.m3u8" },
            { group: "ĐÀI TRUYỀN HÌNH VIỆT NAM (VTV)", name: "VTV5 Quốc Gia", url: "https://live.fptplay53.net/live/media/vtv5/live247-hls-avc/vtv5-avc1_5600000=10000-mp4a_131600=20000.m3u8" },
            { group: "ĐÀI TRUYỀN HÌNH VIỆT NAM (VTV)", name: "VTV5 Tây Nguyên", url: "https://live.fptplay53.net/live/media/vtv5tn/live-hls-avc/vtv5tn-avc1_4000000=10000-mp4a_131600=20000.m3u8" },
            { group: "ĐÀI TRUYỀN HÌNH VIỆT NAM (VTV)", name: "VTV5 Tây Nam Bộ", url: "https://live.fptplay53.net/live/media/vtv5tnb/live-hls-avc/vtv5tnb-avc1_4000000=10000-mp4a_131600=20000.m3u8" },
            { group: "ĐÀI TRUYỀN HÌNH VIỆT NAM (VTV)", name: "VTV6 HD", url: "https://vips-livecdn.fptplay.net/live/media/vtv6/live247-hls-avc/vtv6-avc1_5600000=10000-mp4a_140800_vie=20000.m3u8" },
            { group: "ĐÀI TRUYỀN HÌNH VIỆT NAM (VTV)", name: "VTV7 HD", url: "https://vips-livecdn.fptplay.net/live/media/vtv7/live247-hls-avc/vtv7-avc1_5600000=10000-mp4a_140800_vie=20000.m3u8" },
            { group: "ĐÀI TRUYỀN HÌNH VIỆT NAM (VTV)", name: "VTV8 HD", url: "https://vips-livecdn.fptplay.net/live/media/vtv8/live-hls-avc/vtv8-avc1_4000000=10000-mp4a_131600=20000.m3u8" },
            { group: "ĐÀI TRUYỀN HÌNH VIỆT NAM (VTV)", name: "VTV9 HD", url: "https://vips-livecdn.fptplay.net/live/media/vtv9/live247-hls-avc/vtv9-avc1_5600000=10000-mp4a_140800_vie=20000.m3u8" },
            { group: "ĐÀI TRUYỀN HÌNH VIỆT NAM (VTV)", name: "VTV10 HD", url: "https://vips-livecdn.fptplay.net/live/media/vtv10/live247-hls-avc/vtv10-avc1_5600000=10000-mp4a_131600=20000.m3u8" },
            { group: "ĐÀI TRUYỀN HÌNH VIỆT NAM (VTV)", name: "VTV vietnamtoday", url: "https://live.fptplay53.net/fnxhd1/vntoday_vhls.smil/chunklist_b5000000.m3u8" },

            // --- NHÓM KÊNH HTV & HTVC ---
            { group: "TRUYỀN HÌNH TP.HCM (HTV & HTVC)", name: "HTV1 (public)", url: "https://live.fptplay53.net/epzhd1/htv1_hls.smil/chunklist_b2500000.m3u8" },
            { group: "TRUYỀN HÌNH TP.HCM (HTV & HTVC)", name: "HTV2 (Vie Channel)", url: "https://live.fptplay53.net/epzhd1/htv2hd_vhls.smil/chunklist_b5000000.m3u8" },
            { group: "TRUYỀN HÌNH TP.HCM (HTV & HTVC)", name: "HTV3 (Thanh thiếu nhi)", url: "https://live.fptplay53.net/epzhd1/htv3_hls.smil/chunklist_b2500000.m3u8" },
            { group: "TRUYỀN HÌNH TP.HCM (HTV & HTVC)", name: "HTV7 HD", url: "https://live.fptplay53.net/epzhd1/htv7hd_vhls.smil/chunklist_b5000000.m3u8" },
            { group: "TRUYỀN HÌNH TP.HCM (HTV & HTVC)", name: "HTV9 HD", url: "https://live.fptplay53.net/epzhd1/htv9hd_vhls.smil/chunklist_b5000000.m3u8" },
            { group: "TRUYỀN HÌNH TP.HCM (HTV & HTVC)", name: "HTV Thể Thao", url: "https://live.fptplay53.net/epzhd1/htvcthethao_vhls.smil/chunklist_b5000000.m3u8" },
            { group: "TRUYỀN HÌNH TP.HCM (HTV & HTVC)", name: "HTVC Thuần Việt", url: "https://live.fptplay53.net/epzhd1/htvcthuanviethd_vhls.smil/chunklist_b5000000.m3u8" },
            { group: "TRUYỀN HÌNH TP.HCM (HTV & HTVC)", name: "HTVC Gia Đình", url: "https://live.fptplay53.net/epzhd1/htvcgiadinh_vhls.smil/chunklist_b5000000.m3u8" },
            { group: "TRUYỀN HÌNH TP.HCM (HTV & HTVC)", name: "HTVC Phim", url: "https://live.fptplay53.net/epzhd1/htvcmovieshd_vhls.smil/chunklist_b5000000.m3u8" },
            { group: "TRUYỀN HÌNH TP.HCM (HTV & HTVC)", name: "HTVC Ca Nhạc", url: "https://live.fptplay53.net/epzhd1/htvcmusic_vhls.smil/chunklist_b5000000.m3u8" },
            { group: "TRUYỀN HÌNH TP.HCM (HTV & HTVC)", name: "HTVC Phụ Nữ", url: "https://live.fptplay53.net/epzhd1/htvcphunu_vhls.smil/chunklist_b2500000.m3u8" },
            { group: "TRUYỀN HÌNH TP.HCM (HTV & HTVC)", name: "HTVC Du Lịch & Cuộc Sống", url: "https://live.fptplay53.net/epzhd1/htvcdulich_vhls.smil/chunklist_b5000000.m3u8" },

            // --- NHÓM KÊNH ĐỊA PHƯƠNG ---
            { group: "KÊNH ĐỊA PHƯƠNG TỔNG HỢP", name: "Hà Nội 1 (HN1)", url: "https://hanoitv.vn/tv-truc-tuyen.html" },
            { group: "KÊNH ĐỊA PHƯƠNG TỔNG HỢP", name: "Đồng Nai 1 (DN1)", url: "https://dnrtv.org.vn/tv-online/dn1.html" }
        ];

        let currentChannels = [...defaultChannels];
        let currentChannelObj = defaultChannels[0];
        let isShowingChannels = true;
        let loadedEpgData = {};

        const player = document.getElementById('tv-player');
        const channelListContainer = document.getElementById('channel-list');
        const epgContainer = document.getElementById('epg-schedule');
        const currentTitle = document.getElementById('current-title');
        const panelTitle = document.getElementById('panel-title');
        const liveToggleBtn = document.getElementById('live-toggle-btn');

        function toggleChannelMenu() {
            isShowingChannels = !isShowingChannels;

            if (isShowingChannels) {
                channelListContainer.classList.remove('hidden');
                channelListContainer.classList.add('flex');
                epgContainer.classList.add('hidden');
                epgContainer.classList.remove('flex');
                
                panelTitle.textContent = "DANH SÁCH KÊNH";
                liveToggleBtn.classList.remove('bg-gray-600', 'hover:bg-gray-700');
                liveToggleBtn.classList.add('bg-red-600', 'hover:bg-red-700');
            } else {
                channelListContainer.classList.add('hidden');
                channelListContainer.classList.remove('flex');
                epgContainer.classList.remove('hidden');
                epgContainer.classList.add('flex');
                
                panelTitle.textContent = "LỊCH PHÁT SÓNG";
                liveToggleBtn.classList.remove('bg-red-600', 'hover:bg-red-700');
                liveToggleBtn.classList.add('bg-gray-600', 'hover:bg-gray-700');
                
                renderSchedule();
            }
        }

        function getScheduleForChannel(channel) {
            if (channel.schedule && channel.schedule.length > 0) return channel.schedule;
            if (loadedEpgData[channel.name] && loadedEpgData[channel.name].length > 0) return loadedEpgData[channel.name];
            if (loadedEpgData[channel.tvgId] && loadedEpgData[channel.tvgId].length > 0) return loadedEpgData[channel.tvgId];
            return [];
        }

        function renderSchedule() {
            epgContainer.innerHTML = '';
            const scheduleData = getScheduleForChannel(currentChannelObj);

            const header = document.createElement('div');
            header.className = 'text-xs font-bold text-cyan-400 mb-2 border-b border-gray-700 pb-2 flex justify-between items-center shrink-0';
            header.innerHTML = `<span>📺 Lịch phát: ${currentChannelObj.name}</span><span class="text-[10px] bg-gray-700 text-gray-300 px-2 py-0.5 rounded">Hôm nay</span>`;
            epgContainer.appendChild(header);

            if (scheduleData.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'text-center text-gray-500 text-xs py-8 italic border border-dashed border-gray-700 rounded-lg mt-2';
                emptyDiv.innerHTML = '<i>Chưa có dữ liệu lịch phát sóng cho kênh này.</i>';
                epgContainer.appendChild(emptyDiv);
                return;
            }

            scheduleData.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `p-2.5 rounded-lg text-xs flex justify-between items-center shrink-0 ${item.isLive ? 'bg-red-900/40 border border-red-500/50' : 'bg-gray-700/50 hover:bg-gray-700'}`;
                
                itemDiv.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden">
                        <span class="font-mono text-gray-400 font-bold shrink-0">${item.time}</span>
                        <span class="${item.isLive ? 'font-bold text-white' : 'text-gray-300'} truncate">${item.title}</span>
                    </div>
                    ${item.isLive ? '<span class="text-[9px] bg-red-600 text-white font-bold px-1.5 py-0.5 rounded uppercase animate-pulse shrink-0">Đang phát</span>' : ''}
                `;
                epgContainer.appendChild(itemDiv);
            });
        }

        function openModal() {
            document.getElementById('source-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('source-modal').classList.add('hidden');
        }

        function loadDefaultTV() {
            currentChannels = [...defaultChannels];
            loadedEpgData = {};
            renderChannels();
            if (currentChannels.length > 0) playChannel(currentChannels[0], channelListContainer.querySelector('.channel-btn'));
            closeModal();
        }

        async function loadFromUrl(url) {
            if (!url) return;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Không thể tải nguồn IPTV");
                const text = await response.text();
                parseAndSetM3u(text);
                closeModal();
            } catch (err) {
                alert("Lỗi khi tải nguồn phát: " + err.message);
            }
        }

        function loadCustomUrl() {
            const url = document.getElementById('custom-url-input').value.trim();
            if (url) loadFromUrl(url);
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                parseAndSetM3u(e.target.result);
                closeModal();
            };
            reader.readAsText(file);
        }

        function parseAndSetM3u(m3uContent) {
            const lines = m3uContent.split('\n');
            const newChannels = [];
            let currentName = '';
            let currentGroup = 'KÊNH NHẬP VÀO';
            let currentTvgId = '';

            const firstLine = lines[0] || '';
            const epgUrlMatch = firstLine.match(/(?:url-tvg|tvg-url)="([^"]+)"/i);
            if (epgUrlMatch && epgUrlMatch[1]) {
                fetchEpgData(epgUrlMatch[1]);
            }

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const groupMatch = line.match(/group-title="([^"]+)"/i);
                    if (groupMatch) currentGroup = groupMatch[1];

                    const tvgIdMatch = line.match(/tvg-id="([^"]+)"/i);
                    if (tvgIdMatch) currentTvgId = tvgIdMatch[1];

                    const commaIndex = line.lastIndexOf(',');
                    if (commaIndex !== -1) {
                        currentName = line.substring(commaIndex + 1).trim();
                    }
                } else if (line && !line.startsWith('#')) {
                    if (currentName) {
                        newChannels.push({
                            group: currentGroup,
                            name: currentName,
                            tvgId: currentTvgId,
                            url: line,
                            schedule: []
                        });
                        currentName = '';
                        currentTvgId = '';
                    }
                }
            });

            if (newChannels.length > 0) {
                currentChannels = newChannels;
                renderChannels();
                const firstBtn = channelListContainer.querySelector('.channel-btn');
                if (firstBtn) playChannel(currentChannels[0], firstBtn);
            } else {
                alert("Không tìm thấy danh sách kênh hợp lệ trong tệp/nguồn đã chọn.");
            }
        }

        async function fetchEpgData(epgUrl) {
            try {
                const res = await fetch(epgUrl);
                if (res.ok) {
                    await res.text();
                }
            } catch(e) {
                console.log("Không thể tự động tải file EPG phụ trợ từ IPTV.");
            }
        }

        function renderChannels() {
            channelListContainer.innerHTML = '';
            let currentGroup = '';

            currentChannels.forEach((ch, index) => {
                if (ch.group !== currentGroup) {
                    currentGroup = ch.group;
                    const groupTitle = document.createElement('div');
                    groupTitle.className = 'text-xs font-bold text-yellow-400 mt-3 mb-1 uppercase tracking-wider border-b border-gray-700 pb-1 shrink-0';
                    groupTitle.textContent = currentGroup;
                    channelListContainer.appendChild(groupTitle);
                }

                const btn = document.createElement('button');
                btn.className = `channel-btn w-full text-left p-2.5 rounded-lg bg-gray-700 hover:bg-gray-600 transition flex items-center justify-between shrink-0 ${index === 0 ? 'active' : ''}`;
                btn.innerHTML = `
                    <span class="text-sm">📺 ${ch.name}</span>
                    <span class="text-[10px] bg-red-600 text-white px-1.5 py-0.5 rounded">LIVE</span>
                `;
                
                btn.onclick = () => playChannel(ch, btn);
                channelListContainer.appendChild(btn);
            });
        }

        function playChannel(channel, selectedBtn) {
            player.src = channel.url;
            currentChannelObj = channel;
            currentTitle.textContent = `Đang phát: ${channel.name}`;

            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            if (selectedBtn) selectedBtn.classList.add('active');

            if (!isShowingChannels) {
                renderSchedule();
            }
        }

        renderChannels();
    </script>
</body>
</html>
