<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotus Player - Truyền Hình Trực Tuyến</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center">
        <h1 class="text-xl font-bold text-red-500">📺 LOTUS PLAYER</h1>
        <span id="channel-name" class="text-sm bg-gray-700 px-3 py-1 rounded-full">Kênh: VTV1 HD</span>
    </header>

    <!-- Khung xem Video -->
    <div class="flex-1 flex flex-col md:flex-row">
        <div class="flex-1 bg-black relative min-h-[350px] md:min-h-[500px]">
            <iframe 
                id="main-player" 
                src="https://vtvcab.vn/embed/vtv1" 
                class="w-full h-full absolute inset-0 border-0"
                allow="autoplay; encrypted-media; fullscreen" 
                allowfullscreen>
            </iframe>
        </div>

        <!-- Danh sách kênh -->
        <div class="w-full md:w-72 bg-gray-800 p-4 border-t md:border-t-0 md:border-l border-gray-700">
            <h2 class="text-lg font-semibold mb-3 border-b border-gray-700 pb-2">Danh Sách Kênh</h2>
            <div id="channel-list" class="flex flex-col gap-2">
                <!-- Nút chuyển kênh -->
            </div>
        </div>
    </div>

    <script>
        // Nguồn Player cho phép iframe công khai
        const channels = [
            { name: "VTV1 HD", url: "https://vtvgo.vn/embed/vtv1" },
            { name: "VTV2 HD", url: "https://vtvgo.vn/embed/vtv2" },
            { name: "VTV3 HD", url: "https://vtvgo.vn/embed/vtv3" },
            { name: "VTV5 HD", url: "https://vtvgo.vn/embed/vtv5" },
            { name: "VTV9 HD", url: "https://vtvgo.vn/embed/vtv9" }
        ];

        const player = document.getElementById('main-player');
        const channelList = document.getElementById('channel-list');
        const channelName = document.getElementById('channel-name');

        channels.forEach((ch, idx) => {
            const btn = document.createElement('button');
            btn.className = 'w-full text-left p-3 rounded bg-gray-700 hover:bg-blue-600 transition flex justify-between items-center';
            btn.innerHTML = `<span>📺 ${ch.name}</span><span class="text-xs bg-red-600 px-2 py-0.5 rounded">LIVE</span>`;
            btn.onclick = () => {
                player.src = ch.url;
                channelName.textContent = `Kênh: ${ch.name}`;
            };
            channelList.appendChild(btn);
        });
    </script>
</body>
</html>
