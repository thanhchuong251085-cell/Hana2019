<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream App</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome cho icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Thư viện hỗ trợ phát luồng m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <!-- Khung phát Video -->
  <div class="player-container">
    <video id="video-player" controls autoplay></video>
  </div>

  <!-- Header / Thanh công cụ -->
  <header class="app-header">
    <div class="logo">
      <i class="fa-solid fa-tv orange-icon"></i>
      <span>Stream</span>
    </div>
    
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="search-input" placeholder="Tìm kiếm..">
      <i class="fa-solid fa-microphone mic-icon"></i>
    </div>

    <div class="header-actions">
      <button class="icon-btn" onclick="loadIPTV()"><i class="fa-solid fa-rotate-right"></i></button>
    </div>
  </header>

  <!-- Thanh danh mục -->
  <nav class="category-bar">
    <button class="cat-item active">Tất cả</button>
  </nav>

  <!-- Danh sách kênh sẽ tự động đổ vào đây -->
  <main class="channel-list" id="channel-list">
    <p style="text-align: center; color: #888;">Đang tải danh sách kênh...</p>
  </main>

  <script>
    // 1. ĐIỀN LINK IPTV (.m3u HOẶC .m3u8) CỦA BẠN VÀO ĐÂY:
    const iptvUrl = "https://raw.githubusercontent.com/thanhchuong251085-cell/Hana2019/main/tviptv.m3u"; 

    const video = document.getElementById('video-player');
    const channelListContainer = document.getElementById('channel-list');

    // Hàm phát kênh khi bấm vào
    function playStream(url) {
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
      }
    }

    // Hàm tải và giải mã file M3U IPTV
    async function loadIPTV() {
      try {
        const response = await fetch(iptvUrl);
        const data = await response.text();
        parseM3U(data);
      } catch (error) {
        channelListContainer.innerHTML = `<p style="color:red; text-align:center;">Lỗi tải IPTV! Hãy kiểm tra link hoặc CORS.</p>`;
      }
    }

    // Hàm đọc dữ liệu file M3U
    function parseM3U(m3uText) {
      const lines = m3uText.split('\n');
      let channels = [];
      let currentChannel = {};

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const nameMatch = line.split(',');
          const logoMatch = line.match(/tvg-logo="(.*?)"/);
          
          currentChannel.name = nameMatch[nameMatch.length - 1] || 'Kênh không tên';
          currentChannel.logo = logoMatch ? logoMatch[1] : 'https://via.placeholder.com/60x40/333/fff?text=TV';
        } else if (line.length > 0 && !line.startsWith('#')) {
          currentChannel.url = line;
          channels.push(currentChannel);
          currentChannel = {};
        }
      });

      renderChannels(channels);
    }

    // Hàm hiển thị danh sách kênh ra giao diện
    function renderChannels(channels) {
      channelListContainer.innerHTML = '';
      channels.forEach(channel => {
        const item = document.createElement('div');
        item.className = 'channel-item';
        item.onclick = () => playStream(channel.url);
        item.innerHTML = `
          <img src="${channel.logo}" alt="${channel.name}" class="channel-logo" onerror="this.src='https://via.placeholder.com/60x40/333/fff?text=TV'">
          <span class="channel-title">${channel.name}</span>
        `;
        channelListContainer.appendChild(item);
      });
    }

    // Tự động tải danh sách khi mở trang
    loadIPTV();
  </script>
</body>
</html>
