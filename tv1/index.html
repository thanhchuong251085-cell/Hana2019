<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream App</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome cho icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Header / Thanh công cụ -->
  <header class="app-header">
    <div class="logo">
      <i class="fa-solid fa-tv orange-icon"></i>
      <span>Stream</span>
    </div>
    
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" placeholder="Tìm kiếm..">
      <i class="fa-solid fa-microphone mic-icon"></i>
    </div>

    <div class="header-actions">
      <button class="icon-btn"><i class="fa-solid fa-server"></i></button>
      <button class="icon-btn"><i class="fa-solid fa-rotate-right"></i></button>
    </div>
  </header>

  <!-- Thanh danh mục (Category Nav) -->
  <nav class="category-bar">
    <button class="cat-item active">Tất cả</button>
    <button class="cat-item">VTV</button>
    <button class="cat-item">HTV</button>
    <button class="cat-item">Sự Kiện TV360</button>
    <button class="cat-item">Rạp Phim</button>
  </nav>

  <!-- Danh sách kênh (Channel List) -->
  <main class="channel-list">
    
    <div class="channel-item">
      <img src="https://via.placeholder.com/60x40/e60012/ffffff?text=VTV1" alt="VTV1" class="channel-logo">
      <span class="channel-title">VTV1 HD</span>
    </div>

    <div class="channel-item">
      <img src="https://via.placeholder.com/60x40/e60012/ffffff?text=VTV2" alt="VTV2" class="channel-logo">
      <span class="channel-title">VTV2 HD</span>
    </div>

    <div class="channel-item">
      <img src="https://via.placeholder.com/60x40/e60012/ffffff?text=VTV3" alt="VTV3" class="channel-logo">
      <span class="channel-title">VTV3 HD</span>
    </div>

    <div class="channel-item">
      <img src="https://via.placeholder.com/60x40/e60012/ffffff?text=VTV4" alt="VTV4" class="channel-logo">
      <span class="channel-title">VTV4 HD</span>
    </div>

    <div class="channel-item">
      <img src="https://via.placeholder.com/60x40/e60012/ffffff?text=VTV5" alt="VTV5" class="channel-logo">
      <span class="channel-title">VTV5 HD</span>
    </div>

  </main>

</body>
</html>
