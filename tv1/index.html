<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src *; media-src * blob: data:; img-src * data:;">
    <title>Lotus Player - Stream Engine</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --bg-deep: #050505;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ededed;
            --text-muted: #888888;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            margin: 0;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
        }

        .channel-item {
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .channel-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(99, 102, 241, 0.2);
        }

        .channel-item.active {
            background: rgba(99, 102, 241, 0.15) !important;
            border-color: var(--accent) !important;
        }

        .category-tab.active {
            background: var(--accent);
            color: white;
        }

        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .toast {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
    </style>
</head>

<body class="selection:bg-indigo-500/30">
    <div id="toast-container"></div>

    <div class="flex flex-col landscape:flex-row h-screen w-screen p-3 gap-3 overflow-hidden box-border">

        <!-- SIDEBAR -->
        <aside class="order-2 landscape:order-1 flex-1 landscape:flex-none w-full landscape:w-[280px] lg:w-[320px] glass-panel rounded-2xl flex flex-col overflow-hidden">
            <div class="p-4 border-b border-white/5 shrink-0">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-lg bg-indigo-500 flex items-center justify-center">
                            <i data-lucide="tv" class="w-4 h-4 text-white"></i>
                        </div>
                        <h1 class="font-bold text-sm tracking-tight text-white">Lotus<span class="text-indigo-400">Player</span></h1>
                    </div>
                    <button onclick="openAddDialog()" class="w-7 h-7 flex items-center justify-center rounded-lg bg-white/5 hover:bg-indigo-500 text-indigo-400 hover:text-white transition-all">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                </div>

                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-muted"></i>
                    <input type="text" id="search-input" placeholder="Tìm kênh VTV, HTV, THVL..." class="w-full pl-9 pr-3 py-1.5 bg-black/40 border border-white/5 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500/40" oninput="filterChannels()">
                </div>
            </div>

            <!-- List Space -->
            <div class="flex-1 overflow-hidden relative">
                <ul id="channel-list" class="h-full overflow-y-auto p-2 space-y-1 custom-scrollbar">
                    <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center p-6 opacity-40">
                        <i data-lucide="layout-list" class="w-10 h-10 mb-3"></i>
                        <p class="text-xs">Chưa có danh sách kênh</p>
                    </div>
                </ul>
            </div>

            <div class="p-3 bg-black/40 border-t border-white/5 flex items-center justify-between shrink-0">
                <span id="channel-count" class="text-[10px] text-muted font-bold uppercase">0 Kênh</span>
                <button onclick="clearList()" class="text-[10px] text-muted hover:text-red-400 font-bold uppercase">Xóa danh sách</button>
            </div>
        </aside>

        <!-- MAIN PLAYER AREA -->
        <div class="order-1 landscape:order-2 flex-1 flex flex-col gap-3 h-auto landscape:h-full overflow-hidden">
            <main class="w-full aspect-video landscape:aspect-auto landscape:flex-1 glass-panel rounded-2xl overflow-hidden relative bg-black">
                <video id="video-player" class="w-full h-full object-contain" playsinline controls></video>

                <!-- Status & CORS Resolver Overlay -->
                <div id="loading-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 backdrop-blur-md z-20 hidden text-white">
                    <div class="w-8 h-8 border-2 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mb-3"></div>
                    <p id="loading-text" class="text-xs text-indigo-300 font-medium">Đang kết nối luồng phát...</p>
                </div>
            </main>

            <!-- Category Tabs -->
            <div class="glass-panel p-2.5 rounded-xl shrink-0">
                <div id="category-tabs" class="flex gap-2 overflow-x-auto custom-scrollbar"></div>
            </div>
        </div>
    </div>

    <!-- Modal Thêm Kênh -->
    <div id="add-dialog" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-[#121212] border border-white/10 rounded-2xl p-5 w-full max-w-sm flex flex-col gap-4">
            <div class="flex items-center justify-between border-b border-white/5 pb-2">
                <h2 class="text-white font-semibold text-xs flex items-center gap-2"><i data-lucide="list-plus" class="w-4 h-4 text-indigo-400"></i> Nguồn phát IPTV</h2>
                <button onclick="closeAddDialog()" class="text-muted hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>

            <div class="grid grid-cols-1 gap-2">
                <button onclick="loadPredefinedUrl('https://raw.githubusercontent.com/thanhchuong251085-cell/Hana2019/main/tviptv.m3u')" class="px-3 py-2 bg-indigo-500/10 hover:bg-indigo-500/20 border border-indigo-500/30 rounded-xl text-left transition-all">
                    <div class="text-xs font-bold text-indigo-300">Playlist Tổng Hợp (VTV, HTV, THVL, Bóng Đá)</div>
                    <div class="text-[10px] text-muted">Cập nhật link stream mượt mà</div>
                </button>
            </div>

            <div class="flex flex-col gap-1.5">
                <span class="text-[10px] text-muted font-semibold">HOẶC DÁN LINK M3U THỦ CÔNG</span>
                <div class="flex gap-2">
                    <input type="text" id="url-input" placeholder="https://domain.com/playlist.m3u" class="flex-1 px-3 py-2 bg-black/50 border border-white/10 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
                    <button onclick="loadFromUrl(); closeAddDialog();" class="bg-indigo-500 text-white px-3 py-2 rounded-xl text-xs font-bold">TẢI</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // CORS Proxies dùng để vượt rào cản chặn Web của nhà đài
        const CORS_PROXIES = [
            "", // Thử trực tiếp trước
            "https://corsproxy.io/?" ,
            "https://api.allorigins.win/raw?url="
        ];

        let allChannels = [];
        let hlsInstance = null;
        let currentPlayingUrl = null;
        let currentCategory = 'Tất cả';

        const videoPlayer = document.getElementById('video-player');
        const channelListEl = document.getElementById('channel-list');
        const emptyStateEl = document.getElementById('empty-state');
        const channelCountEl = document.getElementById('channel-count');
        const searchInput = document.getElementById('search-input');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');

        function openAddDialog() { document.getElementById('add-dialog').classList.remove('opacity-0', 'pointer-events-none'); }
        function closeAddDialog() { document.getElementById('add-dialog').classList.add('opacity-0', 'pointer-events-none'); }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i data-lucide="info" class="w-4 h-4 text-indigo-400"></i><span>${msg}</span>`;
            container.appendChild(toast);
            lucide.createIcons({ root: toast });
            setTimeout(() => { if (container.contains(toast)) container.removeChild(toast); }, 3000);
        }

        function parseM3U(text) {
            const lines = text.split('\n');
            const channels = [];
            let currentChannel = null;

            for (let line of lines) {
                line = line.trim();
                if (line.toUpperCase().includes('EXTINF:')) {
                    currentChannel = { name: 'Kênh không tên', logo: '', group: 'Khác', url: '' };
                    const commaIdx = line.lastIndexOf(',');
                    if (commaIdx !== -1) currentChannel.name = line.substring(commaIdx + 1).trim();

                    const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                    if (logoMatch) currentChannel.logo = logoMatch[1];

                    const groupMatch = line.match(/group-title="([^"]+)"/i);
                    if (groupMatch) currentChannel.group = groupMatch[1];
                } else if (line && !line.startsWith('#')) {
                    if (currentChannel) {
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = null;
                    }
                }
            }
            return channels;
        }

        function renderChannels(channels) {
            channelListEl.innerHTML = '';
            if (!channels.length) { emptyStateEl.style.display = 'flex'; return; }
            emptyStateEl.style.display = 'none';

            channels.forEach(channel => {
                const li = document.createElement('li');
                const isPlaying = currentPlayingUrl === channel.url;
                li.className = `channel-item flex items-center gap-3 p-2 rounded-xl cursor-pointer ${isPlaying ? 'active' : ''}`;
                li.innerHTML = `
                    <div class="w-12 h-8 shrink-0 bg-white/5 rounded-lg border border-white/5 flex items-center justify-center overflow-hidden">
                        ${channel.logo ? `<img src="${channel.logo}" class="w-full h-full object-contain" onerror="this.remove()">` : ''}
                        <i data-lucide="tv" class="w-4 h-4 text-white/20"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="text-xs font-semibold truncate ${isPlaying ? 'text-indigo-400' : 'text-white/90'}">${channel.name}</h3>
                        <p class="text-[9px] text-muted uppercase">${channel.group}</p>
                    </div>`;
                li.onclick = () => playChannelWithProxy(channel);
                channelListEl.appendChild(li);
            });
            lucide.createIcons({ root: channelListEl });
        }

        function renderCategoryTabs() {
            const tabsContainer = document.getElementById('category-tabs');
            tabsContainer.innerHTML = '';
            const groups = ['Tất cả', ...new Set(allChannels.map(c => c.group || 'Khác'))];

            groups.forEach(group => {
                const btn = document.createElement('button');
                btn.className = `category-tab px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase shrink-0 border border-white/5 ${currentCategory === group ? 'active' : 'bg-white/5 text-muted'}`;
                btn.innerText = group;
                btn.onclick = () => { currentCategory = group; renderCategoryTabs(); filterChannels(); };
                tabsContainer.appendChild(btn);
            });
        }

        function filterChannels() {
            const query = searchInput.value.toLowerCase().trim();
            let filtered = allChannels;
            if (currentCategory !== 'Tất cả') filtered = filtered.filter(c => (c.group || 'Khác') === currentCategory);
            if (query) filtered = filtered.filter(c => c.name.toLowerCase().includes(query));
            renderChannels(filtered);
            channelCountEl.textContent = `${filtered.length} Kênh`;
        }

        async function loadPredefinedUrl(url) {
            document.getElementById('url-input').value = url;
            closeAddDialog();
            await loadFromUrl();
        }

        async function loadFromUrl() {
            const url = document.getElementById('url-input').value.trim();
            if (!url) return;
            try {
                const resp = await fetch(url);
                const text = await resp.text();
                allChannels = parseM3U(text);
                currentCategory = 'Tất cả';
                renderCategoryTabs();
                filterChannels();
                showToast(`Đã tải ${allChannels.length} kênh thành công!`);
            } catch { showToast('Lỗi khi tải file playlist.'); }
        }

        // Kỹ thuật xoay vòng Proxy phát VTV/HTV/THVL dứt điểm CORS
        async function playChannelWithProxy(channel) {
            currentPlayingUrl = channel.url;
            filterChannels();
            loadingOverlay.classList.remove('hidden');

            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

            let streamSuccess = false;

            for (let i = 0; i < CORS_PROXIES.length; i++) {
                const proxy = CORS_PROXIES[i];
                const targetUrl = proxy ? `${proxy}${encodeURIComponent(channel.url)}` : channel.url;
                
                loadingText.innerText = i === 0 ? `Đang kết nối luồng trực tiếp...` : `Đang vượt rào cản CORS (Thử nghiệm ${i})...`;

                const success = await attemptHLSPlay(targetUrl);
                if (success) {
                    streamSuccess = true;
                    break;
                }
            }

            loadingOverlay.classList.add('hidden');
            if (!streamSuccess) {
                showToast(`Kênh ${channel.name} hiện tại bị chặn hoặc hỏng luồng phát.`);
            }
        }

        function attemptHLSPlay(url) {
            return new Promise((resolve) => {
                if (Hls.isSupported()) {
                    const hls = new Hls({
                        enableWorker: true,
                        manifestLoadingTimeOut: 8000,
                        fragLoadingTimeOut: 10000
                    });

                    hls.loadSource(url);
                    hls.attachMedia(videoPlayer);

                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        hlsInstance = hls;
                        videoPlayer.play().catch(() => {});
                        resolve(true);
                    });

                    hls.on(Hls.Events.ERROR, (evt, data) => {
                        if (data.fatal) {
                            hls.destroy();
                            resolve(false);
                        }
                    });
                } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                    videoPlayer.src = url;
                    videoPlayer.play().then(() => resolve(true)).catch(() => resolve(false));
                } else {
                    resolve(false);
                }
            });
        }

        function clearList() {
            allChannels = [];
            currentCategory = 'Tất cả';
            renderCategoryTabs();
            filterChannels();
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            videoPlayer.pause();
            videoPlayer.removeAttribute('src');
        }
    </script>
</body>

</html>
