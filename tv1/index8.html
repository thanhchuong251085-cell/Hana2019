                            const resp = await fetch(url, {
                                headers: {
                                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                                    'Accept': '*/*',
                                    'Referer': 'https://vietanhtv.id.vn/',
                                },
                                redirect: 'follow',
                            });
                            if (resp.ok) {
                                responseText = await resp.text();
                                finalUrl = resp.url;
                                console.log(`[Resolver] Fetch OK, final URL: ${finalUrl.substring(0,100)}`);
                            }
                        } catch (e2) {
                            console.warn('[Resolver] Fetch cũng thất bại:', e2.message);
                        }
                    }

                    if (responseText && responseText.length > 5) {
                        const parsed = parseResponseForStream(responseText, finalUrl || url, url);
                        if (parsed) {
                            if (parsed.startsWith('http')) {
                                resolvedUrl = parsed;
                                console.log(`[Resolver] ✅ Tìm thấy stream URL: ${resolvedUrl.substring(0,120)}`);
                            } else {
                                try {
                                    const isM3U = parsed.includes('#EXTM3U') || parsed.includes('#EXTINF');
                                    const isJSON = parsed.trim().startsWith('{') || parsed.trim().startsWith('[');
                                    const mimeType = isM3U ? 'application/vnd.apple.mpegurl' :
                                                    isJSON ? 'application/json' : 'text/plain';
                                    const blob = new Blob([parsed], { type: mimeType });
                                    if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
                                    currentBlobUrl = URL.createObjectURL(blob);
                                    resolvedUrl = currentBlobUrl;
                                    console.log(`[Resolver] ✅ Đã tạo Blob URL (${mimeType}): ${resolvedUrl.substring(0,50)}`);
                                } catch (e) {
                                    console.warn('[Resolver] Không thể tạo Blob URL:', e.message);
                                }
                            }
                        } else {
                            if (finalUrl && finalUrl !== url && /\.(m3u8|mpd|ts)(\?|#|$)/i.test(finalUrl)) {
                                resolvedUrl = finalUrl;
                                console.log(`[Resolver] ✅ Dùng finalUrl sau redirect: ${resolvedUrl.substring(0,120)}`);
                            } else if (finalUrl && finalUrl !== url && (finalUrl.includes(':2086/') || finalUrl.includes(':2087/') || finalUrl.includes('/play/'))) {
                                resolvedUrl = finalUrl;
                                console.log(`[Resolver] ✅ Dùng finalUrl raw stream: ${resolvedUrl.substring(0,120)}`);
                            } else if (responseText.includes('#EXTM3U') || responseText.includes('#EXTINF')) {
                                try {
                                    const blob = new Blob([responseText], { type: 'application/vnd.apple.mpegurl' });
                                    if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
                                    currentBlobUrl = URL.createObjectURL(blob);
                                    resolvedUrl = currentBlobUrl;
                                    console.log(`[Resolver] ✅ Dùng responseText làm M3U playlist (Blob URL)`);
                                } catch (e) {
                                    console.warn('[Resolver] Không thể tạo Blob URL từ responseText:', e.message);
                                }
                            }
                        }
                    } else {
                        console.warn('[Resolver] ❌ XHR/Fetch thất bại, thử CORS proxy...');
                        const CORS_PROXIES = [
                            'https://api.allorigins.win/raw?url=',
                            'https://corsproxy.io/?url=',
                        ];
                        for (const proxy of CORS_PROXIES) {
                            try {
                                const proxyUrl = proxy + encodeURIComponent(url);
                                const resp = await fetch(proxyUrl, { redirect: 'follow' });
                                if (resp.ok) {
                                    const text = await resp.text();
                                    if (text && text.length > 5) {
                                        const parsed = parseResponseForStream(text, url, url);
                                        if (parsed) {
                                            if (parsed.startsWith('http')) {
                                                resolvedUrl = parsed;
                                                console.log(`[Resolver] ✅ Proxy ${proxy} → stream URL: ${resolvedUrl.substring(0,120)}`);
                                                break;
                                            } else {
                                                const isM3U = parsed.includes('#EXTM3U') || parsed.includes('#EXTINF');
                                                const mimeType = isM3U ? 'application/vnd.apple.mpegurl' : 'text/plain';
                                                const blob = new Blob([parsed], { type: mimeType });
                                                if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
                                                currentBlobUrl = URL.createObjectURL(blob);
                                                resolvedUrl = currentBlobUrl;
                                                console.log(`[Resolver] ✅ Proxy ${proxy} → Blob URL: ${resolvedUrl.substring(0,50)}`);
                                                break;
                                            }
                                        }
                                        if (text.includes('#EXTM3U') || text.includes('#EXTINF')) {
                                            const blob = new Blob([text], { type: 'application/vnd.apple.mpegurl' });
                                            if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
                                            currentBlobUrl = URL.createObjectURL(blob);
                                            resolvedUrl = currentBlobUrl;
                                            console.log(`[Resolver] ✅ Proxy ${proxy} → M3U Blob URL`);
                                            break;
                                        }
                                    }
                                }
                            } catch (e) {
                                console.warn(`[Resolver] Proxy ${proxy} failed:`, e.message);
                            }
                        }
                    }

                    if (statusEl) statusEl.classList.add('hidden');
                    console.log(`[Resolver] Kết quả cuối: ${url.substring(0,80)} → ${String(resolvedUrl).substring(0,120)}`);
                } else {
                    console.log('[Resolver] Resolve TẮT, chỉ follow redirect...');
                    try {
                        const xhrResult = await xhrFetchText(url);
                        const finalUrl = xhrResult.finalUrl || url;
                        if (finalUrl !== url && /\.(m3u8|mpd|ts)(\?|#|$)/i.test(finalUrl)) {
                            resolvedUrl = finalUrl;
                            console.log(`[Resolver] ✅ Redirect đến: ${resolvedUrl.substring(0,120)}`);
                        } else if (xhrResult.text && xhrResult.text.length > 5) {
                            const parsed = parseResponseForStream(xhrResult.text, finalUrl, url);
                            if (parsed && parsed.startsWith('http')) {
                                resolvedUrl = parsed;
                                console.log(`[Resolver] ✅ Tìm thấy trong response: ${resolvedUrl.substring(0,120)}`);
                            }
                        }
                    } catch (e) {
                        console.warn('[Resolver] XHR redirect thất bại, thử fetch:', e.message);
                        try {
                            const resp = await fetch(url, {
                                headers: {
                                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                                    'Accept': '*/*',
                                },
                                redirect: 'follow',
                            });
                            if (resp.ok) {
                                const finalUrl = resp.url;
                                if (finalUrl !== url) {
                                    resolvedUrl = finalUrl;
                                    console.log(`[Resolver] ✅ Fetch redirect đến: ${resolvedUrl.substring(0,120)}`);
                                }
                            }
                        } catch (e2) {
                            console.warn('[Resolver] Fetch redirect cũng thất bại:', e2.message);
                        }
                    }
                }
            }

            const isMPD = resolvedUrl.includes('.mpd') || (channel.props && channel.props['inputstream.adaptive.manifest_type'] === 'mpd');
            const isRawTS = /\.ts(\?|$)/i.test(resolvedUrl) || /extension=ts/i.test(resolvedUrl) ||
                            resolvedUrl.includes(':2086/') || resolvedUrl.includes(':2087/') ||
                            resolvedUrl.includes('/play/');

            // Case 1: DASH / MPD
            if (typeof shaka !== 'undefined' && isMPD && shaka.Player.isBrowserSupported()) {
                shakaInstance = new shaka.Player(videoPlayer);

                const drmType = channel.props && channel.props['inputstream.adaptive.license_type'];
                const licenseKey = channel.props && channel.props['inputstream.adaptive.license_key'];

                if (drmType === 'widevine' && licenseKey) {
                    shakaInstance.configure({
                        drm: {
                            servers: {
                                'com.widevine.alpha': licenseKey
                            }
                        }
                    });
                    console.log('[DRM] Configured Widevine license server:', licenseKey);
                } else if (drmType === 'clearkey' && licenseKey) {
                    let keyString = licenseKey;
                    const clearKeys = {};

                    if (resolvedUrl && (resolvedUrl.startsWith('{') || resolvedUrl.startsWith('['))) {
                        try {
                            const proxyData = JSON.parse(resolvedUrl);
                            let kid = proxyData.kid || (proxyData.keys && proxyData.keys[0]?.kid);
                            let key = proxyData.k || (proxyData.keys && proxyData.keys[0]?.k);
                            const streamUrl = proxyData.url || proxyData.data?.url || proxyData.stream?.url || proxyData.location;
                            if (streamUrl) resolvedUrl = streamUrl;
                            if (kid && key) {
                                clearKeys[base64ToHex(kid)] = base64ToHex(key);
                                console.log(`[ClearKey] Extracted from proxy JSON: KID=${kid}, KEY=${key}`);
                            }
                        } catch(e) { }
                    }

                    if (Object.keys(clearKeys).length === 0 && keyString && (keyString.startsWith('http://') || keyString.startsWith('https://'))) {
                        try {
                            const resp = await fetch(keyString);
                            if (resp.ok) keyString = await resp.text();
                        } catch (e) {
                            console.warn('[DRM] Fetch ClearKey license failed:', e.message);
                        }
                    }

                    if (Object.keys(clearKeys).length === 0) {
                        try {
                            const parsedObj = typeof keyString === 'string' && (keyString.startsWith('{') || keyString.startsWith('[')) ? JSON.parse(keyString) : null;
                            if (parsedObj && (parsedObj.keys || parsedObj.kid)) {
                                if (parsedObj.keys && Array.isArray(parsedObj.keys)) {
                                    parsedObj.keys.forEach(k => {
                                        const hexKid = base64ToHex(k.kid);
                                        const hexK = base64ToHex(k.k);
                                        if (hexKid && hexK) clearKeys[hexKid] = hexK;
                                    });
                                } else if (parsedObj.kid && parsedObj.k) {
                                    const hexKid = base64ToHex(parsedObj.kid);
                                    const hexK = base64ToHex(parsedObj.k);
                                    if (hexKid && hexK) clearKeys[hexKid] = hexK;
                                }
                            }
                        } catch (e) { }
                    }

                    if (Object.keys(clearKeys).length === 0 && typeof keyString === 'string' && keyString.includes(':')) {
                        const pairs = keyString.split(',');
                        pairs.forEach(pair => {
                            const parts = pair.split(':');
                            if (parts.length === 2) {
                                const k1 = parts[0].trim();
                                const k2 = parts[1].trim();
                                if (k1.length === 32 && k2.length === 32) clearKeys[k1.toLowerCase()] = k2.toLowerCase();
                                else {
                                    const hex1 = base64ToHex(k1);
                                    const hex2 = base64ToHex(k2);
                                    if (hex1 && hex2) clearKeys[hex1] = hex2;
                                }
                            }
                        });
                    }

                    if (Object.keys(clearKeys).length > 0) {
                        shakaInstance.configure({
                            drm: { clearKeys: clearKeys }
                        });
                        console.log('[DRM] Configured ClearKey:', clearKeys);
                    }
                }

                shakaInstance.addEventListener('error', (e) => {
                    console.error('[Shaka Error]', e);
                    loadingOverlay.classList.add('hidden');
                    showToast('Lỗi phát luồng MPD/DASH.', 'error');
                });

                try {
                    await shakaInstance.load(resolvedUrl);
                    loadingOverlay.classList.add('hidden');
                    videoPlayer.play().catch(() => {});
                    showToast(`Đang phát: ${channel.name}`);
                } catch (e) {
                    console.error('[Shaka Load Error]', e);
                    loadingOverlay.classList.add('hidden');
                    showToast('Không thể tải luồng MPD/DASH.', 'error');
                }

            // Case 2: Raw MPEG-TS Stream
            } else if (isRawTS && typeof mpegts !== 'undefined' && mpegts.isSupported()) {
                try {
                    mpegtsInstance = mpegts.createPlayer({
                        type: 'mse',
                        isLive: true,
                        url: resolvedUrl
                    }, {
                        enableStashBuffer: false,
                        stashInitialSize: 128,
                        liveBufferLatencyChasing: true
                    });
                    mpegtsInstance.attachMediaElement(videoPlayer);
                    mpegtsInstance.load();
                    mpegtsInstance.play();

                    loadingOverlay.classList.add('hidden');
                    videoPlayer.classList.add('is-live');
                    showToast(`Đang phát: ${channel.name}`);
                } catch (e) {
                    console.error('[mpegts Error]', e);
                    loadingOverlay.classList.add('hidden');
                    showToast('Lỗi phát luồng MPEG-TS.', 'error');
                }

            // Case 3: HLS Stream (.m3u8)
            } else if (Hls.isSupported()) {
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90
                });

                hlsInstance.loadSource(resolvedUrl);
                hlsInstance.attachMedia(videoPlayer);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                    loadingOverlay.classList.add('hidden');
                    videoPlayer.play().catch(() => {});
                    videoPlayer.classList.add('is-live');
                    showToast(`Đang phát: ${channel.name}`);

                    const qualitySelector = document.getElementById('quality-selector');
                    qualitySelector.innerHTML = '<option value="-1">Auto</option>';

                    if (data.levels && data.levels.length > 1) {
                        data.levels.forEach((level, index) => {
                            const option = document.createElement('option');
                            option.value = index;
                            option.textContent = `${level.height || 'SD'}p (${Math.round(level.bitrate / 1000)}k)`;
                            qualitySelector.appendChild(option);
                        });
                        qualitySelector.classList.remove('hidden');

                        qualitySelector.onchange = (e) => {
                            hlsInstance.currentLevel = parseInt(e.target.value);
                        };
                    } else {
                        qualitySelector.classList.add('hidden');
                    }
                });

                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.warn('[HLS Network Error] Trying to recover...');
                                hlsInstance.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.warn('[HLS Media Error] Trying to recover...');
                                hlsInstance.recoverMediaError();
                                break;
                            default:
                                console.error('[HLS Fatal Error]', data);
                                hlsInstance.destroy();
                                loadingOverlay.classList.add('hidden');
                                showToast('Lỗi phát luồng HLS.', 'error');
                                break;
                        }
                    }
                });

            // Case 4: Native Browser Player Fallback (iOS Safari, Direct MP4/AAC/MP3)
            } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl') || detectStreamType(resolvedUrl) === 'audio' || detectStreamType(resolvedUrl) === 'video') {
                videoPlayer.src = resolvedUrl;
                videoPlayer.addEventListener('loadedmetadata', () => {
                    loadingOverlay.classList.add('hidden');
                    videoPlayer.play().catch(() => {});
                    showToast(`Đang phát: ${channel.name}`);

                    if (videoPlayer.videoHeight === 0 && videoPlayer.videoWidth === 0) {
                        showAudioVisualizer(channel);
                    }
                }, { once: true });

                videoPlayer.addEventListener('error', () => {
                    loadingOverlay.classList.add('hidden');
                    showToast('Không thể phát tệp phương tiện này.', 'error');
                }, { once: true });
            } else {
                loadingOverlay.classList.add('hidden');
                showToast('Trình duyệt không hỗ trợ định dạng luồng này.', 'error');
            }
        }
    </script>
