<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src *; media-src * blob: data:; img-src * data:;">
    <title>LOTUS PLAYER</title>
    <link rel="icon" href="TV.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        :root {
            --accent: #f97316;
            --bg-deep: #0d131f;
            --panel-bg: #141c2e;
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #070a12;
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            margin: 0;
        }

        /* Modern Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .channel-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
        }

        .channel-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .channel-card.active {
            background: rgba(249, 115, 22, 0.15) !important;
            border-color: rgba(249, 115, 22, 0.5) !important;
        }

        .live-badge {
            background: linear-gradient(135deg, #ff5e3a 0%, #ff2a55 100%);
            box-shadow: 0 2px 6px rgba(255, 42, 85, 0.4);
        }

        /* Player Controls Overlays */
        #custom-controls {
            opacity: 0;
            transition: opacity 0.3s ease;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
        }

        .video-container.controls-active #custom-controls {
            opacity: 1;
        }

        .video-container:fullscreen {
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        .video-container:fullscreen #video-player {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Floating Player Controls */
        .player-float-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }

        .video-container.controls-active:not(.hide-cursor) .player-float-controls {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .video-container.hide-cursor {
            cursor: none !important;
        }

        .video-container.hide-cursor * {
            cursor: none !important;
        }

        .player-float-controls .ctrl-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .player-float-controls .ctrl-btn:hover {
            background: #ef4444;
            border-color: #ef4444;
            color: #fff;
        }

        /* Toasts */
        #toast-container {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
        }

        .toast {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.3s ease-out forwards;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        #channel-menu-container {
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
            max-height: 1000px;
            opacity: 1;
            overflow: hidden;
        }

        #channel-menu-container.menu-collapsed {
            max-height: 0 !important;
            opacity: 0;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            margin: 0 !important;
        }
    </style>
</head>

<body class="selection:bg-orange-500/30">
    <div id="toast-container"></div>

    <div class="flex flex-col h-screen w-screen p-2 sm:p-4 gap-3 box-border overflow-hidden bg-[#070a12] max-w-md mx-auto sm:max-w-none">

        <!-- HEADER PLAYER BAR (GIỐNG HÌNH) -->
        <header class="flex items-center justify-between px-3 py-2 bg-[#131b2e] rounded-xl border border-white/5 shrink-0">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-lg bg-pink-500/20 flex items-center justify-center border border-pink-500/30">
                    <i data-lucide="tv" class="w-4 h-4 text-pink-400"></i>
                </div>
                <div class="flex flex-col">
                    <span class="font-extrabold text-sm tracking-wider text-pink-500 leading-none">LOTUS</span>
                    <span class="font-bold text-xs tracking-widest text-pink-400 leading-tight">PLAYER</span>
                </div>
            </div>

            <!-- Nút hiển thị kênh đang phát dạng Capsule -->
            <div class="flex items-center gap-2 bg-slate-800/80 border border-white/10 rounded-full px-3 py-1 text-xs text-slate-300 max-w-[200px]">
                <span class="text-[10px] text-slate-400 whitespace-nowrap">Đang phát:</span>
                <span id="current-channel-title" class="font-medium text-white truncate">Chưa chọn</span>
            </div>
        </header>

        <!-- MAIN PLAYER AREA WRAPPER -->
        <div class="flex-1 flex flex-col gap-3 min-h-0 overflow-y-auto custom-scrollbar">
            
            <!-- Video Container -->
            <main class="w-full h-48 sm:h-72 lg:h-96 bg-black rounded-2xl overflow-hidden relative shadow-2xl shrink-0 border border-white/10">
                <div class="w-full h-full bg-black relative video-container overflow-hidden flex items-center justify-center">
                    <video id="video-player" class="w-full h-full object-contain" playsinline controls></video>

                    <!-- Player Overlay (Intro) -->
                    <div id="player-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-[#0d131f] transition-opacity duration-700 pointer-events-none">
                        <div class="w-16 h-16 rounded-full bg-orange-500/10 border border-orange-500/30 flex items-center justify-center relative">
                            <i data-lucide="play" class="w-7 h-7 text-orange-500 fill-orange-500 ml-1"></i>
                        </div>
                        <p class="text-xs text-slate-400 mt-3 font-medium">Chọn kênh bên dưới để xem</p>
                    </div>

                    <!-- Floating Controls -->
                    <div class="player-float-controls" id="float-controls">
                        <button class="ctrl-btn" title="Dừng phát" onclick="stopChannel()">
                            <i data-lucide="square" class="w-3.5 h-3.5 fill-current"></i>
                        </button>
                        <button class="ctrl-btn" title="Toàn màn hình" onclick="toggleFullscreen()" id="fullscreen-btn">
                            <i data-lucide="maximize" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>

                    <!-- Loading Overlay -->
                    <div id="loading-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/70 backdrop-blur-md z-20 hidden text-white">
                        <div class="w-8 h-8 border-2 border-orange-500/30 border-t-orange-500 rounded-full animate-spin"></div>
                        <p id="resolve-status" class="text-[11px] text-orange-400 mt-3 flex items-center gap-1.5">
                            <span class="inline-block w-1.5 h-1.5 bg-orange-400 rounded-full animate-pulse"></span>
                            Đang tải luồng...
                        </p>
                    </div>
                </div>
            </main>

            <!-- DANH SÁCH KÊNH HEADER & MENU -->
            <section class="flex-1 flex flex-col bg-[#111726] rounded-2xl border border-white/5 overflow-hidden">
                
                <!-- Thanh Tiêu Đề Danh Sách Kênh + Nút LIVE + Nút Thu Gọn Menu -->
                <div class="p-3 bg-[#161f33] border-b border-white/5 flex items-center justify-between shrink-0">
                    <h2 class="font-extrabold text-xs tracking-wider text-slate-200 uppercase flex items-center gap-2">
                        DANH SÁCH KÊNH
                    </h2>
                    
                    <div class="flex items-center gap-2">
                        <!-- Badge LIVE -->
                        <span class="live-badge text-[9px] font-extrabold text-white px-2 py-0.5 rounded-md uppercase tracking-wider">
                            LIVE
                        </span>

                        <!-- Nút Ẩn/Hiện Menu -->
                        <button id="toggle-menu-btn" onclick="toggleChannelMenu()" class="w-7 h-7 rounded-lg bg-blue-600/80 hover:bg-blue-600 text-white flex items-center justify-center transition-all active:scale-95 shadow" title="Ẩn/Hiện Danh sách kênh">
                            <i id="toggle-menu-icon" data-lucide="chevron-up" class="w-4 h-4"></i>
                        </button>

                        <!-- Nút Thêm Nguồn -->
                        <button onclick="openAddDialog()" class="w-7 h-7 rounded-lg bg-white/5 hover:bg-white/10 text-slate-300 flex items-center justify-center border border-white/10 transition-all" title="Thêm nguồn m3u">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Khung Chứa Menu (Có thể thu gọn/mở rộng) -->
                <div id="channel-menu-container" class="flex-1 flex flex-col p-3 gap-3 overflow-hidden">
                    
                    <!-- Search Input -->
                    <div class="relative group flex items-center shrink-0">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-400 group-focus-within:text-orange-400 transition-colors pointer-events-none z-10"></i>
                        <input type="text" id="search-input" placeholder="Tìm kiếm kênh..." class="w-full pl-9 pr-8 py-1.5 bg-[#0a0f1d] border border-white/10 rounded-xl text-xs text-white focus:outline-none focus:border-orange-500 transition-all placeholder-slate-500" oninput="filterChannels()">
                    </div>

                    <!-- Category Tabs -->
                    <div id="category-tabs" class="flex gap-1.5 overflow-x-auto custom-scrollbar shrink-0 pb-1">
                        <!-- Tabs rendered by JS -->
                    </div>

                    <!-- Channel List Space -->
                    <div class="flex-1 overflow-y-auto custom-scrollbar pr-1">
                        <ul id="channel-list" class="space-y-2">
                            <!-- Empty State -->
                            <div id="empty-state" class="py-12 flex flex-col items-center justify-center text-center opacity-40">
                                <i data-lucide="layout-list" class="w-10 h-10 mb-2"></i>
                                <h3 class="font-medium text-xs">Chưa có kênh nào</h3>
                                <p class="text-[10px] mt-1">Nhấn dấu cộng để thêm playlist</p>
                            </div>
                        </ul>
                    </div>

                    <!-- Footer Info -->
                    <div class="pt-2 border-t border-white/5 flex items-center justify-between shrink-0 text-[10px] text-slate-400">
                        <span id="channel-count" class="font-semibold uppercase tracking-wider">0 Kênh</span>
                        <button onclick="clearList()" class="hover:text-red-400 transition-colors uppercase font-bold">Dọn dẹp</button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- Modal Thêm Kênh / Playlist -->
    <div id="add-dialog" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 p-4">
        <div class="bg-[#111726] border border-white/10 rounded-2xl p-5 w-full max-w-sm flex flex-col gap-4 shadow-2xl transform scale-95 transition-transform duration-300" id="add-dialog-content">

            <div class="flex items-center justify-between border-b border-white/10 pb-3">
                <h2 class="text-white font-semibold text-xs flex items-center gap-2 uppercase tracking-wider">
                    <i data-lucide="list-plus" class="w-4 h-4 text-orange-400"></i>
                    Thêm Nguồn Phát
                </h2>
                <button onclick="closeAddDialog()" class="text-slate-400 hover:text-white transition-colors p-1 rounded-md">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Quick Picks -->
            <div class="flex flex-col gap-2">
                <label class="text-slate-400 text-[11px] font-medium flex items-center gap-1.5">
                    <i data-lucide="zap" class="w-3.5 h-3.5 text-yellow-500 fill-yellow-500/20"></i> Nguồn phát nhanh
                </label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="loadPredefinedUrl('https://raw.githubusercontent.com/hieu-TQS/error/refs/heads/main/error.m3u')" class="px-3 py-2 bg-slate-800/80 hover:bg-orange-600/20 border border-white/5 hover:border-orange-500/40 rounded-xl transition-all flex items-center justify-center">
                        <span class="text-xs font-bold text-white">TV Việt Nam</span>
                    </button>
                    <button onclick="loadPredefinedUrl('https://tinyurl.com/HoiQuanClick/')" class="px-3 py-2 bg-slate-800/80 hover:bg-red-600/20 border border-white/5 hover:border-red-500/40 rounded-xl transition-all flex items-center justify-center">
                        <span class="text-xs font-bold text-white">Hội Quán</span>
                    </button>
                </div>
            </div>

            <!-- Input URL -->
            <div class="flex flex-col gap-1.5">
                <label class="text-slate-400 text-[11px] font-medium">URL Playlist (.m3u/.m3u8)</label>
                <div class="relative flex w-full">
                    <input type="text" id="url-input" placeholder="https://domain.com/playlist.m3u" class="w-full pl-3 pr-16 py-2 bg-[#0a0f1d] border border-white/10 rounded-xl text-xs text-white focus:outline-none focus:border-orange-500">
                    <button onclick="loadFromUrl(); closeAddDialog();" class="absolute right-1 top-1 bottom-1 bg-orange-600 hover:bg-orange-500 text-white px-3 rounded-lg text-xs font-medium transition-colors">
                        TẢI
                    </button>
                </div>
            </div>

            <!-- File Upload -->
            <div class="flex flex-col gap-1.5">
                <input type="file" id="file-upload" accept=".m3u,.m3u8,.json" class="hidden" onchange="handleFileUpload(event); closeAddDialog();">
                <label for="file-upload" class="cursor-pointer flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 text-xs font-medium rounded-xl border border-white/5 transition-all w-full">
                    <i data-lucide="folder-open" class="w-4 h-4 text-orange-400"></i>
                    <span>Tải tệp từ máy (.m3u)</span>
                </label>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        if (typeof shaka !== 'undefined') shaka.polyfill.installAll();

        // State & DOM Variables
        let allChannels = [];
        let hlsInstance = null;
        let shakaInstance = null;
        let mpegtsInstance = null;
        let currentPlayingUrl = null;
        let currentCategory = 'Tất cả';
        let isMenuCollapsed = false;

        const videoPlayer = document.getElementById('video-player');
        const channelListEl = document.getElementById('channel-list');
        const emptyStateEl = document.getElementById('empty-state');
        const channelCountEl = document.getElementById('channel-count');
        const searchInput = document.getElementById('search-input');
        const playerOverlay = document.getElementById('player-overlay');
        const loadingOverlay = document.getElementById('loading-overlay');
        const videoContainer = document.querySelector('.video-container');
        const currentChannelTitle = document.getElementById('current-channel-title');

        // Toggle ẩn / hiện Menu Danh sách kênh
        function toggleChannelMenu() {
            isMenuCollapsed = !isMenuCollapsed;
            const menuContainer = document.getElementById('channel-menu-container');
            const toggleIcon = document.getElementById('toggle-menu-icon');

            if (isMenuCollapsed) {
                menuContainer.classList.add('menu-collapsed');
                toggleIcon.setAttribute('data-lucide', 'chevron-down');
            } else {
                menuContainer.classList.remove('menu-collapsed');
                toggleIcon.setAttribute('data-lucide', 'chevron-up');
            }
            lucide.createIcons({ root: document.getElementById('toggle-menu-btn') });
        }

        // Mouse inactivity logic for controls
        let inactivityTimeout;
        function showControls() {
            videoContainer.classList.remove('hide-cursor');
            videoContainer.classList.add('controls-active');
            clearTimeout(inactivityTimeout);
            inactivityTimeout = setTimeout(hideControls, 2500);
        }

        function hideControls() {
            videoContainer.classList.remove('controls-active');
            if (document.fullscreenElement) videoContainer.classList.add('hide-cursor');
        }

        videoContainer.addEventListener('mousemove', showControls);
        videoContainer.addEventListener('mousedown', showControls);

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const iconName = type === 'success' ? 'check-circle-2' : 'alert-circle';
            toast.innerHTML = `<i data-lucide="${iconName}" class="w-4 h-4 ${type === 'success' ? 'text-green-400' : 'text-red-400'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons({ root: toast });
            setTimeout(() => { if (container.contains(toast)) container.removeChild(toast); }, 3000);
        }

        function parseM3U(text) {
            const lines = text.split('\n');
            const channels = [];
            let currentChannel = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.toUpperCase().includes('EXTINF:')) {
                    currentChannel = { name: 'Kênh ẩn danh', logo: '', group: 'Khác', url: '' };
                    const commaIndex = line.lastIndexOf(',');
                    if (commaIndex !== -1) currentChannel.name = line.substring(commaIndex + 1).trim();

                    const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                    if (logoMatch && logoMatch[1]) currentChannel.logo = logoMatch[1];

                    const groupMatch = line.match(/group-title="([^"]+)"/i);
                    if (groupMatch && groupMatch[1]) currentChannel.group = groupMatch[1];
                } else if (line !== '' && !line.startsWith('#')) {
                    if (currentChannel) {
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = null;
                    } else {
                        channels.push({ name: 'Luồng trực tiếp', logo: '', group: 'Khác', url: line });
                    }
                }
            }
            return channels;
        }

        function processData(channels) {
            if (channels.length === 0) return showToast('Không có dữ liệu kênh.', 'error');
            allChannels = channels;
            searchInput.value = '';
            currentCategory = 'Tất cả';
            renderCategoryTabs();
            filterChannels();
            showToast(`Đã tải ${allChannels.length} kênh thành công!`);
        }

        function renderCategoryTabs() {
            const tabsContainer = document.getElementById('category-tabs');
            tabsContainer.innerHTML = '';
            const groups = ['Tất cả', ...new Set(allChannels.map(c => c.group || 'Khác'))];

            groups.forEach(group => {
                const btn = document.createElement('button');
                btn.className = `px-2.5 py-1 rounded-lg text-[11px] font-semibold whitespace-nowrap transition-all ${currentCategory === group ? 'bg-orange-600 text-white shadow' : 'bg-white/5 text-slate-400 hover:bg-white/10'}`;
                btn.innerText = group;
                btn.onclick = () => {
                    currentCategory = group;
                    renderCategoryTabs();
                    filterChannels();
                };
                tabsContainer.appendChild(btn);
            });
        }

        function filterChannels() {
            const query = searchInput.value.toLowerCase().trim();
            let filtered = allChannels;

            if (currentCategory !== 'Tất cả') {
                filtered = filtered.filter(c => (c.group || 'Khác') === currentCategory);
            }

            if (query) {
                filtered = filtered.filter(c => c.name.toLowerCase().includes(query));
            }

            renderChannelsExplicit(filtered);
            channelCountEl.textContent = `${filtered.length} Kênh`;
        }

        function renderChannelsExplicit(channels) {
            channelListEl.innerHTML = '';
            if (channels.length === 0) {
                emptyStateEl.style.display = 'flex';
                return;
            }
            emptyStateEl.style.display = 'none';

            const fragment = document.createDocumentFragment();
            channels.forEach((channel) => {
                const li = document.createElement('li');
                const isPlaying = currentPlayingUrl === channel.url;

                // Thiết kế thẻ kênh giống Lotus Player hình chụp
                li.className = `channel-card relative flex items-center justify-between p-2.5 rounded-xl cursor-pointer select-none ${isPlaying ? 'active' : ''}`;

                const logoHtml = channel.logo
                    ? `<img src="${channel.logo}" alt="" class="w-full h-full object-contain" loading="lazy">`
                    : `<i data-lucide="tv" class="w-4 h-4 text-slate-400"></i>`;

                li.innerHTML = `
                    <div class="flex items-center gap-3 min-w-0 flex-1 pr-2">
                        <div class="w-9 h-6 shrink-0 bg-slate-900/80 rounded border border-white/10 flex items-center justify-center overflow-hidden">
                            ${logoHtml}
                        </div>
                        <h3 class="text-xs font-medium truncate ${isPlaying ? 'text-orange-400 font-bold' : 'text-slate-200'}">
                            ${channel.name}
                        </h3>
                    </div>
                    
                    <!-- Badge LIVE màu đỏ/cam nổi bật bên phải mỗi mục kênh -->
                    <span class="live-badge text-[8px] font-extrabold text-white px-2 py-0.5 rounded-md uppercase tracking-wider shrink-0">
                        LIVE
                    </span>
                `;

                li.onclick = () => playChannel(channel);
                fragment.appendChild(li);
            });

            channelListEl.appendChild(fragment);
            lucide.createIcons({ root: channelListEl });
        }

        async function playChannel(channel) {
            currentPlayingUrl = channel.url;
            currentChannelTitle.textContent = channel.name;

            playerOverlay.style.opacity = '0';
            loadingOverlay.classList.remove('hidden');

            filterChannels();

            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            if (shakaInstance) { await shakaInstance.destroy(); shakaInstance = null; }
            if (mpegtsInstance) { mpegtsInstance.destroy(); mpegtsInstance = null; }

            videoPlayer.pause();
            videoPlayer.removeAttribute('src');
            videoPlayer.load();

            const url = channel.url;

            // HLS Stream (.m3u8)
            if (Hls.isSupported() && (url.includes('.m3u8') || !url.includes('.'))) {
                hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(videoPlayer);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    loadingOverlay.classList.add('hidden');
                    videoPlayer.play().catch(() => {});
                });

                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        loadingOverlay.classList.add('hidden');
                        showToast('Lỗi phát luồng video.', 'error');
                    }
                });
            } else {
                // Direct Fallback
                videoPlayer.src = url;
                videoPlayer.addEventListener('loadedmetadata', () => {
                    loadingOverlay.classList.add('hidden');
                    videoPlayer.play().catch(() => {});
                }, { once: true });

                videoPlayer.addEventListener('error', () => {
                    loadingOverlay.classList.add('hidden');
                    showToast('Không thể phát kênh này.', 'error');
                }, { once: true });
            }
        }

        function stopChannel() {
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            videoPlayer.pause();
            videoPlayer.removeAttribute('src');
            videoPlayer.load();
            currentPlayingUrl = null;
            currentChannelTitle.textContent = 'Chưa chọn';
            playerOverlay.style.opacity = '1';
            loadingOverlay.classList.add('hidden');
            filterChannels();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function clearList() {
            allChannels = [];
            stopChannel();
            renderCategoryTabs();
            filterChannels();
        }

        const addDialog = document.getElementById('add-dialog');
        function openAddDialog() { addDialog.classList.remove('opacity-0', 'pointer-events-none'); }
        function closeAddDialog() { addDialog.classList.add('opacity-0', 'pointer-events-none'); }

        async function loadPredefinedUrl(url) {
            document.getElementById('url-input').value = url;
            closeAddDialog();
            await loadFromUrl();
        }

        async function loadFromUrl() {
            const url = document.getElementById('url-input').value.trim();
            if (!url) return showToast('Vui lòng nhập URL!', 'error');

            showToast('Đang kết nối...', 'success');
            try {
                const response = await fetch(url);
                if (response.ok) {
                    const text = await response.text();
                    processData(parseM3U(text));
                } else {
                    throw new Error('HTTP Error');
                }
            } catch (e) {
                showToast('Không thể tải URL (có thể bị chặn CORS)', 'error');
            }
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                processData(parseM3U(e.target.result));
            };
            reader.readAsText(file);
            event.target.value = '';
        }
    </script>
</body>

</html>
