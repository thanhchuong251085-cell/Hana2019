<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotus Player - Truyền Hình Trực Tuyến Đa Nguồn</title>
    
    <!-- 1. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. HLS.js (Phát luồng .m3u8) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    
    <!-- 3. Shaka Player (Phát luồng DASH .mpd) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>
    
    <!-- 4. MPEG-TS.js (Phát luồng .ts / HTTP-FLV) -->
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    
    <!-- 5. Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .channel-btn.active {
            background-color: #2563eb;
            color: #ffffff;
            font-weight: bold;
            border-left: 4px solid #ef4444;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col font-sans">

    <!-- Thanh tiêu đề (Header) -->
    <header class="bg-gray-800 px-4 py-3 border-b border-gray-700 flex justify-between items-center shadow-lg">
        <h1 class="text-xl font-bold text-red-500 flex items-center gap-2">
            <i data-lucide="tv" class="w-6 h-6"></i> LOTUS PLAYER
        </h1>
        <span id="current-title" class="text-sm bg-gray-700 px-3 py-1 rounded-full text-gray-200 flex items-center gap-2">
            <i data-lucide="radio" class="w-4 h-4 text-green-400"></i> Đang phát: Chọn kênh...
        </span>
    </header>

    <!-- Khung nội dung chính -->
    <div class="flex-1 flex flex-col md:flex-row">
        
        <!-- Khung xem Video (Dynamic Player Container) -->
        <div class="flex-1 bg-black relative min-h-[300px] md:min-h-[500px] flex items-center justify-center">
            
            <!-- Video Player chính (Hỗ trợ HLS, DASH, TS, MP4) -->
            <video id="main-video" class="w-full h-full object-contain" controls autoplay playsinline></video>
            
            <!-- Frame dự phòng (Dành cho link nhúng web như THVL, VTVGo) -->
            <iframe id="iframe-player" class="w-full h-full absolute inset-0 border-0 hidden" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
        </div>

        <!-- Danh sách kênh -->
        <div class="w-full md:w-80 bg-gray-800 p-4 border-t md:border-t-0 md:border-l border-gray-700 flex flex-col">
            <h2 class="text-base font-semibold mb-3 text-gray-300 border-b border-gray-700 pb-2 flex justify-between items-center">
                <span class="flex items-center gap-2"><i data-lucide="list" class="w-4 h-4"></i> DANH SÁCH KÊNH</span>
                <div class="flex items-center gap-2">
                    <button onclick="toggleChannelMenu()" class="text-xs bg-red-600 hover:bg-red-700 px-2.5 py-1 rounded text-white font-bold cursor-pointer transition active:scale-95 shadow flex items-center gap-1">
                        <i data-lucide="play" class="w-3 h-3"></i> LIVE
                    </button>
                    <button onclick="openModal()" class="text-xs bg-blue-600 hover:bg-blue-700 px-2.5 py-1 rounded text-white font-bold cursor-pointer transition active:scale-95 shadow flex items-center justify-center p-1">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                </div>
            </h2>
            
            <div id="channel-list" class="flex flex-col gap-2 overflow-y-auto max-h-[450px] md:max-h-full pr-1">
                <!-- Danh sách kênh tự động sinh -->
            </div>
        </div>

    </div>

    <!-- Chân trang -->
    <footer class="bg-gray-800 py-2 text-center text-xs text-gray-400 border-t border-gray-700">
        Lotus Player © 2026 - Tự động mở khóa CORS & Hỗ trợ Đa luồng
    </footer>

    <!-- POPUP MODAL: THÊM NGUỒN PHÁT -->
    <div id="source-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-800 w-full max-w-md rounded-2xl border border-gray-700 p-5 shadow-2xl relative text-gray-200">
            
            <div class="flex justify-between items-center pb-3 border-b border-gray-700 mb-4">
                <h3 class="text-lg font-bold flex items-center gap-2 text-white">
                    <i data-lucide="folder-plus" class="text-blue-500 w-5 h-5"></i> Thêm Nguồn Phát
                </h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <!-- Mục Nguồn Nhanh -->
            <div class="mb-5">
                <div class="text-xs font-semibold text-gray-400 mb-2 flex items-center gap-1">
                    <i data-lucide="zap" class="w-3.5 h-3.5 text-yellow-400"></i> Nguồn phát nhanh
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="loadDefaultTV()" class="bg-gray-700/60 hover:bg-blue-600/30 hover:border-blue-500 border border-transparent py-2.5 rounded-xl font-medium text-sm transition">
                        Kênh Mặc Định
                    </button>
                    <button onclick="loadFromUrl('https://raw.githubusercontent.com/thanhchuong251085-cell/Hana2019/main/tviptv.m3u')" class="bg-gray-700/60 hover:bg-blue-600/30 hover:border-blue-500 border border-transparent py-2.5 rounded-xl font-medium text-sm transition">
                        Playlist M3U
                    </button>
                </div>
            </div>

            <div class="text-center text-xs text-gray-500 tracking-wider mb-4">NHẬP LIÊN KẾT</div>

            <div class="mb-5">
                <div class="flex items-center gap-2 bg-gray-900 border border-gray-700 rounded-xl p-1.5 focus-within:border-blue-500">
                    <i data-lucide="link" class="w-4 h-4 ml-2 text-gray-400"></i>
                    <input id="custom-url-input" type="text" placeholder="https://...m3u8 / .mpd / .ts" class="bg-transparent border-none outline-none text-xs text-white w-full px-1">
                    <button onclick="loadCustomUrl()" class="bg-cyan-500 hover:bg-cyan-600 text-gray-900 font-bold text-xs px-3 py-1.5 rounded-lg transition">
                        TẢI
                    </button>
                </div>
            </div>

            <div class="text-center text-xs text-gray-500 tracking-wider mb-4">HOẶC</div>

            <div>
                <label class="flex items-center justify-center gap-2 w-full bg-gray-700/50 hover:bg-gray-700 border border-gray-600 rounded-xl py-2.5 cursor-pointer transition text-xs font-medium">
                    <i data-lucide="file-up" class="w-4 h-4"></i> Tải tệp từ máy (.m3u, .m3u8)
                    <input type="file" id="local-file-input" accept=".m3u,.m3u8" onchange="handleFileUpload(event)" class="hidden">
                </label>
            </div>

        </div>
    </div>

    <!-- Script xử lý Player thông minh -->
    <script>
        // Danh sách kênh mẫu
        const defaultChannels = [
            { group: "KÊNH QUỐC TẾ (DEMO)", name: "HBO HD (Clear Stream)", url: "https://demo.unified-streaming.com/k8s/live/stable/hls/clear/hbo.m3u8" },
            { group: "KÊNH QUỐC TẾ (DEMO)", name: "AXN (DASH Stream)", url: "https://storage.googleapis.com/shaka-demo-assets/angel-one/dash.mpd" },
            { group: "TRUYỀN HÌNH VĨNH LONG", name: "THVL 1 HD", url: "https://www.thvli.vn/live/thvl1-hd" },
            { group: "TRUYỀN HÌNH VĨNH LONG", name: "THVL 2 HD", url: "https://www.thvli.vn/live/thvl2-hd" },
            { group: "ĐÀI TRUYỀN HÌNH VIỆT NAM", name: "VTV1 HD", url: "https://live.fptplay53.net/live/media/vtv1/live247-hls-avc/vtv1-avc1_5600000=10000-mp4a_131600=20000.m3u8" },
            { group: "ĐÀI TRUYỀN HÌNH VIỆT NAM", name: "VTV3 HD", url: "https://vips-livecdn.fptplay.net/live/media/vtv3/live247-hls-avc/vtv3-avc1_5600000=10000-mp4a_140800_vie=20000.m3u8" }
        ];

        let currentChannels = [...defaultChannels];
        
        const videoEl = document.getElementById('main-video');
        const iframeEl = document.getElementById('iframe-player');
        const channelListContainer = document.getElementById('channel-list');
        const currentTitle = document.getElementById('current-title');

        let hlsEngine = null;
        let mpegtsEngine = null;
        let shakaEngine = null;

        // Cấu hình CORS Proxy trung gian
        const CORS_PROXY = "https://corsproxy.io/?";

        // Khởi tạo Shaka Player
        async function initShaka() {
            shaka.polyfill.installAll();
            if (shaka.Player.isBrowserSupported()) {
                shakaEngine = new shaka.Player(videoEl);
            }
        }
        initShaka();

        // Giải phóng bộ nhớ khi đổi kênh
        function destroyEngines() {
            if (hlsEngine) { hlsEngine.destroy(); hlsEngine = null; }
            if (mpegtsEngine) { mpegtsEngine.destroy(); mpegtsEngine = null; }
            if (shakaEngine) { shakaEngine.detach(); }
            videoEl.pause();
            videoEl.removeAttribute('src');
            videoEl.load();
        }

        // Hàm phát kênh chính
        function playChannel(channel, selectedBtn) {
            destroyEngines();
            currentTitle.innerHTML = `<i data-lucide="radio" class="w-4 h-4 text-green-400"></i> Đang phát: ${channel.name}`;
            lucide.createIcons();

            const rawUrl = channel.url.trim();

            // 1. Link nhúng trang web (THVL, VTVGo...) -> Dùng iframe
            if (rawUrl.includes('thvli.vn') || rawUrl.includes('vtvgo.vn') || rawUrl.includes('hanoitv.vn') || rawUrl.includes('.html')) {
                videoEl.classList.add('hidden');
                iframeEl.classList.remove('hidden');
                iframeEl.src = rawUrl;
                return;
            }

            // Dùng HTML5 Player cho các luồng trực tiếp
            iframeEl.classList.add('hidden');
            videoEl.classList.remove('hidden');

            // 2. Định dạng DASH (.mpd) -> Dùng Shaka Player
            if (rawUrl.includes('.mpd')) {
                const targetUrl = rawUrl.startsWith('http') ? CORS_PROXY + encodeURIComponent(rawUrl) : rawUrl;
                shakaEngine.attach(videoEl).then(() => {
                    return shakaEngine.load(targetUrl);
                }).catch(e => console.error("Lỗi Shaka:", e));
            } 
            // 3. Định dạng MPEG-TS (.ts) -> Dùng mpegts.js
            else if (rawUrl.includes('.ts') || rawUrl.includes('flv')) {
                const targetUrl = rawUrl.startsWith('http') ? CORS_PROXY + encodeURIComponent(rawUrl) : rawUrl;
                if (mpegts.getFeatureList().mseLivePlayback) {
                    mpegtsEngine = mpegts.createPlayer({ type: 'mse', isLive: true, url: targetUrl });
                    mpegtsEngine.attachMediaElement(videoEl);
                    mpegtsEngine.load();
                    mpegtsEngine.play();
                }
            } 
            // 4. Định dạng HLS (.m3u8) -> Dùng Hls.js kết hợp CORS Proxy
            else {
                // Tự động gắn CORS Proxy nếu là URL đường dẫn mạng
                const targetUrl = rawUrl.startsWith('http') ? CORS_PROXY + encodeURIComponent(rawUrl) : rawUrl;

                if (Hls.isSupported()) {
                    hlsEngine = new Hls({
                        enableWorker: true,
                        lowLatencyMode: true
                    });
                    hlsEngine.loadSource(targetUrl);
                    hlsEngine.attachMedia(videoEl);
                    hlsEngine.on(Hls.Events.MANIFEST_PARSED, () => {
                        videoEl.play().catch(e => console.log("Cần tương tác để phát video:", e));
                    });
                } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
                    videoEl.src = targetUrl;
                    videoEl.play();
                }
            }

            // Đổi trạng thái giao diện Active
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            if (selectedBtn) selectedBtn.classList.add('active');
        }

        // Render Danh sách Kênh
        function renderChannels() {
            channelListContainer.innerHTML = '';
            let currentGroup = '';

            currentChannels.forEach((ch, index) => {
                if (ch.group !== currentGroup) {
                    currentGroup = ch.group;
                    const groupTitle = document.createElement('div');
                    groupTitle.className = 'text-xs font-bold text-yellow-400 mt-3 mb-1 uppercase tracking-wider border-b border-gray-700 pb-1';
                    groupTitle.textContent = currentGroup;
                    channelListContainer.appendChild(groupTitle);
                }

                const btn = document.createElement('button');
                btn.className = `channel-btn w-full text-left p-2.5 rounded-lg bg-gray-700 hover:bg-gray-600 transition flex items-center justify-between ${index === 0 ? 'active' : ''}`;
                btn.innerHTML = `
                    <span class="text-sm flex items-center gap-2"><i data-lucide="tv" class="w-3.5 h-3.5"></i> ${ch.name}</span>
                    <span class="text-[10px] bg-red-600 text-white px-1.5 py-0.5 rounded font-bold">LIVE</span>
                `;
                
                btn.onclick = () => playChannel(ch, btn);
                channelListContainer.appendChild(btn);
            });
            
            lucide.createIcons();
        }

        // Xử lý Giao diện
        function toggleChannelMenu() { channelListContainer.classList.toggle('hidden'); }
        function openModal() { document.getElementById('source-modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('source-modal').classList.add('hidden'); }

        function loadDefaultTV() {
            currentChannels = [...defaultChannels];
            renderChannels();
            if (currentChannels.length > 0) playChannel(currentChannels[0], channelListContainer.querySelector('.channel-btn'));
            closeModal();
        }

        async function loadFromUrl(url) {
            if (!url) return;
            try {
                // Tải M3U qua CORS Proxy để tránh lỗi chặn kết nối
                const proxyFetchUrl = CORS_PROXY + encodeURIComponent(url);
                const response = await fetch(proxyFetchUrl);
                if (!response.ok) throw new Error("Không thể tải nguồn IPTV");
                const text = await response.text();
                parseAndSetM3u(text);
                closeModal();
            } catch (err) { alert("Lỗi khi tải playlist: " + err.message); }
        }

        function loadCustomUrl() {
            const url = document.getElementById('custom-url-input').value.trim();
            if (url) loadFromUrl(url);
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                parseAndSetM3u(e.target.result);
                closeModal();
            };
            reader.readAsText(file);
        }

        // Đọc dữ liệu file M3U
        function parseAndSetM3u(m3uContent) {
            const lines = m3uContent.split('\n');
            const newChannels = [];
            let currentName = '';
            let currentGroup = 'KÊNH NHẬP VÀO';

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const groupMatch = line.match(/group-title="([^"]+)"/i);
                    if (groupMatch) currentGroup = groupMatch[1];
                    const commaIndex = line.lastIndexOf(',');
                    if (commaIndex !== -1) currentName = line.substring(commaIndex + 1).trim();
                } else if (line && !line.startsWith('#')) {
                    if (currentName) {
                        newChannels.push({ group: currentGroup, name: currentName, url: line });
                        currentName = '';
                    }
                }
            });

            if (newChannels.length > 0) {
                currentChannels = newChannels;
                renderChannels();
                const firstBtn = channelListContainer.querySelector('.channel-btn');
                if (firstBtn) playChannel(currentChannels[0], firstBtn);
            } else {
                alert("Tệp M3U không chứa danh sách kênh hợp lệ.");
            }
        }

        // Chạy lần đầu
        renderChannels();
        lucide.createIcons();
    </script>
</body>
</html>
