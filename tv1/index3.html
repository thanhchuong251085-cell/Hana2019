<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Player - VTV & HTV Group</title>

    <!-- Thư viện phát video -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar chứa danh sách kênh */
        #sidebar { width: 320px; background: #1e1e1e; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; background: #252525; font-size: 18px; font-weight: bold; border-bottom: 1px solid #333; }
        
        .channel-list { flex: 1; overflow-y: auto; padding: 10px; }

        /* Nhóm Kênh (Group Item) */
        .group-item { margin-bottom: 8px; border: 1px solid #333; border-radius: 6px; overflow: hidden; background: #282828; }
        .group-header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 15px; cursor: pointer; user-select: none; font-weight: bold; background: #333; 
        }
        .group-header:hover { background: #3e3e3e; }
        .toggle-btn { font-size: 18px; font-weight: bold; width: 24px; text-align: center; }

        /* Sub-list chứa danh sách kênh bên trong */
        .group-content { display: none; background: #1e1e1e; }
        .group-item.active .group-content { display: block; }

        .channel-btn { 
            display: block; width: 100%; padding: 10px 20px; text-align: left; 
            background: transparent; color: #ccc; border: none; border-bottom: 1px solid #2a2a2a; 
            cursor: pointer; transition: 0.2s; 
        }
        .channel-btn:hover { background: #007bff; color: #fff; }

        /* Khung Player chính */
        #player-container { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; background: #000; }
        video { width: 100%; height: 100%; max-height: 100vh; object-fit: contain; }

        /* Overlay Loading & Toast */
        #loading-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; font-size: 20px; }
        #loading-overlay.hidden { display: none; }
        .toast { position: absolute; bottom: 20px; right: 20px; background: rgba(220,53,69,0.9); padding: 10px 20px; border-radius: 4px; display: none; }
        .toast.show { display: block; }
        
        #quality-selector { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #555; padding: 5px 10px; border-radius: 4px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Sidebar Danh Sách Kênh -->
    <div id="sidebar">
        <div class="sidebar-header">Danh Sách Kênh Truyền Hình</div>
        <div class="channel-list">

            <!-- Nhóm Kênh VTV -->
            <div class="group-item" id="group-vtv">
                <div class="group-header" onclick="toggleGroup('group-vtv')">
                    <span>📺 Danh sách Kênh VTV</span>
                    <span class="toggle-btn">+</span>
                </div>
                <div class="group-content">
                    <button class="channel-btn" onclick="playChannel('vtv1')">VTV1 HD</button>
                    <button class="channel-btn" onclick="playChannel('vtv3')">VTV3 HD</button>
                    <button class="channel-btn" onclick="playChannel('vtv6')">VTV5 / VTV6</button>
                </div>
            </div>

            <!-- Nhóm Kênh HTV -->
            <div class="group-item" id="group-htv">
                <div class="group-header" onclick="toggleGroup('group-htv')">
                    <span>📺 Danh sách Kênh HTV</span>
                    <span class="toggle-btn">+</span>
                </div>
                <div class="group-content">
                    <button class="channel-btn" onclick="playChannel('htv7')">HTV7 HD</button>
                    <button class="channel-btn" onclick="playChannel('htv9')">HTV9 HD</button>
                    <button class="channel-btn" onclick="playChannel('htv2')">HTV2 Vie Channel</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Khung Video Player -->
    <div id="player-container">
        <select id="quality-selector" class="hidden"></select>
        <div id="loading-overlay" class="hidden">Đang tải luồng phát...</div>
        <div id="toast" class="toast"></div>
        <video id="videoPlayer" controls autoplay></video>
    </div>

    <script>
        // --- Dữ liệu Cấu hình Kênh (Hỗ trợ M3U8, MPD DRM, TS Raw) ---
        const channels = {
            'vtv1': {
                name: 'VTV1 HD',
                url: 'https://vtv1-manifest.vtvcab.vn/manifest.m3u8'
            },
            'vtv3': {
                name: 'VTV3 HD',
                url: 'https://vtv3-manifest.vtvcab.vn/manifest.m3u8'
            },
            'vtv6': {
                name: 'VTV5 HD',
                url: 'https://vtv5-manifest.vtvcab.vn/manifest.m3u8'
            },
            'htv7': {
                name: 'HTV7 HD',
                url: 'https://live.httv.vn/htv7/index.m3u8'
            },
            'htv9': {
                name: 'HTV9 HD',
                url: 'https://live.httv.vn/htv9/index.m3u8'
            },
            'htv2': {
                name: 'HTV2 HD',
                url: 'https://live.httv.vn/htv2/index.m3u8'
            }
        };

        // --- Toàn cục các Instance Player ---
        let shakaInstance = null;
        let hlsInstance = null;
        let mpegtsInstance = null;

        const videoPlayer = document.getElementById('videoPlayer');
        const loadingOverlay = document.getElementById('loading-overlay');
        const toast = document.getElementById('toast');

        // --- Hàm Đóng/Mở Danh Sách (Toggle Group) ---
        function toggleGroup(groupId) {
            const group = document.getElementById(groupId);
            const toggleBtn = group.querySelector('.toggle-btn');
            
            if (group.classList.contains('active')) {
                group.classList.remove('active');
                toggleBtn.textContent = '+';
            } else {
                // Đóng tất cả nhóm khác nếu muốn dạng Accordion (tùy chọn)
                document.querySelectorAll('.group-item').forEach(g => {
                    g.classList.remove('active');
                    g.querySelector('.toggle-btn').textContent = '+';
                });

                group.classList.add('active');
                toggleBtn.textContent = '-';
            }
        }

        // --- Helper Functions ---
        function showToast(msg, type = 'info') {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function destroyPlayers() {
            if (shakaInstance) { shakaInstance.destroy(); shakaInstance = null; }
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            if (mpegtsInstance) { mpegtsInstance.destroy(); mpegtsInstance = null; }
            videoPlayer.removeAttribute('src');
            videoPlayer.load();
        }

        function base64ToHex(str) {
            try {
                const raw = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
                let result = '';
                for (let i = 0; i < raw.length; i++) {
                    const hex = raw.charCodeAt(i).toString(16);
                    result += (hex.length === 2 ? hex : '0' + hex);
                }
                return result.toLowerCase();
            } catch (e) {
                return str;
            }
        }

        function detectStreamType(url) {
            const cleanUrl = url.split('?')[0].toLowerCase();
            if (cleanUrl.endsWith('.mpd')) return 'mpd';
            if (cleanUrl.endsWith('.m3u8')) return 'hls';
            if (cleanUrl.endsWith('.ts') || url.includes(':2086/') || url.includes(':2087/')) return 'ts';
            if (cleanUrl.endsWith('.mp3') || cleanUrl.endsWith('.aac')) return 'audio';
            return 'unknown';
        }

        // --- Hàm Xử Lý Phát Kênh Kế Thừa Từ Cấu Trúc Trước ---
        async function playChannel(channelKey) {
            const channel = channels[channelKey];
            if (!channel) return;

            destroyPlayers();
            loadingOverlay.classList.remove('hidden');

            const resolvedUrl = channel.url;
            const isMPD = detectStreamType(resolvedUrl) === 'mpd';
            const isRawTS = detectStreamType(resolvedUrl) === 'ts';

            // --- Case 1: DASH / MPD (Shaka Player) ---
            if (isMPD) {
                shaka.polyfill.installAll();
                if (!shaka.Player.isBrowserSupported()) {
                    showToast('Trình duyệt không hỗ trợ Shaka Player', 'error');
                    loadingOverlay.classList.add('hidden');
                    return;
                }

                shakaInstance = new shaka.Player(videoPlayer);
                const clearKeys = {};

                if (channel.license_key) {
                    const keyString = channel.license_key;
                    if (keyString.includes(':')) {
                        const parts = keyString.split(':');
                        if (parts.length === 2) {
                            let hexKid = parts[0].trim();
                            let hexKey = parts[1].trim();
                            if (hexKid.length !== 32) hexKid = base64ToHex(hexKid);
                            if (hexKey.length !== 32) hexKey = base64ToHex(hexKey);
                            if (hexKid && hexKey) clearKeys[hexKid] = hexKey;
                        }
                    }
                }

                if (Object.keys(clearKeys).length > 0) {
                    shakaInstance.configure({ drm: { clearKeys: clearKeys } });
                }

                shakaInstance.addEventListener('error', (e) => console.error('Shaka Error:', e.detail));

                try {
                    await shakaInstance.load(resolvedUrl);
                    loadingOverlay.classList.add('hidden');
                    videoPlayer.play().catch(e => console.warn('Auto-play blocked:', e));
                } catch (e) {
                    console.error('Shaka load error:', e);
                    loadingOverlay.classList.add('hidden');
                    showToast('Lỗi phát luồng MPD/DASH', 'error');
                }

            // --- Case 2: MPEG-TS Raw Stream ---
            } else if (isRawTS && typeof mpegts !== 'undefined' && mpegts.isSupported()) {
                mpegtsInstance = mpegts.createPlayer({ type: 'mse', isLive: true, url: resolvedUrl });
                mpegtsInstance.attachMediaElement(videoPlayer);
                mpegtsInstance.load();
                mpegtsInstance.play().then(() => {
                    loadingOverlay.classList.add('hidden');
                }).catch(e => {
                    loadingOverlay.classList.add('hidden');
                    console.warn('MPEGTS error:', e);
                });

            // --- Case 3: HLS (.m3u8) using Hls.js ---
            } else if (typeof Hls !== 'undefined' && Hls.isSupported() && !isMPD) {
                hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
                hlsInstance.loadSource(resolvedUrl);
                hlsInstance.attachMedia(videoPlayer);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                    loadingOverlay.classList.add('hidden');
                    videoPlayer.play().catch(e => console.warn('Auto-play blocked:', e));
                });

                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hlsInstance.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hlsInstance.recoverMediaError();
                                break;
                            default:
                                hlsInstance.destroy();
                                loadingOverlay.classList.add('hidden');
                                showToast('Lỗi tải luồng HLS', 'error');
                                break;
                        }
                    }
                });

            // --- Case 4: Native Browser Fallback (Safari/iOS/Audio) ---
            } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl') || detectStreamType(resolvedUrl) !== 'unknown') {
                videoPlayer.src = resolvedUrl;
                videoPlayer.addEventListener('loadedmetadata', () => {
                    loadingOverlay.classList.add('hidden');
                    videoPlayer.play().catch(e => console.warn('Auto-play blocked:', e));
                }, { once: true });

                videoPlayer.addEventListener('error', () => {
                    loadingOverlay.classList.add('hidden');
                    showToast('Trình duyệt không hỗ trợ định dạng này', 'error');
                }, { once: true });
            } else {
                loadingOverlay.classList.add('hidden');
                showToast('Không hỗ trợ định dạng video!', 'error');
            }
        }
    </script>
</body>
</html>
