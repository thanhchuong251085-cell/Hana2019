<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao Diện Xem Kênh IPTV</title>

    <!-- Thư viện phát video -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #0c162c; color: #fff; display: flex; flex-direction: column; min-height: 100vh; }

        /* Khung Player phía trên */
        #player-container { 
            position: relative; width: 100%; aspect-ratio: 16/9; 
            background: #000; display: flex; justify-content: center; align-items: center; 
        }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* Danh sách kênh bên dưới */
        .content-area { padding: 15px; flex: 1; }

        /* Thanh tiêu đề Danh sách kênh + Nút LIVE */
        .list-header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px 0; border-bottom: 1px solid #1c2b4a; margin-bottom: 15px; 
        }
        .list-header h3 { font-size: 16px; font-weight: bold; letter-spacing: 0.5px; text-transform: uppercase; }
        
        /* Nút LIVE đóng vai trò kích hoạt mở Menu ẩn */
        .btn-live-toggle { 
            background: #ff3b30; color: #fff; font-weight: bold; font-size: 12px; 
            padding: 4px 10px; border-radius: 4px; border: none; cursor: pointer; 
            box-shadow: 0 0 8px rgba(255, 59, 48, 0.5); transition: 0.2s; 
        }
        .btn-live-toggle:active { transform: scale(0.95); }

        /* Container Menu Kênh (Ẩn mặc định) */
        #channel-menu { display: none; }
        #channel-menu.open { display: block; }

        /* Tiêu đề nhóm đài */
        .group-title { 
            color: #ff9500; font-size: 13px; font-weight: bold; 
            text-transform: uppercase; margin: 15px 0 8px 0; 
        }

        /* Danh sách nút kênh dạng thẻ */
        .channel-card { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #172a4d; border-radius: 8px; padding: 12px 15px; 
            margin-bottom: 8px; cursor: pointer; transition: background 0.2s; 
        }
        .channel-card:hover, .channel-card.active { background: #1f3b6e; border: 1px solid #007aff; }
        
        .channel-name { font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .tag-live-small { background: #ff3b30; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: bold; }

        /* Overlay Loading & Toast */
        #loading-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; font-size: 14px; }
        .hidden { display: none !important; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #ff3b30; color: white; padding: 8px 16px; border-radius: 20px; font-size: 13px; z-index: 100; }
    </style>
</head>
<body>

    <!-- Màn hình xem Video -->
    <div id="player-container">
        <div id="loading-overlay" class="hidden">Đang kết nối luồng phát...</div>
        <video id="videoPlayer" controls autoplay></video>
    </div>

    <!-- Khu vực danh sách kênh -->
    <div class="content-area">
        
        <!-- Thanh Ngang: DANH SÁCH KÊNH + Nút LIVE Mở Menu -->
        <div class="list-header">
            <h3>DANH SÁCH KÊNH</h3>
            <button class="btn-live-toggle" onclick="toggleMenu()">LIVE</button>
        </div>

        <!-- Menu Kênh (Mặc định Ẩn, bấm LIVE mới hiện) -->
        <div id="channel-menu">
            
            <!-- Nhóm THVL -->
            <div class="group-title">TRUYỀN HÌNH VĨNH LONG (THVL)</div>
            <div class="channel-card" onclick="playChannel('thvl1')">
                <span class="channel-name">📺 THVL 1 HD</span>
                <span class="tag-live-small">LIVE</span>
            </div>
            <div class="channel-card" onclick="playChannel('thvl2')">
                <span class="channel-name">📺 THVL 2 HD</span>
                <span class="tag-live-small">LIVE</span>
            </div>

            <!-- Nhóm VTV -->
            <div class="group-title">ĐÀI TRUYỀN HÌNH VIỆT NAM (VTV)</div>
            <div class="channel-card" onclick="playChannel('vtv1')">
                <span class="channel-name">📺 VTV1 HD</span>
                <span class="tag-live-small">LIVE</span>
            </div>
            <div class="channel-card" onclick="playChannel('vtv3')">
                <span class="channel-name">📺 VTV3 HD</span>
                <span class="tag-live-small">LIVE</span>
            </div>

            <!-- Nhóm HTV -->
            <div class="group-title">ĐÀI TRUYỀN HÌNH TP.HCM (HTV)</div>
            <div class="channel-card" onclick="playChannel('htv7')">
                <span class="channel-name">📺 HTV7 HD</span>
                <span class="tag-live-small">LIVE</span>
            </div>
            <div class="channel-card" onclick="playChannel('htv9')">
                <span class="channel-name">📺 HTV9 HD</span>
                <span class="tag-live-small">LIVE</span>
            </div>

        </div>

    </div>

    <div id="toast" class="toast hidden"></div>

    <script>
        // --- Cấu hình dữ liệu Kênh ---
        const channels = {
            'thvl1': { name: 'THVL 1 HD', url: 'https://live.thvli.vn/live/thvl1.m3u8' },
            'thvl2': { name: 'THVL 2 HD', url: 'https://live.thvli.vn/live/thvl2.m3u8' },
            'vtv1': { name: 'VTV1 HD', url: 'https://vtv1-manifest.vtvcab.vn/manifest.m3u8' },
            'vtv3': { name: 'VTV3 HD', url: 'https://vtv3-manifest.vtvcab.vn/manifest.m3u8' },
            'htv7': { name: 'HTV7 HD', url: 'https://live.httv.vn/htv7/index.m3u8' },
            'htv9': { name: 'HTV9 HD', url: 'https://live.httv.vn/htv9/index.m3u8' }
        };

        let shakaInstance = null;
        let hlsInstance = null;
        let mpegtsInstance = null;

        const videoPlayer = document.getElementById('videoPlayer');
        const loadingOverlay = document.getElementById('loading-overlay');

        // --- Hàm Bật/Tắt Menu khi bấm nút LIVE ngang chữ Danh Sách Kênh ---
        function toggleMenu() {
            const menu = document.getElementById('channel-menu');
            menu.classList.toggle('open');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function destroyPlayers() {
            if (shakaInstance) { shakaInstance.destroy(); shakaInstance = null; }
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            if (mpegtsInstance) { mpegtsInstance.destroy(); mpegtsInstance = null; }
            videoPlayer.removeAttribute('src');
            videoPlayer.load();
        }

        function detectStreamType(url) {
            const cleanUrl = url.split('?')[0].toLowerCase();
            if (cleanUrl.endsWith('.mpd')) return 'mpd';
            if (cleanUrl.endsWith('.m3u8')) return 'hls';
            if (cleanUrl.endsWith('.ts') || url.includes(':2086/') || url.includes(':2087/')) return 'ts';
            return 'unknown';
        }

        async function playChannel(channelKey) {
            const channel = channels[channelKey];
            if (!channel) return;

            destroyPlayers();
            loadingOverlay.classList.remove('hidden');

            const resolvedUrl = channel.url;
            const streamType = detectStreamType(resolvedUrl);

            // Xử lý HLS / M3U8
            if (typeof Hls !== 'undefined' && Hls.isSupported() && streamType === 'hls') {
                hlsInstance = new Hls({ enableWorker: true });
                hlsInstance.loadSource(resolvedUrl);
                hlsInstance.attachMedia(videoPlayer);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    loadingOverlay.classList.add('hidden');
                    videoPlayer.play().catch(e => console.warn(e));
                });

                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        loadingOverlay.classList.add('hidden');
                        showToast('Lỗi tải luồng kênh!');
                    }
                });

            // Native Player (Safari/iOS)
            } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                videoPlayer.src = resolvedUrl;
                videoPlayer.addEventListener('loadedmetadata', () => {
                    loadingOverlay.classList.add('hidden');
                    videoPlayer.play();
                }, { once: true });
            } else {
                loadingOverlay.classList.add('hidden');
                showToast('Không hỗ trợ định dạng video này');
            }
        }
    </script>
</body>
</html>
