<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base target="_top">
<title>Karaoke Player</title>
<link rel="manifest" href="./manifest_tv.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-JCB7VEJF1Y"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-JCB7VEJF1Y');
</script>
<style>
      /* === GIAO DIỆN GỐC === */
      #currentTitle {
        position: relative;
        width: 200px;
        height: 24px;
        overflow: hidden;
        white-space: nowrap;
      }

      #scrollingTitle {
        position: absolute;
        white-space: nowrap;
        display: inline-block;
        animation: scroll-left 12s linear infinite;
        color: #00ffcc;
        font-weight: bold;
      }

      @keyframes scroll-left {
        0% { left: 100%; }
        100% { left: -100%; }
      }

      body {
        background-color: #000;
        color: white;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #player {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
      }

      #uiContainer {
        position: absolute;
        top: 20px;
        right: 10px;
        background: rgba(0, 0, 0, 0.2);
        padding: 12px;
        border-radius: 12px;
        max-width: 270px;
        z-index: 2;
      }

      #controls {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }

      #currentTitle {
        max-width: 180px;
        overflow: hidden;
        white-space: nowrap;
      }

      #playlistDisplay {
        margin: 0;
        padding-left: 14px;
        font-size: 14px;
        font-weight: normal;
        color: rgba(255, 255, 255, 0.95);
        margin-bottom: 8px;
        list-style: disc;
      }
      
      #playlistDisplay li {
        white-space: nowrap; 
        overflow: hidden;    
        text-overflow: ellipsis; 
      }
      
      #nextSongs h4 {
        font-size: 14px;
        color: #00ffff;
        font-weight: bold;
        margin-bottom: 6px;
        margin-top: 0;
      }

      #playPauseBtn {
        background-color: #00cc99;
        color: white;
      }
      #playPauseBtn:hover {
        background-color: #00aa88;
      }
      #btnFolder {
        background-color:#333;
      }

      button {
        font-size: 16px;
        padding: 6px 10px;
        border: none;
        border-radius: 6px;
        background-color: #333;
        color: white;
        cursor: pointer;
      }

      button:hover {
        background-color: #555;
      }

      #toast {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #333;
        color: white;
        padding: 20px 24px;
        border-radius: 8px;
        font-size: 30px;
        opacity: 0;
        transition: opacity 0.5s ease;
        z-index: 9999;
        visibility: hidden;
      }

      #toast.show {
        visibility: visible;
        opacity: 1;
      }
      
      #roomCodeDisplay {
          font-size:18px;
          color:yellow;
          padding-left:1px;
          margin-bottom: 10px;
      }
      #roomCodeDisplay #code {
          font-weight: bold;
          font-size: 24px;
          color: #f1c40f;
      }
      .welcome-text {
        position: fixed;
        top:15px;
        left:15px;
        z-index:10;
        color:#ffdd00;
        font-size:1rem;
        font-weight:bold;
        text-shadow:1px 1px 3px rgba(0,0,0,0.7);
        animation: bounce 1.5s infinite;
      }
      @keyframes bounce {
        0%,20%,50%,80%,100% {transform:translateY(0);}
        40% {transform:translateY(-5px) rotate(1deg);}
        60% {transform:translateY(-2px) rotate(-1deg);}
      }
    </style>
  </head>
  <body>
    <div id="player"></div>

    <div class="welcome-text">Chào Mừng Bạn Đến Karaoke Hana ☕️😊</div>

    <div id="uiContainer">
       <div id="roomCodeDisplay">
          Mã kết nối: <span id="code">...</span>
          <button onclick="resetRoomCode()" style="margin-left: 10px;">🔄Đổi mã</button>
       </div>
      <div id="controls">
        <button id="btnFolder" onclick="openFileSelect()">📂</button>
        <button id="playPauseBtn" onclick="togglePlayPause()">⏯</button>
        <button onclick="removeCurrentSong()">⏭</button>
        <div id="currentTitle"><div id="scrollingTitle">Đang tải...</div></div>
      </div>

      <div id="nextSongs">
        <h4>🎶 Tiếp theo:</h4>
        <ul id="playlistDisplay"></ul>
      </div>
    </div>
    <div id="toast"></div>

    <input type="file" id="fileInput" accept="video/*,audio/*" multiple style="display:none">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyAIwBqg8EYLU7TQXfOO697C4D5p5_GeghQ",
        authDomain: "karaoke-home.firebaseapp.com",
        databaseURL: "https://karaoke-home-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "karaoke-home",
        storageBucket: "karaoke-home.firebasestorage.app",
        messagingSenderId: "285959719922",
        appId: "1:285959719922:web:6cb594ebb3ef854124796b",
        measurementId: "G-EH8DQLGWSY"
      };

      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      let player;
      let currentVideoId = null;
      let playlist = [];
      let localFileList = JSON.parse(localStorage.getItem("savedLocalSongs") || "[]");
      let isPlayerReady = false;
      let isPlaying = false;
      let roomCode = localStorage.getItem('roomCode');
      const codeDisplayEl = document.getElementById('code');
      const fileInput = document.getElementById('fileInput');

      if (!roomCode) {
        roomCode = Math.floor(10000 + Math.random() * 90000).toString();
        localStorage.setItem('roomCode', roomCode);
      }
      codeDisplayEl.innerText = roomCode;

      if (window.location.protocol === 'file:') {
          console.error("LỖI: Bạn đang mở file trực tiếp, YouTube không chạy được");
      }

      function openFileSelect(){
        fileInput.click();
      }

      // Hàm gửi danh sách lên Firebase
      async function pushLocalSongList() {
        const sendData = {};
        localFileList.forEach(item=>{
          sendData[item.localKey] = {
            localKey: item.localKey,
            title: item.title,
            type: "local"
          }
        });
        try {
          await db.ref(`rooms/${roomCode}/localSongs`).set(sendData);
          return true;
        } catch(err) {
          console.error("Lỗi gửi:", err);
          return false;
        }
      }

      // Khi chọn file nhạc xong → lưu + gửi ngay
      fileInput.onchange = async function(){
        const files = Array.from(fileInput.files);
        if(files.length === 0) return;
        files.forEach(f=>{
          const localKey = "local_"+Date.now()+"_"+Math.random().toString(36);
          localFileList.push({
            localKey: localKey,
            title: f.name.replace(/\.[^.]+$/,''),
            fileObj: f
          });
        });
        localStorage.setItem("savedLocalSongs", JSON.stringify(localFileList));
        const ok = await pushLocalSongList();
        if(ok) {
          showToast("✅ Đã gửi danh sách nhạc sang điện thoại");
        } else {
          showToast("❌ Không gửi được, kiểm tra mạng");
        }
      }

      function onYouTubeIframeAPIReady() {
        const WAITING_VIDEO_ID = "6BlfNIfGFfM"; 

        player = new YT.Player('player', {
          height: '100%', 
          width: '100%',
          videoId: WAITING_VIDEO_ID, 
          host: 'https://www.youtube.com',
          playerVars: { 
            'autoplay': 1, 
            'controls': 1,
            'rel': 0,
            'enablejsapi': 1,         
            'origin': window.location.origin 
          },
          events: {
            'onStateChange': onPlayerStateChange,
            'onReady': async (event) => {
                 console.log("Player đã sẵn sàng");
                 isPlayerReady = true;
                 event.target.playVideo(); 
                 isPlaying = true;
                 listenToData();
                 await pushLocalSongList();
            },
            'onError': onPlayerError 
          }
        });
      }

function listenToData() {
    db.ref(`rooms/${roomCode}/playlist`).orderByChild('timestamp').on('value', snapshot => {
      playlist = [];
      snapshot.forEach(child => {
        playlist.push({ key: child.key, ...child.val() });
      });
      updateUI();
      
      if (currentVideoId === null && playlist.length > 0) {
        checkAndPlay();
      }
    });

    db.ref(`rooms/${roomCode}/command`).on('value', snapshot => {
      const cmdData = snapshot.val();
      if (cmdData) {
        executeCommand(cmdData);
        db.ref(`rooms/${roomCode}/command`).remove();
      }
    });
  }
      function updateUI() {
        const listEl = document.getElementById('playlistDisplay');
        const titleEl = document.getElementById('scrollingTitle');
        listEl.innerHTML = "";
        
        if (playlist.length === 0) {
            titleEl.textContent = "🕒 Chờ bài hát...";
            return;
        }
        
        titleEl.textContent = "🎵 " + playlist[0].title;
        
        for (let i = 1; i < Math.min(playlist.length, 11); i++) {
          const li = document.createElement('li');
          li.innerText = `${i}. ${playlist[i].title}`;
          listEl.appendChild(li);
        }
      }

function checkAndPlay() {
    if (!isPlayerReady || playlist.length === 0) return;
    const topSong = playlist[0];
    if(topSong.type === "local"){
      showToast("⚠️ Chưa hỗ trợ phát file nhạc nội bộ");
      return;
    }
    currentVideoId = topSong.videoId;
    player.loadVideoById(currentVideoId);
  }

        function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.ENDED) {
            currentVideoId = null;
            if (playlist.length > 0) {
                removeCurrentSong();
            } else {
                player.playVideo();
            }
        } else if (event.data === YT.PlayerState.PLAYING) {
            isPlaying = true;
        } else if (event.data === YT.PlayerState.PAUSED) {
            isPlaying = false;
        }
      }

      function onPlayerError(event) {
        console.error("Lỗi YouTube:", event.data);
        setTimeout(() => {
            if(playlist.length > 0) removeCurrentSong();
        }, 2000);
      }

function removeCurrentSong() {
    if (playlist.length === 0) return;

    let nextSongToPlay = null;
    if (playlist.length > 1) {
      nextSongToPlay = playlist[1];
    }

    const currentKey = playlist[0].key;
    db.ref(`rooms/${roomCode}/playlist/${currentKey}`).remove().then(() => {
      
      if (nextSongToPlay) {
        currentVideoId = nextSongToPlay.videoId;
        player.loadVideoById(currentVideoId);
        showToast("⏭ Đang phát: " + nextSongToPlay.title);
      } else {
        currentVideoId = null;
        player.stopVideo();
        showToast("📭 Hết bài chờ");
      }
    });
  }

      function togglePlayPause() {
        if (!player || !isPlayerReady) return;
        const state = player.getPlayerState();
        if (state === YT.PlayerState.PLAYING) {
          player.pauseVideo();
          isPlaying = false;
        } else {
          player.playVideo();
          isPlaying = true;
        }
      }
      
      function resetRoomCode() {
        localStorage.removeItem('roomCode');
        location.reload();
      }

      function executeCommand(cmdData) {
  if (!player || !isPlayerReady) return;
  
  const type = (typeof cmdData === 'object') ? cmdData.type : cmdData;

  try {
    switch (type) {
      case 'PLAY_NOW': 
        if(cmdData.typeSource === "local"){
          showToast("⚠️ Chưa hỗ trợ phát file nhạc nội bộ");
          break;
        }
        currentVideoId = cmdData.videoId; 
        player.loadVideoById(cmdData.videoId);
        showToast("⚡ Phát ngay lập tức!");
        break;
        
      case 'PLAY': 
        player.playVideo(); 
        showToast("▶️ Tiếp tục");
        break;
        
      case 'PAUSE': 
        player.pauseVideo(); 
        showToast("⏸ Tạm dừng");
        break;
        
        case 'NEXT': 
        showToast("⏭ Đang chuyển bài...");
        removeCurrentSong(); 
        break;
        
      case 'VOL_UP': 
        player.setVolume(Math.min(player.getVolume() + 10, 100)); 
        showToast("🔊 Tăng âm lượng");
        break;
        
      case 'VOL_DOWN': 
        player.setVolume(Math.max(player.getVolume() - 10, 0)); 
        showToast("🔉 Giảm âm lượng");
        break;
case 'SET_HD':
  if (player && player.setPlaybackQuality) {
    player.setPlaybackQuality('medium');
    showToast("📺 Đã đặt chất lượng 720p");
  }
  break;
    }
  } catch (e) { 
    console.error("Lỗi lệnh:", e); 
  }
}

      function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'show';
        setTimeout(() => toast.className = '', 2000);
      }
    </script>
  
</body>
</html>
