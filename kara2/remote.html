<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Media Player (Stable & Direct)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#121212] text-zinc-100 min-h-screen flex font-sans select-none overflow-hidden">

    <!-- Sidebar chọn dịch vụ (Giống NewPipe trên TV) -->
    <div class="w-64 bg-zinc-900 border-r border-zinc-800 flex flex-col justify-between p-4 z-20">
        <div class="flex flex-col gap-6">
            <!-- Logo Header -->
            <div class="flex items-center gap-3 px-2 py-1">
                <div class="bg-orange-600 p-2 rounded-xl text-white shadow-lg shadow-orange-600/30" id="logoIcon">
                    <i data-lucide="cloud" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">TV Media Player</h1>
                    <p id="currentSourceLabel" class="text-xs text-orange-500 font-medium">SoundCloud</p>
                </div>
            </div>

            <!-- Nút chuyển nguồn -->
            <div class="flex flex-col gap-1.5">
                <div class="text-[11px] font-semibold text-zinc-500 uppercase tracking-wider px-2 mb-1">Nguồn phát</div>
                
                <button class="source-btn flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-white bg-orange-600/10 border border-orange-500/30 transition-all cursor-pointer" data-source="soundcloud">
                    <i data-lucide="cloud" class="w-5 h-5 text-orange-500"></i> SoundCloud
                </button>

                <button class="source-btn flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/60 transition-all cursor-pointer" data-source="youtube">
                    <i data-lucide="youtube" class="w-5 h-5 text-red-500"></i> YouTube
                </button>
            </div>
        </div>

        <div class="text-[11px] text-zinc-500 px-2 py-2 border-t border-zinc-800 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Hệ thống hoạt động ổn định
        </div>
    </div>

    <!-- Khu vực chính bên phải -->
    <div class="flex-1 flex flex-col h-screen overflow-y-auto p-8">
        
        <!-- Thanh tìm kiếm -->
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-zinc-800">
            <div class="flex items-center gap-4 w-full max-w-2xl bg-zinc-900 border border-zinc-700 focus-within:border-orange-500 rounded-xl px-4 py-2.5 transition-all shadow-lg" id="searchBarContainer">
                <i data-lucide="search" class="w-5 h-5 text-zinc-400"></i>
                <input type="text" id="searchInput" 
                    class="w-full bg-transparent text-zinc-100 placeholder-zinc-500 focus:outline-none text-base"
                    placeholder="Nhập tên bài hát, nghệ sĩ cần tìm (VD: Tình Đơn Phương, Lofi Chill)..." autofocus>
            </div>
            <button id="searchBtn" class="bg-orange-600 hover:bg-orange-500 text-white font-medium px-6 py-3 rounded-xl transition-all shadow-md cursor-pointer ml-4">
                Phát ngay
            </button>
        </div>

        <!-- Khung Player (Iframe nhúng chính hãng không lo lỗi máy chủ) -->
        <div class="w-full flex flex-col gap-6">
            <div class="w-full bg-black border border-zinc-800 rounded-2xl overflow-hidden aspect-video relative shadow-2xl">
                <iframe id="mediaPlayer" class="w-full h-full" src="" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
            </div>

            <!-- Gợi ý nhanh các từ khóa phổ biến để bấm nghe ngay lập tức -->
            <div class="flex flex-col gap-3">
                <div class="text-xs font-semibold text-zinc-400 uppercase tracking-wider px-1">Gợi ý nhanh</div>
                <div id="suggestionsContainer" class="flex flex-wrap gap-2"></div>
            </div>
        </div>

    </div>

    <!-- Script điều khiển an toàn, trực tiếp -->
    <script>
        lucide.createIcons();

        let currentSource = 'soundcloud'; // Mặc định SoundCloud
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const mediaPlayer = document.getElementById('mediaPlayer');
        const currentSourceLabel = document.getElementById('currentSourceLabel');
        const logoIcon = document.getElementById('logoIcon');
        const searchBarContainer = document.getElementById('searchBarContainer');
        const suggestionsContainer = document.getElementById('suggestionsContainer');

        const scSuggestions = ["Lofi Hip Hop Mix", "V-Pop Remix Club", "Acoustic Guitar Chill", "Tình Đơn Phương Cover", "Electronic Chill Beats"];
        const ytSuggestions = ["Tình Đơn Phương 2", "Top Hit Remix 2026", "Sơn Tùng M-TP Medley", "Nhạc Trẻ Lofi Nhẹ Nhàng", "Acoustic Nhạc Trẻ"];

        // Chuyển đổi nguồn SoundCloud / YouTube
        document.querySelectorAll('.source-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.source-btn').forEach(b => {
                    b.classList.remove('bg-orange-600/10', 'bg-red-600/10', 'border', 'border-orange-500/30', 'border-red-500/30', 'text-white');
                    b.classList.add('text-zinc-400');
                });
                
                currentSource = btn.getAttribute('data-source');
                
                if (currentSource === 'soundcloud') {
                    btn.classList.add('bg-orange-600/10', 'border', 'border-orange-500/30', 'text-white');
                    currentSourceLabel.textContent = 'SoundCloud';
                    currentSourceLabel.className = 'text-xs text-orange-500 font-medium';
                    logoIcon.className = 'bg-orange-600 p-2 rounded-xl text-white shadow-lg shadow-orange-600/30';
                    logoIcon.innerHTML = `<i data-lucide="cloud" class="w-6 h-6"></i>`;
                    searchBarContainer.className = "flex items-center gap-4 w-full max-w-2xl bg-zinc-900 border border-zinc-700 focus-within:border-orange-500 rounded-xl px-4 py-2.5 transition-all shadow-lg";
                    searchBtn.className = "bg-orange-600 hover:bg-orange-500 text-white font-medium px-6 py-3 rounded-xl transition-all shadow-md cursor-pointer ml-4";
                    renderSuggestions(scSuggestions);
                } else {
                    btn.classList.add('bg-red-600/10', 'border', 'border-red-500/30', 'text-white');
                    currentSourceLabel.textContent = 'YouTube';
                    currentSourceLabel.className = 'text-xs text-red-500 font-medium';
                    logoIcon.className = 'bg-red-600 p-2 rounded-xl text-white shadow-lg shadow-red-600/30';
                    logoIcon.innerHTML = `<i data-lucide="youtube" class="w-6 h-6"></i>`;
                    searchBarContainer.className = "flex items-center gap-4 w-full max-w-2xl bg-zinc-900 border border-zinc-700 focus-within:border-red-500 rounded-xl px-4 py-2.5 transition-all shadow-lg";
                    searchBtn.className = "bg-red-600 hover:bg-red-500 text-white font-medium px-6 py-3 rounded-xl transition-all shadow-md cursor-pointer ml-4";
                    renderSuggestions(ytSuggestions);
                }
                lucide.createIcons();
                loadMedia(searchInput.value.trim() || (currentSource === 'soundcloud' ? 'Lofi Chill' : 'Tình Đơn Phương'));
            });
        });

        function renderSuggestions(list) {
            suggestionsContainer.innerHTML = '';
            list.forEach(item => {
                const pill = document.createElement('button');
                pill.className = "px-3.5 py-1.5 bg-zinc-900 border border-zinc-800 hover:border-zinc-500 rounded-lg text-xs font-medium text-zinc-300 transition-all cursor-pointer";
                pill.textContent = item;
                pill.addEventListener('click', () => {
                    searchInput.value = item;
                    loadMedia(item);
                });
                suggestionsContainer.appendChild(pill);
            });
        }

        // Tải media trực tiếp qua widget nhúng chuẩn xác, tránh tuyệt đối lỗi máy chủ
        function loadMedia(query) {
            if (!query) return;
            const encodedQuery = encodeURIComponent(query);

            if (currentSource === 'soundcloud') {
                mediaPlayer.src = `https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/search/sounds%3Fq%3D${encodedQuery}&color=%23ff5500&auto_play=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false`;
            } else {
                mediaPlayer.src = `https://www.youtube.com/embed?listType=search&list=${encodedQuery}&autoplay=1`;
            }
        }

        searchBtn.addEventListener('click', () => loadMedia(searchInput.value.trim()));
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loadMedia(searchInput.value.trim());
        });

        // Khởi tạo mặc định lần đầu
        renderSuggestions(scSuggestions);
        loadMedia('Lofi Chill');
    </script>
</body>
</html>
