<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Video & Reel Player</title>
    <!-- Tải Facebook SDK chính thức -->
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/vi_VN/sdk.js#xfbml=1&version=v18.0"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #161b22;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #30363d;
            border-radius: 6px;
            background: #0d1117;
            color: #fff;
            font-size: 13px;
        }
        button {
            padding: 12px 18px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #2ea043; }
        #player-wrapper {
            width: 100%;
            min-height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h3 style="margin-top:0;">Trình Phát Facebook Video / Reel</h3>
    <div class="input-group">
        <input type="text" id="fb-url" value="https://www.facebook.com/reel/1750928849470456/" placeholder="Dán link Facebook / Reel vào đây...">
        <button onclick="loadFacebookMedia()">Phát Video</button>
    </div>

    <div id="player-wrapper">
        <p style="color: #8b949e;">Nhập link và bấm Phát Video</p>
    </div>
</div>

<script>
    function cleanFacebookUrl(url) {
        try {
            // Tách bỏ toàn bộ các tham số rác đằng sau dấu ?
            let cleanUrl = url.split('?')[0];
            
            // Xử lý loại bỏ dấu gạch chéo thừa ở cuối nếu có
            if (cleanUrl.endsWith('/')) {
                cleanUrl = cleanUrl.slice(0, -1);
            }
            return cleanUrl;
        } catch (e) {
            return url;
        }
    }

    function loadFacebookMedia() {
        let rawUrl = document.getElementById('fb-url').value.trim();
        const wrapper = document.getElementById('player-wrapper');

        if (!rawUrl) {
            alert('Vui lòng dán link Facebook!');
            return;
        }

        // 1. Làm sạch link (loại bỏ referral_source, utm_source...)
        const cleanUrl = cleanFacebookUrl(rawUrl);

        // 2. Mã hóa URL để nhúng an toàn vào iframe
        const encodedUrl = encodeURIComponent(cleanUrl);

        // 3. Nếu là link Reel hoặc Share, dùng Iframe chuẩn hóa height cho dạng video ngắn
        if (cleanUrl.includes('/reel/') || cleanUrl.includes('/share/')) {
            wrapper.innerHTML = `
                <iframe src="https://www.facebook.com/plugins/video.php?href=${encodedUrl}&show_text=false&width=350" 
                        scrolling="no" 
                        frameborder="0" 
                        allowfullscreen="true" 
                        allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share">
                </iframe>
            `;
            return;
        }

        // 4. Nếu là video dài thông thường (Watch), dùng Facebook SDK
        wrapper.innerHTML = `
            <div class="fb-video" 
                 data-href="${cleanUrl}" 
                 data-width="auto" 
                 data-show-text="false" 
                 data-autoplay="true"
                 data-allowfullscreen="true">
            </div>
        `;

        if (typeof FB !== 'undefined') {
            FB.XFBML.parse(wrapper);
        }
    }
</script>

</body>
</html>
