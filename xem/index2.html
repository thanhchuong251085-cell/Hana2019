<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Local Media Player (No Lag)</title>
    <style>
        /* Ép trình duyệt đưa layer này vào GPU để giảm tải cho CPU */
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .player-container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
            text-align: center;
            transform: translateZ(0); /* Kích hoạt tăng tốc phần cứng GPU */
            will-change: transform;
        }
        input[type="file"] {
            margin-bottom: 15px;
            color: #ccc;
        }
        video, audio {
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            outline: none;
        }
        .file-info {
            font-size: 14px;
            color: #4CAF50;
            margin-top: 10px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h3>Trình Phát Media Offline</h3>
        <!-- Ô chọn file từ bộ nhớ trong -->
        <input type="file" id="mediaInput" accept="audio/*,video/*">
        
        <div class="file-info" id="fileInfo">Chưa chọn file nào</div>

        <!-- Thẻ phát media với cơ chế tối ưu buffer -->
        <div id="playerWrapper">
            <video id="mediaPlayer" controls preload="auto"></video>
        </div>
    </div>

    <script>
        const mediaInput = document.getElementById('mediaInput');
        const mediaPlayer = document.getElementById('mediaPlayer');
        const fileInfo = document.getElementById('fileInfo');

        let currentBlobUrl = null;

        mediaInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 1. DỌN DẸP BỘ NHỚ CŨ (Tránh rò rỉ RAM gây giật lag ngầm)
            if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
                currentBlobUrl = null;
            }

            mediaPlayer.pause();
            mediaPlayer.src = '';

            // Hiển thị tên file đang phát
            fileInfo.textContent = `Đang phát: ${file.name} (${(file.size / (1024*1024)).toFixed(2)} MB)`;

            // 2. TẠO BLOB URL MỚI CHO FILE CỤC BỘ
            // Giúp trình duyệt quản lý bộ nhớ đệm mượt mà như stream chuyên nghiệp
            currentBlobUrl = URL.createObjectURL(file);
            
            mediaPlayer.src = currentBlobUrl;
            
            // 3. KÍCH HOẠT PHÁT AN TOÀN
            mediaPlayer.load();
            mediaPlayer.play().catch(error => {
                console.log("Trình duyệt chặn tự động phát, cần tương tác người dùng:", error);
            });
        });

        // Xử lý dọn dẹp khi người dùng rời trang hoặc đóng app
        window.addEventListener('beforeunload', () => {
            if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
            }
        });
    </script>

</body>
</html>
