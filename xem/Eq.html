<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>Test Trình phát + Equalizer 15 băng</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}
body{background:#1a1a2e;color:#fff;padding:12px;}
.box{margin:10px 0;padding:10px;background:#272942;border-radius:8px;}
input[type="range"]{width:100%;margin:4px 0;}
.eq‑item{margin:6px 0;}
button{padding:8px 12px;margin:4px;border:none;border-radius:6px;background:#4285f4;color:#fff;font-size:15px;}
</style>
</head>
<body>
  <h3>🎵 Test Trình phát (Offline + Khung YouTube)</h3>
  <div class="box">
    <p>🔊 Chọn file nhạc offline (MP3/WAV):</p>
    <input type="file" id="fileAudio" accept="audio/*">
    <audio id="playerOffline" controls>
  </div>

  <div class="box">
    <p>📺 Khung YouTube (chỉ xem video, âm thanh không qua equalizer):</p>
    <input type="text" id="linkYt" placeholder="Dán link YouTube vào đây">
    <button onclick="loadYoutube()">Tải video</button>
    <div id="frameYt" style="margin‑top:8px;"></div>
  </div>

  <div class="box">
    <h4>🎛️ Equalizer 15 băng</h4>
    <button id="btnEq">Bật Equalizer</button>
    <div id="eqPanel"></div>
  </div>

<script>
const freqBands = [20,31,50,80,125,200,315,500,800,1250,2000,3150,5000,8000,12500];
let audioContext, sourceNode;
let eqFilters = [];
let bypassGain, eqOutGain;
let eqOn = false;
let audioEl = document.getElementById('playerOffline');

// Kết nối equalizer với file nhạc offline
document.getElementById('fileAudio').addEventListener('change',function(e){
  const file = e.target.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);
  audioEl.src = url;
  if(!audioContext){
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    sourceNode = audioContext.createMediaElementSource(audioEl);
    bypassGain = audioContext.createGain();
    eqOutGain = audioContext.createGain();
    // Tạo chuỗi bộ lọc 15 băng
    let prev = audioContext.createGain();
    freqBands.forEach((freq,i)=>{
      const f = audioContext.createBiquadFilter();
      f.type = 'peaking';
      f.frequency.value = freq;
      f.Q.value = 1.4;
      f.gain.value = 0;
      eqFilters[i] = f;
      prev.connect(f);
      prev = f;
    });
    prev.connect(eqOutGain);
    sourceNode.connect(bypassGain);
    sourceNode.connect(prev);
    bypassGain.connect(audioContext.destination);
    eqOutGain.connect(audioContext.destination);
    bypassGain.gain.value = 1;
    eqOutGain.gain.value = 0;
  }
});

// Bật‑tắt equalizer
document.getElementById('btnEq').addEventListener('click',()=>{
  if(!audioContext) return;
  eqOn = !eqOn;
  if(eqOn){
    bypassGain.gain.value = 0;
    eqOutGain.gain.value = 1;
    document.getElementById('btnEq').textContent = 'Tắt Equalizer';
  }else{
    bypassGain.gain.value = 1;
    eqOutGain.gain.value = 0;
    document.getElementById('btnEq').textContent = 'Bật Equalizer';
  }
});

// Điều chỉnh từng băng tần
function setGain(idx,val){
  if(eqFilters[idx]) eqFilters[idx].gain.value = Number(val);
}

// Tạo thanh trượt equalizer
const panel = document.getElementById('eqPanel');
freqBands.forEach((f,i)=>{
  panel.innerHTML += `
  <div class="eq‑item">
    <label>${f} Hz</label>
    <input type="range" min="-12" max="12" value="0" oninput="setGain(${i},this.value)">
  </div>`;
});

// Tải khung YouTube (chỉ hiển thị video, âm thanh không qua equalizer)
function loadYoutube(){
  let link = document.getElementById('linkYt').value.trim();
  let vidId = '';
  if(link.includes('v=')) vidId = link.split('v=')[1].split('&')[0];
  else if(link.includes('youtu.be/')) vidId = link.split('youtu.be/')[1].split('?')[0];
  if(!vidId) return;
  document.getElementById('frameYt').innerHTML = `<iframe width="100%" height="200" src="https://www.youtube.com/embed/${vidId}" frameborder="0" allowfullscreen></iframe>`;
}
</script>
</body>
</html>
