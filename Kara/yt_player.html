<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1, user‑scalable=no">
<title>Kara Hana Player</title>
<style>
body{margin:0;background:#000}
#player{width:100vw;height:100vh}
</style>
</head>
<body>
<div id="player"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase‑app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase‑database.js"></script>

<script>
// === GIỮ NGUYÊN TOÀN BỘ CẤU HÌNH FIREBASE CŨ CỦA BẠN Ở ĐÂY ===
firebase.initializeApp({
  // Giữ nguyên các dòng cũ bạn đã có, đừng xóa hay thay đổi
});
const db = firebase.database();

const WAIT_VIDEO_ID = "6BlfNIfGFfM"; // video xe hơi chờ
let player = null;
let apiReady = false;
let currentRoomId = "";
let currentSongId = "";

function initPlayer() {
  if (!apiReady || player) return;
  player = new YT.Player("player", {
    width:"100%", height:"100%",
    videoId: WAIT_VIDEO_ID,
    playerVars: {autoplay:1, playsinline:1, controls:1, rel:0, enablejsapi:1},
    events: {
      "onReady": e=>{e.target.playVideo();},
      "onStateChange": onPlayerStateChange
    }
  });
}

function onYouTubeIframeAPIReady() {
  apiReady = true;
  initPlayer(); // Tự chạy xe hơi ngay lúc mở trang
}

function onPlayerStateChange(e) {
  // Khi bài hát kết thúc → tự quay lại video xe hơi
  if (e.data === YT.PlayerState.ENDED) {
    if(player) player.loadVideoById(WAIT_VIDEO_ID);
  }
}

window.setRoomId = function(rid) {
  currentRoomId = rid;
  db.ref("rooms/"+currentRoomId+"/currentSong").on("value", snap=>{
    currentSongId = snap.val() || "";
    if (player) {
      if (!currentSongId) {
        player.loadVideoById(WAIT_VIDEO_ID);
      } else {
        player.loadVideoById(currentSongId);
      }
    }
  });
};

// Sửa nút Play Now: kiểm tra bài đã nhận được sẵn → nhấn 1 lần là chạy
window.onPlayNow = function() {
  if (!player) return;
  if (currentSongId && currentSongId !== "") {
    player.loadVideoById(currentSongId);
  } else {
    player.loadVideoById(WAIT_VIDEO_ID);
  }
};

setTimeout(()=>{ if(!apiReady) initPlayer(); }, 3000);
</script>
</body>
</html>
