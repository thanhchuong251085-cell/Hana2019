<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_top">
  <title>Karaoke YouTube Player</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    * {
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      transform: translateZ(0);
    }
  </style>
</head>
<body>

  <div id="player"></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAIwBqg8EYLU7TQXfOO697C4D5p5_GeghQ",
      authDomain: "karaoke-home.firebaseapp.com",
      databaseURL: "https://karaoke-home-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "karaoke-home",
      storageBucket: "karaoke-home.firebasestorage.app",
      messagingSenderId: "285959719922",
      appId: "1:285959719922:web:6cb594ebb3ef854124796b"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let player;
    let currentPlayingKey = null; 
    let playlist = [];
    let isPlayerReady = false;
    let roomCode = null; // Nhận trực tiếp từ Android Studio truyền xuống
    let qualityTimer = null;
    let playlistRef = null;
    let commandRef = null;

    function onYouTubeIframeAPIReady() {
      const WAITING_VIDEO_ID = "6BlfNIfGFfM"; // Xe hơi chạy mặc định khi khởi động

      player = new YT.Player('player', {
        height: '100%', 
        width: '100%',
        videoId: WAITING_VIDEO_ID, 
        host: 'https://www.youtube.com',
        playerVars: { 
          'autoplay': 1, 
          'controls': 1,
          'modestbranding': 1,
          'rel': 0,                 
          'enablejsapi': 1,         
          'origin': window.location.origin,
          'iv_load_policy': 3,
          'playsinline': 1,
          'vq': 'hd1080'
        },
        events: {
          'onStateChange': onPlayerStateChange,
          'onReady': (event) => {
               isPlayerReady = true;
               event.target.playVideo(); 
          },
          'onError': onPlayerError 
        }
      });
    }

    // 🚀 HÀM NHẬN MÃ PHÒNG TỪ ANDROID STUDIO (App khởi động hoặc bấm Đổi mã sẽ gọi hàm này)
    function setRoomCode(code) {
      if (!code || roomCode === code) return;
      roomCode = code;
      console.log("Đã nhận và đồng bộ mã phòng từ Android Studio: " + roomCode);

      // Gỡ bỏ lắng nghe cũ để tránh xung đột
      if (playlistRef) playlistRef.off();
      if (commandRef) commandRef.off();

      // Kết nối Firebase theo mã phòng chuẩn của Android
      playlistRef = db.ref(`rooms/${roomCode}/playlist`);
      commandRef = db.ref(`rooms/${roomCode}/command`);

      listenToData();
    }

    function listenToData() {
      // Chỉ lắng nghe danh sách bài hát YouTube online
      playlistRef.orderByChild('timestamp').on('value', snapshot => {
        playlist = [];
        snapshot.forEach(child => {
          let item = child.val();
          // Lọc bỏ nếu lỡ có bài offline lọt vào, HTML chỉ thuần túy chơi YouTube
          if (!item.type || item.type !== 'local') {
            playlist.push({ key: child.key, ...item });
          }
        });
        
        if (playlist.length === 0) {
          stopAllPlayers();
          currentPlayingKey = null;
        } else {
          const newFirstKey = playlist[0].key;
          if (newFirstKey !== currentPlayingKey) {
            checkAndPlayTopSong();
          }
        }
      });

      // Lắng nghe lệnh điều khiển từ Remote (Play, Pause, Next, Vol...)
      commandRef.on('value', snapshot => {
        const cmdData = snapshot.val();
        if (cmdData) {
          executeCommand(cmdData);
          commandRef.remove();
        }
      });
    }

    function checkAndPlayTopSong() {
      if (!isPlayerReady || playlist.length === 0) return;
      
      const topSong = playlist[0];
      currentPlayingKey = topSong.key;

      if (topSong.videoId && player && player.loadVideoById) {
        if (qualityTimer) clearTimeout(qualityTimer);
        player.loadVideoById(topSong.videoId);

        qualityTimer = setTimeout(() => {
          if (player && player.setPlaybackQuality) {
            player.setPlaybackQuality('hd1080');
          }
        }, 4000);
      }
    }

    function stopAllPlayers() {
      if (qualityTimer) clearTimeout(qualityTimer);
      if (player && player.loadVideoById) {
        player.loadVideoById('6BlfNIfGFfM'); // Hết bài -> Tự động quay về xe hơi
      }
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
          if (playlist.length > 0) {
              removeCurrentSong();
          } else {
              player.playVideo();
          }
      }
    }

    function onPlayerError(event) {
      setTimeout(() => {
          if(playlist.length > 0) removeCurrentSong();
      }, 2000);
    }

    function removeCurrentSong() {
      if (playlist.length === 0 || !roomCode) return;
      const currentKey = playlist[0].key;
      db.ref(`rooms/${roomCode}/playlist/${currentKey}`).remove();
    }

    function togglePlayPause() {
      if (!player || !isPlayerReady) return;
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function executeCommand(cmdData) {
      const type = (typeof cmdData === 'object') ? cmdData.type : cmdData;

      try {
        switch (type) {
          case 'PLAY_NOW': 
            // Nếu lệnh phát ngay một bài YouTube từ remote
            if (cmdData.videoId) {
              if (qualityTimer) clearTimeout(qualityTimer);
              player.loadVideoById(cmdData.videoId);

              qualityTimer = setTimeout(() => {
                if (player && player.setPlaybackQuality) {
                  player.setPlaybackQuality('hd1080');
                }
              }, 4000);
            }
            break;
            
          case 'PLAY': 
          case 'PAUSE': 
            togglePlayPause();
            break;
            
          case 'NEXT': 
            if (playlist.length > 0) {
              removeCurrentSong();
            } else {
              stopAllPlayers();
            }
            break;

          case 'SET_HD': 
            if (player && player.setPlaybackQuality) {
              player.setPlaybackQuality('hd1080');
            }
            break;
            
          case 'VOL_UP': 
            if (player && player.getVolume) {
              player.setVolume(Math.min(player.getVolume() + 10, 100));
            }
            break;
            
          case 'VOL_DOWN': 
            if (player && player.getVolume) {
              player.setVolume(Math.max(player.getVolume() - 10, 0));
            }
            break;
        }
      } catch (e) { 
        console.error("Lỗi thực thi lệnh:", e); 
      }
    }
  </script>
</body>
</html>
