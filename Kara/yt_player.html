<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YouTube Player</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #player {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="player"></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAIwBqg8EYLU7TQXfOO697C4D5p5_GeghQ",
      authDomain: "karaoke-home.firebaseapp.com",
      databaseURL: "https://karaoke-home-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "karaoke-home",
      storageBucket: "karaoke-home.firebasestorage.app",
      messagingSenderId: "285959719922",
      appId: "1:285959719922:web:6cb594ebb3ef854124796b"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let player;
    let currentRoomCode = null;
    let playlistRef = null;
    let commandRef = null;
    let currentPlayingKey = null;
    const WAITING_VIDEO_ID = "6BlfNIfGFfM"; // 🚗 Xe hơi huyền thoại

    // 1️⃣ KHỞI TẠO PLAYER
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: WAITING_VIDEO_ID,
        playerVars: {
          'autoplay': 1,
          'controls': 1,
          'rel': 0,
          'enablejsapi': 1,
          'playsinline': 1
        },
        events: {
          'onReady': (event) => {
            event.target.playVideo();
          },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // 2️⃣ MÃ PHÒNG 2 CHIỀU: Nhận mã từ Android Studio
    function setRoomCode(code) {
      if (!code || currentRoomCode === code) return;
      currentRoomCode = code;

      if (playlistRef) playlistRef.off();
      if (commandRef) commandRef.off();

      playlistRef = db.ref(`rooms/${currentRoomCode}/playlist`);
      commandRef = db.ref(`rooms/${currentRoomCode}/command`);

      listenToPlaylist();
      listenToCommands();
    }

    // Hàm phụ trợ để dừng hẳn tiếng và hình YouTube khi chuyển sang nguồn khác
    function stopYouTubeAudio() {
      if (player && typeof player.stopVideo === 'function') {
        try {
          player.stopVideo();
          player.clearVideo();
        } catch (e) {
          console.log("Lỗi dừng player:", e);
        }
      }
      currentPlayingKey = null;
    }

    // 3️⃣ LẮNG NGHE PLAYLIST & XỬ LÝ XUNG ĐỘT LUỒNG ÂM THANH
    function listenToPlaylist() {
      playlistRef.orderByChild('timestamp').on('value', snapshot => {
        let playlist = [];
        let hasLocalOrSpotify = false;

        snapshot.forEach(child => {
          let item = child.val();
          // Kiểm tra nếu bài đầu tiên là local hoặc spotify/nguồn khác
          if (child.key === snapshot.ref.key || playlist.length === 0) {
            if (item.type === 'local' || item.localKey || item.type === 'spotify' || item.source === 'spotify') {
              hasLocalOrSpotify = true;
            }
          }
          if (item.type !== 'local' && !item.localKey) {
            playlist.push({ key: child.key, ...item });
          }
        });

        // 🛡️ KHẮC PHỤC TRIỆT ĐỂ: Nếu bài đầu tiên là Local / Spotify -> Ép dừng YouTube ngay lập tức để tránh chồng tiếng
        if (hasLocalOrSpotify) {
          stopYouTubeAudio();
          return;
        }

        if (playlist.length === 0) {
          currentPlayingKey = null;
          if (player && player.loadVideoById) {
            player.loadVideoById(WAITING_VIDEO_ID);
            player.playVideo();
          }
        } else {
          let topSong = playlist[0];
          if (topSong.key !== currentPlayingKey) {
            currentPlayingKey = topSong.key;
            if (topSong.videoId && player && player.loadVideoById) {
              player.loadVideoById(topSong.videoId);
              player.playVideo();
            }
          }
        }
      });
    }

    // 4️⃣ LẮNG NGHE LỆNH REMOTE
    function listenToCommands() {
      commandRef.on('value', snapshot => {
        let cmd = snapshot.val();
        if (!cmd) return;
        commandRef.remove(); // Xử lý xong xóa luôn lệnh

        try {
          switch (cmd.type) {
            case 'PLAY_NOW':
              if (cmd.videoId && player && player.loadVideoById) {
                player.loadVideoById(cmd.videoId);
                player.playVideo();
              }
              break;
            case 'PLAY':
              if (player && player.playVideo) player.playVideo();
              break;
            case 'PAUSE':
              if (player && player.pauseVideo) player.pauseVideo();
              break;
            case 'STOP':
            case 'STOP_YOUTUBE':
              stopYouTubeAudio();
              break;
            case 'NEXT':
              if (playlistRef) {
                playlistRef.orderByChild('timestamp').limitToFirst(1).once('value', snap => {
                  snap.forEach(child => {
                    child.ref.remove();
                  });
                });
              }
              break;
          }
        } catch (e) {
          console.log("Lỗi lệnh:", e);
        }
      });
    }

    // 5️⃣ XỬ LÝ KHI HẾT BÀI
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        if (playlistRef) {
          playlistRef.orderByChild('timestamp').limitToFirst(1).once('value', snap => {
            snap.forEach(child => {
              child.ref.remove();
            });
          });
        }
      }
    }
  </script>
</body>
</html>
