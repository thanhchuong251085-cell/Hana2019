<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_top">
  <title>Karaoke Player Engine</title>
  <style>
    body, html {
      background-color: #000;
      color: white;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #player, #localPlayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      transform: translateZ(0);
    }

    #localPlayer {
      object-fit: contain;
      background: #000;
      display: none;
      cursor: default !important;
    }
  </style>
</head>
<body>

  <div id="player"></div>
  <video id="localPlayer" controls preload="auto" playsinline autobuffer></video>

  <!-- Thư viện Firebase & YouTube API chuẩn -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAIwBqg8EYLU7TQXfOO697C4D5p5_GeghQ",
      authDomain: "karaoke-home.firebaseapp.com",
      databaseURL: "https://karaoke-home-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "karaoke-home",
      storageBucket: "karaoke-home.firebasestorage.app",
      messagingSenderId: "285959719922",
      appId: "1:285959719922:web:6cb594ebb3ef854124796b",
      measurementId: "G-EH8DQLGWSY"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let player;
    let currentPlayingKey = null; 
    let playlist = [];
    let isPlayerReady = false;
    let roomCode = localStorage.getItem('roomCode');

    let offlinePlaylist = [];
    let localFileStore = {}; 
    let isOfflineMode = false;
    let qualityTimer = null;
    
    // 🛡️ KHIÊN CHẮN BẢO VỆ XE HƠI LÚC KHỞI ĐỘNG (GIÚP KHÔNG BỊ MÀN HÌNH ĐEN)
    let isCarRunningFirstTime = true; 
    const WAITING_VIDEO_ID = "6BlfNIfGFfM"; // 🚗 Xe hơi huyền thoại

    if (!roomCode) {
      roomCode = Math.floor(10000 + Math.random() * 90000).toString();
      localStorage.setItem('roomCode', roomCode);
    }

    db.ref(`rooms/${roomCode}/localSongs`).onDisconnect().remove();

    // 1️⃣ KHỞI TẠO PLAYER: Nạp sẵn xe hơi chạy phà phà ngay giây đầu tiên
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%', 
        width: '100%',
        videoId: WAITING_VIDEO_ID, 
        host: 'https://www.youtube.com',
        playerVars: { 
          'autoplay': 1, 
          'controls': 1,
          'modestbranding': 1,
          'rel': 0,                 
          'enablejsapi': 1,         
          'origin': window.location.origin,
          'iv_load_policy': 3,
          'playsinline': 1,
          'vq': 'hd1080'
        },
        events: {
          'onStateChange': onPlayerStateChange,
          'onReady': (event) => {
               isPlayerReady = true;
               event.target.playVideo(); 
               listenToData(); 
               listenToLocalSongs(); 
          },
          'onError': onPlayerError 
        }
      });
    }

    // 2️⃣ MÃ PHÒNG 2 CHIỀU: Nhận mã kết nối từ Android Studio truyền xuống
    function setRoomCode(code) {
      if (!code || roomCode === code) return;
      roomCode = code;
      localStorage.setItem('roomCode', roomCode);
      
      if (isPlayerReady) {
        listenToData();
        listenToLocalSongs();
      }
    }

    function listenToData() {
      db.ref(`rooms/${roomCode}/playlist`).orderByChild('timestamp').on('value', snapshot => {
        playlist = [];
        snapshot.forEach(child => {
          playlist.push({ key: child.key, ...child.val() });
        });
        
        // 🛡️ BẢO VỆ XE HƠI: Lần quét đầu tiên lúc vừa mở app, cấm Firebase phá xe hơi
        if (isCarRunningFirstTime) {
          isCarRunningFirstTime = false;
          if (playlist.length === 0) {
            return; // Giữ nguyên xe hơi chạy phà phà
          }
        }
        
        if (playlist.length === 0) {
          stopAllPlayers();
          currentPlayingKey = null;
        } else {
          const newFirstKey = playlist[0].key;
          if (newFirstKey !== currentPlayingKey) {
            checkAndPlayTopSong();
          }
        }
      });

      db.ref(`rooms/${roomCode}/command`).on('value', snapshot => {
        const cmdData = snapshot.val();
        if (cmdData) {
          executeCommand(cmdData);
          db.ref(`rooms/${roomCode}/command`).remove();
        }
      });
    }

    function listenToLocalSongs() {
      db.ref(`rooms/${roomCode}/localSongs`).on('value', snapshot => {
        offlinePlaylist = [];
        const songsData = snapshot.val();
        if (songsData) {
          Object.keys(songsData).forEach(key => {
            offlinePlaylist.push(songsData[key]);
          });
        }
      });
    }

    function checkAndPlayTopSong() {
      if (!isPlayerReady || playlist.length === 0) return;
      
      const topSong = playlist[0];
      currentPlayingKey = topSong.key;

      if (topSong.type === 'local') {
        let targetIndex = offlinePlaylist.findIndex(s => s.localKey === topSong.localKey);
        if (targetIndex !== -1) {
          playOfflineSong(targetIndex, false);
        } else {
          removeCurrentSong();
        }
      } else {
        isOfflineMode = false;
        const localVid = document.getElementById('localPlayer');
        
        if (localVid.src && localVid.src.startsWith('blob:')) {
          URL.revokeObjectURL(localVid.src);
        }
        localVid.pause();
        localVid.removeAttribute('src');
        localVid.style.display = 'none';
        
        document.getElementById('player').style.display = 'block';

        if (topSong.videoId && player && player.loadVideoById) {
          if (qualityTimer) clearTimeout(qualityTimer);
          player.loadVideoById(topSong.videoId);

          qualityTimer = setTimeout(() => {
            if (player && player.setPlaybackQuality && !isOfflineMode) {
              player.setPlaybackQuality('hd1080');
            }
          }, 4000);
        }
      }
    }

    function stopAllPlayers() {
      isOfflineMode = false;
      if (qualityTimer) clearTimeout(qualityTimer);
      const localVid = document.getElementById('localPlayer');
      
      if (localVid.src && localVid.src.startsWith('blob:')) {
        URL.revokeObjectURL(localVid.src);
      }
      localVid.pause();
      localVid.removeAttribute('src');
      localVid.style.display = 'none';
      
      document.getElementById('player').style.display = 'block';
      if (player && player.loadVideoById) {
        player.loadVideoById(WAITING_VIDEO_ID);
        player.playVideo();
      }
    }

    function onPlayerStateChange(event) {
      if (isOfflineMode) return;
      if (event.data === YT.PlayerState.ENDED) {
          if (playlist.length > 0) {
              removeCurrentSong();
          } else {
              player.loadVideoById(WAITING_VIDEO_ID);
              player.playVideo();
          }
      }
    }

    function onPlayerError(event) {
      if (isOfflineMode) return;
      setTimeout(() => {
          if(playlist.length > 0) removeCurrentSong();
      }, 2000);
    }

    function removeCurrentSong() {
      if (playlist.length === 0) return;
      const currentKey = playlist[0].key;
      db.ref(`rooms/${roomCode}/playlist/${currentKey}`).remove();
    }

    function playOfflineSong(index, directClick = true) {
      if (index < 0 || index >= offlinePlaylist.length) return;
      isOfflineMode = true;
      if (qualityTimer) clearTimeout(qualityTimer);

      if (player && player.pauseVideo) player.pauseVideo();

      document.getElementById('player').style.display = 'none';
      const localVid = document.getElementById('localPlayer');
      localVid.style.display = 'block';

      const song = offlinePlaylist[index];

      if (localVid.src && localVid.src.startsWith('blob:')) {
        URL.revokeObjectURL(localVid.src);
      }

      let playUrl = song.url;
      if (localFileStore[song.localKey]) {
        playUrl = URL.createObjectURL(localFileStore[song.localKey]);
      }

      localVid.src = playUrl;
      localVid.load();
      localVid.play().catch(e => { localVid.play(); });

      localVid.onended = () => {
        if (localVid.src && localVid.src.startsWith('blob:')) {
          URL.revokeObjectURL(localVid.src);
        }

        if (playlist.length > 0) {
          removeCurrentSong();
        } else {
          isOfflineMode = false;
          localVid.style.display = 'none';
          document.getElementById('player').style.display = 'block';
        }
      };
    }

    const localVid = document.getElementById('localPlayer');

    function togglePlayPause() {
      if (isOfflineMode) {
        if (localVid.paused) { localVid.play(); } else { localVid.pause(); }
        return;
      }

      if (!player || !isPlayerReady) return;
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }
    
    function resetRoomCode() {
      db.ref(`rooms/${roomCode}/localSongs`).remove();
      localStorage.removeItem('roomCode');
      location.reload();
    }

    function executeCommand(cmdData) {
      const type = (typeof cmdData === 'object') ? cmdData.type : cmdData;

      try {
        switch (type) {
          case 'PLAY_NOW': 
            if (cmdData.typeSource === 'local') {
              let targetIndex = offlinePlaylist.findIndex(s => s.localKey === cmdData.localKey);
              if (targetIndex !== -1) {
                if (player && player.pauseVideo) player.pauseVideo();
                playOfflineSong(targetIndex, true);
              }
            } else {
              isOfflineMode = false;
              
              if (localVid.src && localVid.src.startsWith('blob:')) {
                URL.revokeObjectURL(localVid.src);
              }
              localVid.pause();
              localVid.removeAttribute('src');
              localVid.style.display = 'none';
              document.getElementById('player').style.display = 'block';

              if (qualityTimer) clearTimeout(qualityTimer);
              player.loadVideoById(cmdData.videoId);

              qualityTimer = setTimeout(() => {
                if (player && player.setPlaybackQuality && !isOfflineMode) {
                  player.setPlaybackQuality('hd1080');
                }
              }, 4000);
            }
            break;
            
          case 'PLAY': 
          case 'PAUSE': 
            togglePlayPause();
            break;
            
          case 'NEXT': 
            if (playlist.length > 0) {
              removeCurrentSong();
            } else {
              stopAllPlayers();
            }
            break;

          case 'SET_HD': 
            if (!isOfflineMode && player && player.setPlaybackQuality) {
              player.setPlaybackQuality('hd1080');
            }
            break;
            
          case 'VOL_UP': 
            if (isOfflineMode) {
              localVid.volume = Math.min(localVid.volume + 0.1, 1);
            } else if (player && player.getVolume) {
              player.setVolume(Math.min(player.getVolume() + 10, 100));
            }
            break;
            
          case 'VOL_DOWN': 
            if (isOfflineMode) {
              localVid.volume = Math.max(localVid.volume - 0.1, 0);
            } else if (player && player.getVolume) {
              player.setVolume(Math.max(player.getVolume() - 10, 0));
            }
            break;
        }
      } catch (e) { 
        console.error("Lỗi thực thi lệnh:", e); 
      }
    }
  </script>
</body>
</html>
