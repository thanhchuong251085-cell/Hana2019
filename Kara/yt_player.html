<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_top">
  <title>YouTube Player - Karaoke Hana</title>
  <link rel="manifest" href="./manifest_tv.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <script async="" src="https://www.googletagmanager.com/gtag/js?id=G-JCB7VEJF1Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JCB7VEJF1Y');
  </script>
  <style>
    * {
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* 🟢 ĐIỀU HƯỚNG KÍCH THƯỚC THÔNG MINH THEO HƯỚNG XOAY MÀN HÌNH */
    #player {
      position: absolute;
      top: 0;
      left: 0;
      border: none;
    }

    /* Khi xoay ngang: Tràn viền mượt mà chuẩn VLC */
    @media (orientation: landscape) {
      #player {
        width: 100vw;
        height: 100vh;
      }
    }

    /* Khi xoay dọc: Khung 16:9 gọn gàng đúng chuẩn y hệt hình mẫu anh vừa gửi */
    @media (orientation: portrait) {
      #player {
        width: 100vw;
        height: 56.25vw; /* Tỷ lệ 16:9 tính theo chiều rộng */
        top: 32%;       /* Cân đối vị trí hiển thị dọc vừa khít */
        transform: translateY(-50%);
      }
    }

    #localPlayer {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      object-fit: contain;
      background: #000;
      display: none;
      z-index: 0;
    }

    /* 🎨 BẢNG HIỆU CHÀO MỪNG ĐỘNG (TO RÕ, NẰM Ở PHÍA DƯỚI) */
    #welcomeBanner {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99;
      background: rgba(0, 0, 0, 0.6);
      padding: 14px 35px;
      border-radius: 40px;
      border: 2px solid rgba(255, 221, 0, 0.6);
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.8);
      
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.5s ease-in-out, visibility 1.5s ease-in-out;
      pointer-events: none;
    }

    .welcome-text {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 32px;
      font-weight: 900;
      text-align: center;
      letter-spacing: 1px;
      background: linear-gradient(45deg, #ffdd00, #00ffcc, #ff99ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 3px 12px rgba(0,0,0,0.9);
      animation: waveText 3s infinite ease-in-out;
    }

    @keyframes waveText {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
  </style>
</head>
<body>

  <!-- Bảng hiệu chào mừng động -->
  <div id="welcomeBanner">
    <div class="welcome-text">☕️ Chào mừng bạn đến với Karaoke Hana</div>
  </div>

  <div id="player"></div>
  <video id="localPlayer" controls preload="auto" playsinline></video>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAIwBqg8EYLU7TQXfOO697C4D5p5_GeghQ",
      authDomain: "karaoke-home.firebaseapp.com",
      databaseURL: "https://karaoke-home-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "karaoke-home",
      storageBucket: "karaoke-home.firebasestorage.app",
      messagingSenderId: "285959719922",
      appId: "1:285959719922:web:6cb594ebb3ef854124796b"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let player;
    let currentRoomCode = null;
    let playlistRef = null;
    let commandRef = null;
    let currentPlayingKey = null;
    const WAITING_VIDEO_ID = "6BlfNIfGFfM"; // 🚗 Xe hơi huyền thoại

    let bannerTimer = null;

    // 🌟 QUẢN LÝ HIỂN THỊ BẢNG HIỆU: Chỉ hiện khi ở màn hình xe hơi (Hiện 4 giây, nghỉ 8 giây)
    function showWelcomeBanner(show) {
      const banner = document.getElementById('welcomeBanner');
      if (!banner) return;

      if (show) {
        if (bannerTimer) clearInterval(bannerTimer);

        let cycleBanner = () => {
          banner.style.opacity = '1';
          banner.style.visibility = 'visible';

          setTimeout(() => {
            banner.style.opacity = '0';
            banner.style.visibility = 'hidden';
          }, 4000); 
        };

        setTimeout(() => {
          cycleBanner();
          bannerTimer = setInterval(cycleBanner, 12000);
        }, 2000);

      } else {
        if (bannerTimer) clearInterval(bannerTimer);
        banner.style.opacity = '0';
        banner.style.visibility = 'hidden';
      }
    }

    // 1️⃣ KHỞI TẠO PLAYER
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: WAITING_VIDEO_ID,
        playerVars: {
          'autoplay': 1,
          'controls': 1,
          'rel': 0,
          'enablejsapi': 1,
          'playsinline': 1
        },
        events: {
          'onReady': (event) => {
            event.target.playVideo();
            showWelcomeBanner(true);
          },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // 2️⃣ MÃ PHÒNG 2 CHIỀU: Nhận mã từ Android Studio
    function setRoomCode(code) {
      if (!code || currentRoomCode === code) return;
      currentRoomCode = code;

      if (playlistRef) playlistRef.off();
      if (commandRef) commandRef.off();

      playlistRef = db.ref(`rooms/${currentRoomCode}/playlist`);
      commandRef = db.ref(`rooms/${currentRoomCode}/command`);

      listenToPlaylist();
      listenToCommands();
    }

    // 🛑 Hàm dừng hẳn YouTube triệt tiêu tiếng chạy ngầm khi dính nhạc offline
    function stopYouTubeCompletely() {
      currentPlayingKey = null;
      if (player && player.stopVideo) {
        player.stopVideo();
      }
      showWelcomeBanner(true);
    }

    // 3️⃣ LẮNG NGHE PLAYLIST
    function listenToPlaylist() {
      playlistRef.orderByChild('timestamp').on('value', snapshot => {
        let playlist = [];
        snapshot.forEach(child => {
          let item = child.val();
          
          if (item.type === 'local' || item.localKey) {
            stopYouTubeCompletely();
          } else {
            playlist.push({ key: child.key, ...item });
          }
        });

        if (playlist.length === 0) {
          currentPlayingKey = null;
          if (player && player.loadVideoById) {
            player.loadVideoById(WAITING_VIDEO_ID);
            player.playVideo();
            showWelcomeBanner(true); 
          }
        } else {
          let topSong = playlist[0];
          
          if (topSong.type === 'local' || topSong.localKey) {
            stopYouTubeCompletely();
            return;
          }

          if (topSong.key !== currentPlayingKey) {
            currentPlayingKey = topSong.key;
            if (topSong.videoId && player && player.loadVideoById) {
              showWelcomeBanner(false); // Phát nhạc online -> TẮT ngay bảng chào mừng
              player.loadVideoById(topSong.videoId);
              player.playVideo();
            }
          }
        }
      });
    }

    // 4️⃣ LẮNG NGHE LỆNH REMOTE
    function listenToCommands() {
      commandRef.on('value', snapshot => {
        let cmd = snapshot.val();
        if (!cmd) return;
        commandRef.remove();

        try {
          switch (cmd.type) {
            case 'PLAY_NOW':
              if (cmd.typeSource === 'local' || cmd.localKey) {
                stopYouTubeCompletely();
                break;
              }
              if (cmd.videoId && player && player.loadVideoById) {
                showWelcomeBanner(false);
                player.loadVideoById(cmd.videoId);
                player.playVideo();
              }
              break;
            case 'PLAY':
              if (player && player.playVideo) player.playVideo();
              break;
            case 'PAUSE':
              if (player && player.pauseVideo) player.pauseVideo();
              break;
            case 'NEXT':
              if (player && player.stopVideo) {
                player.stopVideo();
              }
              if (player && player.loadVideoById) {
                player.loadVideoById(WAITING_VIDEO_ID);
                player.playVideo();
                showWelcomeBanner(true);
              }
              if (playlistRef) {
                playlistRef.orderByChild('timestamp').limitToFirst(1).once('value', snap => {
                  snap.forEach(child => {
                    child.ref.remove();
                  });
                });
              }
              break;
          }
        } catch (e) {
          console.log("Lỗi lệnh:", e);
        }
      });
    }

    // 5️⃣ XỬ LÝ KHI HẾT BÀI TỰ ĐỘNG
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        if (playlistRef) {
          playlistRef.orderByChild('timestamp').limitToFirst(1).once('value', snap => {
            snap.forEach(child => {
              child.ref.remove();
            });
          });
        }
      }
    }

    window.setRoomCode = setRoomCode;
  </script>
</body>
</html>
