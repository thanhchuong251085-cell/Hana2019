<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Chỉ để khung đen tuyệt đối, không có bất kỳ giao diện nào thừa thãi */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: black; overflow: hidden; }
        #player { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="player"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAIwBqg8EYLU7TQXfOO697C4D5p5_GeghQ",
            authDomain: "karaoke-home.firebaseapp.com",
            databaseURL: "https://karaoke-home-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "karaoke-home",
            storageBucket: "karaoke-home.firebasestorage.app",
            messagingSenderId: "285959719922",
            appId: "1:285959719922:web:6cb594ebb3ef854124796b"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let player;
        let isPlayerReady = false;

        // Lấy chính xác mã phòng do Kotlin truyền sang qua đường dẫn URL (?room=...)
        const urlParams = new URLSearchParams(window.location.search);
        let roomCode = urlParams.get('room') || '95490';

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: '6BlfNIfGFfM', // Video chờ mặc định (hình xe hơi)
                host: 'https://www.youtube.com',
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'modestbranding': 1,
                    'rel': 0,
                    'enablejsapi': 1,
                    'origin': 'https://www.youtube.com',
                    'playsinline': 1
                },
                events: {
                    'onReady': (e) => {
                        isPlayerReady = true;
                        e.target.playVideo();
                        listenToRoomPlaylist();
                    },
                    'onStateChange': (e) => {
                        // Phát xong tự động xóa bài đầu tiên để chuyển bài tiếp theo
                        if (e.data === YT.PlayerState.ENDED) {
                            db.ref(`rooms/${roomCode}/playlist`).once('value', snapshot => {
                                let list = [];
                                snapshot.forEach(child => { list.push(child.key); });
                                if (list.length > 0) {
                                    db.ref(`rooms/${roomCode}/playlist/${list[0]}`).remove();
                                }
                            });
                        }
                    }
                }
            });
        }

        // Lắng nghe trực tiếp Firebase theo đúng mã phòng của app Kotlin
        function listenToRoomPlaylist() {
            db.ref(`rooms/${roomCode}/playlist`).orderByChild('timestamp').on('value', snapshot => {
                let playlist = [];
                snapshot.forEach(child => {
                    playlist.push({ key: child.key, ...child.val() });
                });

                if (playlist.length > 0 && isPlayerReady) {
                    const topSong = playlist[0];
                    if (topSong.videoId) {
                        if (player && player.loadVideoById) {
                            player.loadVideoById(topSong.videoId);
                        }
                    }
                } else if (playlist.length === 0 && isPlayerReady) {
                    if (player && player.loadVideoById) {
                        player.loadVideoById('6BlfNIfGFfM');
                    }
                }
            });
        }
    </script>
</body>
</html>
