<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: black; overflow: hidden; }
        #player { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="player"></div>

    <!-- Nhúng thư viện Firebase 8.10.1 giống hệt bản gốc để đồng bộ phòng -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAIwBqg8EYLU7TQXfOO697C4D5p5_GeghQ",
            authDomain: "karaoke-home.firebaseapp.com",
            databaseURL: "https://karaoke-home-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "karaoke-home",
            storageBucket: "karaoke-home.firebasestorage.app",
            messagingSenderId: "285959719922",
            appId: "1:285959719922:web:6cb594ebb3ef854124796b"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let player;
        let isPlayerReady = false;

        // Lấy roomCode được truyền từ URL do Android đẩy sang
        const urlParams = new URLSearchParams(window.location.search);
        let roomCode = urlParams.get('room') || '95490'; // Mặc định nếu không thấy

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: '6BlfNIfGFfM', // Video chờ hình xe hơi
                host: 'https://www.youtube.com',
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'modestbranding': 1,
                    'rel': 0,
                    'enablejsapi': 1,
                    'origin': 'https://www.youtube.com',
                    'playsinline': 1
                },
                events: {
                    'onReady': (e) => {
                        isPlayerReady = true;
                        e.target.playVideo();
                        listenToRoomPlaylist(); // Bắt đầu lắng nghe playlist từ Firebase
                    },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.ENDED) {
                            // Phát xong tự động xóa bài hát đầu tiên khỏi playlist Firebase
                            db.ref(`rooms/${roomCode}/playlist`).once('value', snapshot => {
                                let list = [];
                                snapshot.forEach(child => { list.push(child.key); });
                                if (list.length > 0) {
                                    db.ref(`rooms/${roomCode}/playlist/${list[0]}`).remove();
                                }
                            });
                        }
                    }
                }
            });
        }

        // Lắng nghe trực tiếp danh sách bài hát từ Firebase của phòng hiện tại
        function listenToRoomPlaylist() {
            db.ref(`rooms/${roomCode}/playlist`).orderByChild('timestamp').on('value', snapshot => {
                let playlist = [];
                snapshot.forEach(child => {
                    playlist.push({ key: child.key, ...child.val() });
                });

                if (playlist.length > 0 && isPlayerReady) {
                    const topSong = playlist[0];
                    if (topSong.videoId) {
                        // Nếu là bài YouTube, tiến hành load video ngay lập tức
                        if (player && player.loadVideoById) {
                            player.loadVideoById(topSong.videoId);
                        }
                    }
                } else if (playlist.length === 0 && isPlayerReady) {
                    // Hết bài thì quay lại video chờ hình xe hơi
                    if (player && player.loadVideoById) {
                        player.loadVideoById('6BlfNIfGFfM');
                    }
                }
            });
        }

        // Hàm phụ trợ để app Android có thể gọi ép buộc nếu cần
        function loadVideo(videoId) {
            if (player && player.loadVideoById) {
                player.loadVideoById(videoId);
            }
        }
    </script>
</body>
</html>
