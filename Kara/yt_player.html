<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_top">
  <title>Karaoke YouTube Player</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    html, body {
      background-color: #000;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #player {
      width: 100%;
      height: 100%;
      background-color: #000;
    }
  </style>
</head>
<body>

  <div id="player"></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAIwBqg8EYLU7TQXfOO697C4D5p5_GeghQ",
      authDomain: "karaoke-home.firebaseapp.com",
      databaseURL: "https://karaoke-home-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "karaoke-home",
      storageBucket: "karaoke-home.firebasestorage.app",
      messagingSenderId: "285959719922",
      appId: "1:285959719922:web:6cb594ebb3ef854124796b"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let player;
    let currentPlayingKey = null; 
    let playlist = [];
    let isPlayerReady = false;
    let roomCode = null; 
    let qualityTimer = null;
    let playlistRef = null;
    let commandRef = null;
    const WAITING_VIDEO_ID = "6BlfNIfGFfM"; // 🚗 Video xe hơi chuẩn gốc

    // 1️⃣ ĐIỂM VÀNG 1: KHỞI TẠO AUTOPLAY - Mở app lên là xe hơi tự động chạy phà phà ngay lập tức
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%', 
        width: '100%',
        videoId: WAITING_VIDEO_ID, 
        host: 'https://www.youtube.com',
        playerVars: { 
          'autoplay': 1,           // Ép bật tự động chạy trên Android WebView
          'controls': 1,
          'modestbranding': 1,
          'rel': 0,                 
          'enablejsapi': 1,         
          'origin': window.location.origin,
          'iv_load_policy': 3,
          'playsinline': 1,
          'vq': 'hd1080'
        },
        events: {
          'onStateChange': onPlayerStateChange,
          'onReady': (event) => {
               isPlayerReady = true;
               if (playlist.length === 0) {
                 event.target.playVideo(); // Kích hoạt chạy ngay khi sẵn sàng
               }
          },
          'onError': onPlayerError 
        }
      });
    }

    // 2️⃣ ĐIỂM VÀNG 2: MÃ PHÒNG 2 CHIỀU (Nhận từ Android Studio / Đổi mã)
    function setRoomCode(code) {
      if (!code || roomCode === code) return;
      roomCode = code;
      console.log("🚀 Đã đồng bộ mã phòng từ Android: " + roomCode);

      if (playlistRef) playlistRef.off();
      if (commandRef) commandRef.off();

      playlistRef = db.ref(`rooms/${roomCode}/playlist`);
      commandRef = db.ref(`rooms/${roomCode}/command`);

      listenToData();
    }

    // 3️⃣ ĐIỂM VÀNG 3: FIREBASE & ĐIỀU KHIỂN REMOTE
    function listenToData() {
      playlistRef.orderByChild('timestamp').on('value', snapshot => {
        playlist = [];
        snapshot.forEach(child => {
          let item = child.val();
          // 🛡️ ĐIỂM VÀNG 4 (ĐIỂM ĂN TIỀN): Phân tách tuyến âm thanh, lọc bỏ nhạc local để ExoPlayer xử lý độc lập
          if (item.type === 'local' || item.localKey) {
            stopYouTubeCompletely();
          } else {
            playlist.push({ key: child.key, ...item });
          }
        });
        
        if (playlist.length === 0) {
          if (isPlayerReady && player && player.loadVideoById) {
            player.loadVideoById(WAITING_VIDEO_ID);
            player.playVideo();
          }
          currentPlayingKey = null;
        } else {
          const newFirstKey = playlist[0].key;
          if (newFirstKey !== currentPlayingKey) {
            checkAndPlayTopSong();
          }
        }
      });

      commandRef.on('value', snapshot => {
        const cmdData = snapshot.val();
        if (cmdData) {
          executeCommand(cmdData);
          commandRef.remove();
        }
      });
    }

    function checkAndPlayTopSong() {
      if (!isPlayerReady || !player) return;

      if (playlist.length === 0) {
        if (player.loadVideoById) {
          player.loadVideoById(WAITING_VIDEO_ID);
          player.playVideo();
        }
        return;
      }
      
      const topSong = playlist[0];
      
      if (topSong.type === 'local' || topSong.localKey) {
        stopYouTubeCompletely();
        return;
      }

      currentPlayingKey = topSong.key;

      if (topSong.videoId && player.loadVideoById) {
        if (qualityTimer) clearTimeout(qualityTimer);
        player.loadVideoById(topSong.videoId);
        player.playVideo(); 

        qualityTimer = setTimeout(() => {
          if (player && player.setPlaybackQuality) {
            player.setPlaybackQuality('hd1080');
          }
        }, 4000);
      }
    }

    function stopYouTubeCompletely() {
      if (qualityTimer) clearTimeout(qualityTimer);
      if (player && player.stopVideo) {
        player.stopVideo();
        player.pauseVideo();
      }
    }

    // 4️⃣ SỰ KIỆN HẾT BÀI / HẾT DANH SÁCH CHỜ -> Tự động quay về xe hơi chạy tiếp
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
          if (playlist.length > 0) {
              removeCurrentSong();
          } else {
              if (isPlayerReady && player && player.loadVideoById) {
                player.loadVideoById(WAITING_VIDEO_ID);
                player.playVideo();
              }
          }
      }
    }

    function onPlayerError(event) {
      setTimeout(() => {
          if(playlist.length > 0) removeCurrentSong();
          else if (isPlayerReady && player) {
              player.loadVideoById(WAITING_VIDEO_ID);
              player.playVideo();
          }
      }, 2000);
    }

    function removeCurrentSong() {
      if (playlist.length === 0 || !roomCode) return;
      const currentKey = playlist[0].key;
      db.ref(`rooms/${roomCode}/playlist/${currentKey}`).remove().then(() => {
        setTimeout(() => {
          if (playlist.length === 0 && isPlayerReady && player && player.loadVideoById) {
            player.loadVideoById(WAITING_VIDEO_ID);
            player.playVideo();
          }
        }, 300);
      });
    }

    function togglePlayPause() {
      if (!player || !isPlayerReady) return;
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    // 5️⃣ BỘ LỆNH REMOTE & NÚT NEXT THÔNG MINH
    function executeCommand(cmdData) {
      const type = (typeof cmdData === 'object') ? cmdData.type : cmdData;

      try {
        switch (type) {
          case 'PLAY_NOW': 
            if (cmdData.typeSource === 'local' || cmdData.localKey) {
              stopYouTubeCompletely();
              break;
            }

            if (cmdData.videoId && player && player.loadVideoById) {
              if (qualityTimer) clearTimeout(qualityTimer);
              player.loadVideoById(cmdData.videoId);
              player.playVideo(); 

              qualityTimer = setTimeout(() => {
                if (player && player.setPlaybackQuality) {
                  player.setPlaybackQuality('hd1080');
                }
              }, 4000);
            }
            break;
            
          case 'PLAY': 
          case 'PAUSE': 
            togglePlayPause();
            break;
            
          case 'NEXT': 
            // 🛡️ NÚT NEXT THÔNG MINH: Đang chạy xe hơi (danh sách rỗng) -> Khóa an toàn, giữ xe chạy
            if (playlist.length === 0) {
              console.log("🛡️ Đang chạy xe hơi, nút Next bị khóa an toàn!");
              if (isPlayerReady && player && player.loadVideoById) {
                player.loadVideoById(WAITING_VIDEO_ID);
                player.playVideo();
              }
              break;
            }

            if (playlist.length > 0) {
              removeCurrentSong(); 
            }
            break;

          case 'SET_HD': 
            if (player && player.setPlaybackQuality) {
              player.setPlaybackQuality('hd1080');
            }
            break;
            
          case 'VOL_UP': 
            if (player && player.getVolume) {
              player.setVolume(Math.min(player.getVolume() + 10, 100));
            }
            break;
            
          case 'VOL_DOWN': 
            if (player && player.getVolume) {
              player.setVolume(Math.max(player.getVolume() - 10, 0));
            }
            break;
        }
      } catch (e) { 
        console.error("Lỗi thực thi lệnh điều khiển:", e); 
      }
    }
  </script>
</body>
</html>
