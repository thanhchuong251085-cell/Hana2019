<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base target="_top">
    <title>Karaoke YouTube Player</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: black; 
            overflow: hidden; 
        }
        #player, #localPlayer { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            z-index: 0;
        }
        #localPlayer {
            object-fit: contain;
            background: #000;
            display: none;
        }
    </style>
</head>
<body>
    <div id="player"></div>
    <video id="localPlayer" controls preload="auto" playsinline></video>

    <!-- Thư viện Firebase & YouTube API chuẩn zin -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAIwBqg8EYLU7TQXfOO697C4D5p5_GeghQ",
            authDomain: "karaoke-home.firebaseapp.com",
            databaseURL: "https://karaoke-home-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "karaoke-home",
            storageBucket: "karaoke-home.firebasestorage.app",
            messagingSenderId: "285959719922",
            appId: "1:285959719922:web:6cb594ebb3ef854124796b"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let player;
        let roomCode = null;
        let playlistRef = null;
        let commandRef = null;
        let currentPlayingKey = null;
        let isPlayerReady = false;
        let isOfflineMode = false;
        
        // 🚗 Lấy đúng chuẩn ID xe hơi huyền thoại từ đoạn code anh cung cấp
        const WAITING_VIDEO_ID = '6BlfNIfGFfM'; 
        const localVid = document.getElementById('localPlayer');

        // 1️⃣ KHỞI TẠO PLAYER: Áp dụng chuẩn y hệt đoạn code xe hơi thuần túy (Mở lên là chạy ngay, không bao giờ đen màn hình)
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: WAITING_VIDEO_ID, // Nạp sẵn xe hơi từ cấu hình gốc
                host: 'https://www.youtube.com',
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'modestbranding': 1,
                    'rel': 0,
                    'enablejsapi': 1,
                    'origin': window.location.origin,
                    'playsinline': 1
                },
                events: {
                    'onReady': (e) => {
                        isPlayerReady = true;
                        e.target.playVideo(); // Kích hoạt chạy ngay lập tức khi sẵn sàng
                    },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // 2️⃣ MÃ PHÒNG 2 CHIỀU: Nhận mã kết nối từ Android Studio (Giữ nguyên vẹn 100%)
        function setRoomCode(code) {
            if (!code || roomCode === code) return;
            roomCode = code;
            console.log("🚀 Đã đồng bộ mã phòng từ Android: " + roomCode);

            if (playlistRef) playlistRef.off();
            if (commandRef) commandRef.off();

            playlistRef = db.ref(`rooms/${roomCode}/playlist`);
            commandRef = db.ref(`rooms/${roomCode}/command`);

            listenToFirebase();
        }

        // 3️⃣ LẮNG NGHE FIREBASE & PHÂN TÁCH TUYẾN ÂM THANH ONLINE / OFFLINE (Giữ nguyên vẹn cấu trúc anh em mình)
        function listenToFirebase() {
            playlistRef.orderByChild('timestamp').on('value', snapshot => {
                let playlist = [];
                snapshot.forEach(child => {
                    let item = child.val();
                    playlist.push({ key: child.key, ...item });
                });

                if (playlist.length === 0) {
                    currentPlayingKey = null;
                    stopOfflinePlayer();
                    // Khi danh sách trống -> Đưa player về lại xe hơi chạy tiếp
                    if (isPlayerReady && player && player.loadVideoById) {
                        player.loadVideoById(WAITING_VIDEO_ID);
                        player.playVideo();
                    }
                } else {
                    let topSong = playlist[0];

                    // Phân tách tuyến âm thanh: Local / Offline vs YouTube Online
                    if (topSong.type === 'local' || topSong.localKey) {
                        stopYouTubeCompletely();
                        playOfflineSong(topSong);
                    } else {
                        stopOfflinePlayer();
                        if (topSong.key !== currentPlayingKey) {
                            currentPlayingKey = topSong.key;
                            if (topSong.videoId && isPlayerReady && player && player.loadVideoById) {
                                player.loadVideoById(topSong.videoId);
                                player.playVideo();
                            }
                        }
                    }
                }
            });

            // Lắng nghe lệnh điều khiển từ Remote
            commandRef.on('value', snapshot => {
                let cmd = snapshot.val();
                if (!cmd) return;
                commandRef.remove();
                executeCommand(cmd);
            });
        }

        // 4️⃣ XỬ LÝ NHẠC OFFLINE (EXOPLAYER)
        function playOfflineSong(song) {
            isOfflineMode = true;
            document.getElementById('player').style.display = 'none';
            localVid.style.display = 'block';

            if (localVid.src !== song.url) {
                localVid.src = song.url;
                localVid.load();
                localVid.play().catch(e => console.log("Lỗi play local:", e));
            }

            localVid.onended = () => {
                removeCurrentSong();
            };
        }

        function stopOfflinePlayer() {
            isOfflineMode = false;
            localVid.pause();
            localVid.removeAttribute('src');
            localVid.style.display = 'none';
            document.getElementById('player').style.display = 'block';
        }

        function stopYouTubeCompletely() {
            if (player && player.stopVideo) {
                player.stopVideo();
            }
        }

        // 5️⃣ XỬ LÝ KHI HẾT BÀI HOẶC NEXT
        function onPlayerStateChange(event) {
            if (isOfflineMode) return;
            if (event.data === YT.PlayerState.ENDED) {
                removeCurrentSong();
            }
        }

        function removeCurrentSong() {
            if (!playlistRef) return;
            playlistRef.orderByChild('timestamp').limitToFirst(1).once('value', snap => {
                snap.forEach(child => {
                    child.ref.remove().then(() => {
                        // Sau khi xóa bài, tự động gọi lại xe hơi chạy nếu hết danh sách
                        setTimeout(() => {
                            if (isPlayerReady && player && player.loadVideoById) {
                                player.loadVideoById(WAITING_VIDEO_ID);
                                player.playVideo();
                            }
                        }, 200);
                    });
                });
            });
        }

        // 6️⃣ BỘ LỆNH ĐIỀU KHIỂN REMOTE (PLAY, PAUSE, NEXT, VOL...)
        function executeCommand(cmdData) {
            const type = (typeof cmdData === 'object') ? cmdData.type : cmdData;

            try {
                switch (type) {
                    case 'PLAY_NOW':
                        if (cmdData.videoId && isPlayerReady && player && player.loadVideoById) {
                            stopOfflinePlayer();
                            player.loadVideoById(cmdData.videoId);
                            player.playVideo();
                        }
                        break;
                    case 'PLAY':
                        if (isOfflineMode) {
                            localVid.play();
                        } else if (isPlayerReady && player) {
                            player.playVideo();
                        }
                        break;
                    case 'PAUSE':
                        if (isOfflineMode) {
                            localVid.pause();
                        } else if (isPlayerReady && player) {
                            player.pauseVideo();
                        }
                        break;
                    case 'NEXT':
                        removeCurrentSong();
                        break;
                    case 'VOL_UP':
                        if (isOfflineMode) {
                            localVid.volume = Math.min(localVid.volume + 0.1, 1);
                        } else if (isPlayerReady && player && player.getVolume) {
                            player.setVolume(Math.min(player.getVolume() + 10, 100));
                        }
                        break;
                    case 'VOL_DOWN':
                        if (isOfflineMode) {
                            localVid.volume = Math.max(localVid.volume - 0.1, 0);
                        } else if (isPlayerReady && player && player.getVolume) {
                            player.setVolume(Math.max(player.getVolume() - 10, 0));
                        }
                        break;
                }
            } catch (e) {
                console.log("Lỗi thực thi lệnh Remote:", e);
            }
        }
    </script>
</body>
</html>
