<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Chỉ để màn hình đen thui tuyệt đối, không có bất kỳ giao diện nào */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: black; overflow: hidden; }
        #player { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="player"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAIwBqg8EYLU7TQXfOO697C4D5p5_GeghQ",
            authDomain: "karaoke-home.firebaseapp.com",
            databaseURL: "https://karaoke-home-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "karaoke-home",
            storageBucket: "karaoke-home.firebasestorage.app",
            messagingSenderId: "285959719922",
            appId: "1:285959719922:web:6cb594ebb3ef854124796b"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let player;
        let isPlayerReady = false;
        let roomCode = null;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: '6BlfNIfGFfM', // Video chờ hình xe hơi
                host: 'https://www.youtube.com',
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'modestbranding': 1,
                    'rel': 0,
                    'enablejsapi': 1,
                    'origin': 'https://www.youtube.com',
                    'playsinline': 1
                },
                events: {
                    'onReady': (e) => {
                        isPlayerReady = true;
                        e.target.playVideo();
                        
                        // Sau khi player sẵn sàng, ta tự động nhận mã phòng từ đường dẫn URL hoặc chờ Android cung cấp
                        detectRoomCode();
                    },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.ENDED && roomCode) {
                            db.ref(`rooms/${roomCode}/playlist`).once('value', snapshot => {
                                let list = [];
                                snapshot.forEach(child => { list.push(child.key); });
                                if (list.length > 0) {
                                    db.ref(`rooms/${roomCode}/playlist/${list[0]}`).remove();
                                }
                            });
                        }
                    }
                }
            });
        }

        // Hàm tự động bắt mã phòng (Hỗ trợ cả bắt qua URL hoặc hàm gọi từ Android)
        function detectRoomCode() {
            // Cách 1: Lấy từ đuôi URL nếu có truyền (?room=XXXXX)
            const urlParams = new URLSearchParams(window.location.search);
            roomCode = urlParams.get('room');

            if (roomCode) {
                startListening(roomCode);
            } else {
                // Cách 2: Nếu chưa có, ta tự quét các phòng gần nhất trên Firebase hoặc chờ lệnh setRoomCode từ app
                console.log("Đang chờ nhận mã phòng...");
            }
        }

        // Hàm để Android Studio có thể gọi trực tiếp sang truyền mã phòng bất cứ lúc nào
        function setRoomCode(code) {
            roomCode = code;
            startListening(roomCode);
        }

        // Bắt đầu lắng nghe Firebase theo đúng mã phòng đó
        function startListening(code) {
            if (!code) return;
            roomCode = code;
            console.log("Đã kết nối thành công với phòng: " + roomCode);

            db.ref(`rooms/${roomCode}/playlist`).orderByChild('timestamp').on('value', snapshot => {
                let playlist = [];
                snapshot.forEach(child => {
                    playlist.push({ key: child.key, ...child.val() });
                });

                if (playlist.length > 0 && isPlayerReady) {
                    const topSong = playlist[0];
                    if (topSong.videoId) {
                        if (player && player.loadVideoById) {
                            player.loadVideoById(topSong.videoId);
                        }
                    }
                } else if (playlist.length === 0 && isPlayerReady) {
                    if (player && player.loadVideoById) {
                        player.loadVideoById('6BlfNIfGFfM');
                    }
                }
            });
        }
    </script>
</body>
</html>
