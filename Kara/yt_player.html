<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_top">
  <title>YouTube Player - Karaoke Hana</title>
  <link rel="manifest" href="./manifest_tv.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <script async="" src="https://www.googletagmanager.com/gtag/js?id=G-JCB7VEJF1Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JCB7VEJF1Y');
  </script>
  <style>
    * {
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #playerContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 0;
    }

    /* 🟢 1. KHI XOAY NGANG (LANDSCAPE): Lấp đầy tuyệt đối, không co đen hai bên */
    @media (orientation: landscape) {
      #player {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 177.77vh;
        height: 100vh;
        min-width: 100vw;
        min-height: 56.25vw;
        transform: translate(-50%, -50%);
        border: none;
      }
    }

    /* 🟢 2. KHI XOAY DỌC (PORTRAIT): Thu gọn ngay ngắn, chống phóng to */
    @media (orientation: portrait) {
      #player {
        position: absolute;
        width: 100vw;
        height: 56.25vw;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: none;
      }
    }

    #localPlayer {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      object-fit: contain;
      background: #000;
      display: none;
      z-index: 0;
    }

    /* 🎨 BẢNG HIỆU CHÀO MỪNG: Nhỏ gọn, không che nút Play và thanh tua */
    #welcomeBanner {
      position: absolute;
      bottom: 45px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99;
      background: rgba(0, 0, 0, 0.55);
      padding: 8px 20px;
      border-radius: 25px;
      border: 1.5px solid rgba(255, 221, 0, 0.5);
      backdrop-filter: blur(4px);
      box-shadow: 0 3px 10px rgba(0,0,0,0.7);
      
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.5s ease-in-out, visibility 1.5s ease-in-out;
      pointer-events: none;
    }

    .welcome-text {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.5px;
      background: linear-gradient(45deg, #ffdd00, #00ffcc, #ff99ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      animation: waveText 3s infinite ease-in-out;
    }

    @keyframes waveText {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
  </style>
</head>
<body>

  <!-- Bảng hiệu chào mừng động -->
  <div id="welcomeBanner">
    <div class="welcome-text">☕️ Chào mừng bạn đến với Karaoke Hana</div>
  </div>

  <!-- Khung chứa player -->
  <div id="playerContainer">
    <div id="player"></div>
  </div>

  <video id="localPlayer" controls preload="auto" playsinline></video>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAIwBqg8EYLU7TQXfOO697C4D5p5_GeghQ",
      authDomain: "karaoke-home.firebaseapp.com",
      databaseURL: "https://karaoke-home-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "karaoke-home",
      storageBucket: "karaoke-home.firebasestorage.app",
      messagingSenderId: "285959719922",
      appId: "1:285959719922:web:6cb594ebb3ef854124796b"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let player;
    let currentRoomCode = null;
    let playlistRef = null;
    let commandRef = null;
    let currentPlayingKey = null;
    const WAITING_VIDEO_ID = "6BlfNIfGFfM"; // 🚗 Xe hơi huyền thoại

    let bannerTimer = null;

    // 🌟 QUẢN LÝ HIỂN THỊ BẢNG HIỆU: Chỉ hiện đúng khi là màn hình xe hơi
    function showWelcomeBanner(show) {
      const banner = document.getElementById('welcomeBanner');
      if (!banner) return;

      if (show) {
        if (bannerTimer) clearInterval(bannerTimer);

        let cycleBanner = () => {
          banner.style.opacity = '1';
          banner.style.visibility = 'visible';

          setTimeout(() => {
            banner.style.opacity = '0';
            banner.style.visibility = 'hidden';
          }, 4000); // Hiện 4 giây
        };

        setTimeout(() => {
          cycleBanner();
          bannerTimer = setInterval(cycleBanner, 9000); // Tổng chu kỳ 9s (4s hiện + 5s nghỉ)
        }, 1500);

      } else {
        if (bannerTimer) clearInterval(bannerTimer);
        banner.style.opacity = '0';
        banner.style.visibility = 'hidden';
      }
    }

    // 1️⃣ KHỞI TẠO PLAYER
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: WAITING_VIDEO_ID,
        playerVars: {
          'autoplay': 1,
          'controls': 1,
          'rel': 0,
          'enablejsapi': 1,
          'playsinline': 1
        },
        events: {
          'onReady': (event) => {
            event.target.playVideo();
            showWelcomeBanner(true);
          },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // 2️⃣ MÃ PHÒNG 2 CHIỀU: Nhận mã từ Android Studio
    function setRoomCode(code) {
      if (!code || currentRoomCode === code) return;
      currentRoomCode = code;

      if (playlistRef) playlistRef.off();
      if (commandRef) commandRef.off();

      playlistRef = db.ref(`rooms/${currentRoomCode}/playlist`);
      commandRef = db.ref(`rooms/${currentRoomCode}/command`);

      listenToPlaylist();
      listenToCommands();
    }

    // 🛑 Hàm dừng hẳn YouTube triệt tiêu tiếng chạy ngầm khi dính nhạc offline
    function stopYouTubeCompletely() {
      currentPlayingKey = null;
      if (player && player.stopVideo) {
        player.stopVideo();
      }
      showWelcomeBanner(false);
    }

    // 3️⃣ LẮNG NGHE PLAYLIST (ĐÃ KHẮC PHỤC TRIỆT ĐỂ LỖI KHỰNG 1 GIÂY KHI THÊM BÀI)
    function listenToPlaylist() {
      playlistRef.orderByChild('timestamp').on('value', snapshot => {
        let playlist = [];
        snapshot.forEach(child => {
          let item = child.val();
          
          if (item.type === 'local' || item.localKey) {
            stopYouTubeCompletely();
          } else {
            playlist.push({ key: child.key, ...item });
          }
        });

        if (playlist.length === 0) {
          // Nếu danh sách trống -> Quay về xe hơi
          if (currentPlayingKey !== null) {
            currentPlayingKey = null;
            if (player && player.loadVideoById) {
              player.loadVideoById(WAITING_VIDEO_ID);
              player.playVideo();
              showWelcomeBanner(true);
            }
          }
        } else {
          let topSong = playlist[0];
          
          if (topSong.type === 'local' || topSong.localKey) {
            stopYouTubeCompletely();
            return;
          }

          // 🟢 CHỐT CHẶN CHỐNG KHỰNG: Chỉ load lại video khi bài hát đầu tiên THỰC SỰ thay đổi!
          // Nếu thêm bài vào danh sách chờ phía sau, topSong.key giữ nguyên -> TUYỆT ĐỐI KHÔNG KHỰNG, VIDEO CHẠY MƯỢT MÀ.
          if (topSong.key !== currentPlayingKey) {
            currentPlayingKey = topSong.key;
            if (topSong.videoId && player && player.loadVideoById) {
              
              // Kiểm tra nghiêm ngặt: Chỉ hiện bảng chào mừng nếu đúng là xe hơi
              if (topSong.videoId === WAITING_VIDEO_ID) {
                showWelcomeBanner(true);
              } else {
                showWelcomeBanner(false); // Đang hát karaoke -> TẮT BỎ TUYỆT ĐỐI
              }
              
              player.loadVideoById(topSong.videoId);
              player.playVideo();
            }
          }
        }
      });
    }

    // 4️⃣ LẮNG NGHE LỆNH REMOTE
    function listenToCommands() {
      commandRef.on('value', snapshot => {
        let cmd = snapshot.val();
        if (!cmd) return;
        commandRef.remove();

        try {
          switch (cmd.type) {
            case 'PLAY_NOW':
              if (cmd.typeSource === 'local' || cmd.localKey) {
                stopYouTubeCompletely();
                break;
              }
              if (cmd.videoId && player && player.loadVideoById) {
                if (cmd.videoId === WAITING_VIDEO_ID) {
                  showWelcomeBanner(true);
                } else {
                  showWelcomeBanner(false);
                }
                player.loadVideoById(cmd.videoId);
                player.playVideo();
              }
              break;
            case 'PLAY':
              if (player && player.playVideo) player.playVideo();
              break;
            case 'PAUSE':
              if (player && player.pauseVideo) player.pauseVideo();
              break;
            case 'NEXT':
              if (player && player.stopVideo) {
                player.stopVideo();
              }
              if (player && player.loadVideoById) {
                player.loadVideoById(WAITING_VIDEO_ID);
                player.playVideo();
                showWelcomeBanner(true);
              }
              if (playlistRef) {
                playlistRef.orderByChild('timestamp').limitToFirst(1).once('value', snap => {
                  snap.forEach(child => {
                    child.ref.remove();
                  });
                });
              }
              break;
          }
        } catch (e) {
          console.log("Lỗi lệnh:", e);
        }
      });
    }

    // 5️⃣ XỬ LÝ KHI HẾT BÀI TỰ ĐỘNG
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        if (playlistRef) {
          playlistRef.orderByChild('timestamp').limitToFirst(1).once('value', snap => {
            snap.forEach(child => {
              child.ref.remove();
            });
          });
        }
      }
    }

    window.setRoomCode = setRoomCode;
  </script>
</body>
</html>
