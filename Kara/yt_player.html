<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_top">
  <title>Karaoke YouTube Player</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    html, body {
      background-color: #000;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      background-color: #000;
    }

    #localPlayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      object-fit: contain;
      background: #000;
      display: none;
    }
  </style>
</head>
<body>

  <div id="player"></div>
  <video id="localPlayer" controls preload="auto" playsinline autobuffer></video>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAIwBqg8EYLU7TQXfOO697C4D5p5_GeghQ",
      authDomain: "karaoke-home.firebaseapp.com",
      databaseURL: "https://karaoke-home-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "karaoke-home",
      storageBucket: "karaoke-home.firebasestorage.app",
      messagingSenderId: "285959719922",
      appId: "1:285959719922:web:6cb594ebb3ef854124796b"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let player;
    let currentPlayingKey = null; 
    let playlist = [];
    let isPlayerReady = false;
    let roomCode = null; 
    let qualityTimer = null;
    let playlistRef = null;
    let commandRef = null;
    let isOfflineMode = false;
    const WAITING_VIDEO_ID = "6BlfNIfGFfM"; // 🚗 Xe hơi chuẩn gốc

    // 🛡️ KHIÊN CHẮN BẢO VỆ XE HƠI LÚC KHỞI ĐỘNG
    let isAndroidCodeInitialized = false;

    // 1️⃣ KHỞI TẠO PLAYER
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%', 
        width: '100%',
        videoId: WAITING_VIDEO_ID, 
        host: 'https://www.youtube.com',
        playerVars: { 
          'autoplay': 1,           
          'controls': 1,
          'modestbranding': 1,
          'rel': 0,                 
          'enablejsapi': 1,         
          'origin': window.location.origin,
          'iv_load_policy': 3,
          'playsinline': 1,
          'vq': 'hd1080'
        },
        events: {
          'onStateChange': onPlayerStateChange,
          'onReady': (event) => {
               isPlayerReady = true;
               event.target.playVideo(); 
          },
          'onError': onPlayerError 
        }
      });
    }

    // 2️⃣ MÃ PHÒNG 2 CHIỀU (Bọc khiên chống màn hình đen lúc mở app)
    function setRoomCode(code) {
      if (!code) return;
      if (roomCode === code && isAndroidCodeInitialized) return;
      
      roomCode = code;
      console.log("🚀 Đã nhận mã phòng từ Android: " + roomCode);

      if (!isAndroidCodeInitialized) {
        isAndroidCodeInitialized = true;
        console.log("🚗 Xe hơi đang chạy độc lập, tạm hoãn kết nối Firebase đợt đầu!");
        return; 
      }

      if (playlistRef) playlistRef.off();
      if (commandRef) commandRef.off();

      playlistRef = db.ref(`rooms/${roomCode}/playlist`);
      commandRef = db.ref(`rooms/${roomCode}/command`);

      listenToData();
    }

    // 3️⃣ FIREBASE & ĐIỀU KHIỂN REMOTE
    function listenToData() {
      playlistRef.orderByChild('timestamp').on('value', snapshot => {
        playlist = [];
        snapshot.forEach(child => {
          let item = child.val();
          
          if (item.type === 'local' || item.localKey) {
            // Gặp bài local -> chuyển sang offline mode
            isOfflineMode = true;
          } else {
            playlist.push({ key: child.key, ...item });
          }
        });
        
        if (playlist.length === 0 && !isOfflineMode) {
          playYouTubeVideo(WAITING_VIDEO_ID);
          currentPlayingKey = null;
        } else if (playlist.length > 0 && !isOfflineMode) {
          const newFirstKey = playlist[0].key;
          if (newFirstKey !== currentPlayingKey) {
            checkAndPlayTopSong();
          }
        }
      });

      commandRef.on('value', snapshot => {
        const cmdData = snapshot.val();
        if (cmdData) {
          executeCommand(cmdData);
          commandRef.remove();
        }
      });
    }

    function checkAndPlayTopSong() {
      if (playlist.length === 0) {
        playYouTubeVideo(WAITING_VIDEO_ID);
        return;
      }
      
      const topSong = playlist[0];
      
      if (topSong.type === 'local' || topSong.localKey) {
        return;
      }

      currentPlayingKey = topSong.key;

      if (topSong.videoId) {
        playYouTubeVideo(topSong.videoId);
      }
    }

    // 🌐 PHÁT YOUTUBE ONLINE (Đảm bảo hiện player YouTube, tắt player offline)
    function playYouTubeVideo(videoId) {
      isOfflineMode = false;
      
      const localVid = document.getElementById('localPlayer');
      localVid.pause();
      localVid.removeAttribute('src');
      localVid.style.display = 'none';

      document.getElementById('player').style.display = 'block';

      if (isPlayerReady && player && typeof player.loadVideoById === 'function') {
        if (qualityTimer) clearTimeout(qualityTimer);
        player.loadVideoById(videoId);
        player.playVideo();

        qualityTimer = setTimeout(() => {
          if (player && player.setPlaybackQuality && !isOfflineMode) {
            player.setPlaybackQuality('hd1080');
          }
        }, 4000);
      }
    }

    // 🛑 CHUYỂN SANG OFFLINE (Tạm dừng YouTube, ẩn player YouTube để không bị chồng tiếng)
    function playOfflineSong(url) {
      isOfflineMode = true;
      if (qualityTimer) clearTimeout(qualityTimer);

      if (player && typeof player.pauseVideo === 'function') {
        try { player.pauseVideo(); } catch(e) {}
      }
      document.getElementById('player').style.display = 'none';

      const localVid = document.getElementById('localPlayer');
      localVid.style.display = 'block';
      localVid.src = url;
      localVid.load();
      localVid.play().catch(e => { localVid.play(); });
    }

    // 4️⃣ SỰ KIỆN HẾT BÀI
    function onPlayerStateChange(event) {
      if (isOfflineMode) return;
      if (event.data === YT.PlayerState.ENDED) {
          if (playlist.length > 0) {
              removeCurrentSong();
          } else {
              playYouTubeVideo(WAITING_VIDEO_ID);
          }
      }
    }

    function onPlayerError(event) {
      if (isOfflineMode) return;
      setTimeout(() => {
          if(playlist.length > 0) removeCurrentSong();
          else playYouTubeVideo(WAITING_VIDEO_ID);
      }, 2000);
    }

    function removeCurrentSong() {
      if (playlist.length === 0 || !roomCode) return;
      const currentKey = playlist[0].key;
      db.ref(`rooms/${roomCode}/playlist/${currentKey}`).remove().then(() => {
        setTimeout(() => {
          if (playlist.length === 0 && !isOfflineMode) {
            playYouTubeVideo(WAITING_VIDEO_ID);
          }
        }, 300);
      });
    }

    function togglePlayPause() {
      if (isOfflineMode) {
        const localVid = document.getElementById('localPlayer');
        if (localVid.paused) localVid.play(); else localVid.pause();
        return;
      }

      if (!player || !isPlayerReady) return;
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    // 5️⃣ BỘ LỆNH REMOTE
    function executeCommand(cmdData) {
      const type = (typeof cmdData === 'object') ? cmdData.type : cmdData;

      try {
        switch (type) {
          case 'PLAY_NOW': 
            if (cmdData.typeSource === 'local' || cmdData.localKey) {
              if (cmdData.url) playOfflineSong(cmdData.url);
              break;
            }

            if (cmdData.videoId) {
              playYouTubeVideo(cmdData.videoId);
            }
            break;
            
          case 'PLAY': 
          case 'PAUSE': 
            togglePlayPause();
            break;
            
          case 'NEXT': 
            if (playlist.length === 0 && !isOfflineMode) {
              playYouTubeVideo(WAITING_VIDEO_ID);
              break;
            }

            if (playlist.length > 0) {
              removeCurrentSong(); 
            }
            break;

          case 'SET_HD': 
            if (!isOfflineMode && player && player.setPlaybackQuality) {
              player.setPlaybackQuality('hd1080');
            }
            break;
            
          case 'VOL_UP': 
            if (isOfflineMode) {
              const localVid = document.getElementById('localPlayer');
              localVid.volume = Math.min(localVid.volume + 0.1, 1);
            } else if (player && player.getVolume) {
              player.setVolume(Math.min(player.getVolume() + 10, 100));
            }
            break;
            
          case 'VOL_DOWN': 
            if (isOfflineMode) {
              const localVid = document.getElementById('localPlayer');
              localVid.volume = Math.max(localVid.volume - 0.1, 0);
            } else if (player && player.getVolume) {
              player.setVolume(Math.max(player.getVolume() - 10, 0));
            }
            break;
        }
      } catch (e) { 
        console.error("Lỗi thực thi lệnh điều khiển:", e); 
      }
    }
  </script>
</body>
</html>
