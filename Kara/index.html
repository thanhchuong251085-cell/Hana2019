  <style>
    body {
      margin: 0;
      font-family: 'Baloo 2', cursive;
      background: linear-gradient(to right, #1e3c72, #2a5298);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-image: url('https://images.unsplash.com/photo-1534682309381-436a7edcd9c4?auto=format&fit=crop&w=1470&q=80');
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
    }

    .overlay {
      background-color: rgba(0, 0, 0, 0.6);
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 100%;
      box-sizing: border-box;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #fff;
      text-shadow: 2px 2px 5px #000;
      animation: shake 2s infinite alternate;
      overflow-wrap: break-word;
      word-wrap: break-word;
      max-width: 90vw;
      text-align: center;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(2px); }
      50% { transform: translateX(-2px); }
      75% { transform: translateX(2px); }
      100% { transform: translateX(0); }
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-top: 2rem;
      align-items: center;
    }

    .buttons a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background-color: #ff4b2b;
      color: white;
      padding: 1rem 2rem;
      border-radius: 2rem;
      font-size: 1.2rem;
      text-decoration: none;
      transition: background 0.3s ease;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 300px;
    }

    .buttons a:hover {
      background-color: #ff3a1a;
    }

    .buttons a svg {
      width: 24px;
      height: 24px;
    }

    @media (min-width: 768px) {
      .buttons {
        flex-direction: row;
      }

      .buttons a {
        width: auto;
      }
    }

    /* --- CSS mới cho QR code và chữ --- */
 .qr-cafe {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 10;
  display: flex;
  flex-direction: column; /* Sắp xếp chữ và ảnh theo chiều dọc */
  align-items: left;    /* Căn giữa nội dung ngang */
  text-align: left;     /* Căn giữa chữ */
}

.qr-info {
  display: flex;
  flex-direction: column;
  align-items: left; /* Căn giữa cụm chữ */
  margin: 0;           /* Bỏ margin bên trái/phải */
  padding-left: 1px;
}

.qr-cafe-text-main {
  color: #ffdd00; /* Màu chữ vàng tươi */
  font-size: 1rem;
  font-weight: bold;
  text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
  animation: bounce 1.5s infinite; /* Hiệu ứng động */
  opacity: 0.92;
  margin-bottom: 5px; /* Khoảng cách giữa 2 dòng chữ */
}

    .qr-cafe-text-sub {
      color: #add8e6; /* Màu xanh nhạt cho dòng tải về */
      font-size: 0.75rem;
      text-decoration: underline;
      cursor: pointer;
      opacity: 0.9;
      transition: opacity 0.3s;
    }
    
    .qr-cafe-text-sub:hover {
        opacity: 1;
    }
    
    .qr-cafe-image-container {
        margin-top: 5px; /* Khoảng cách giữa chữ và QR code */
    }

    .qr-cafe img {
      width: 120px;
      height: 120px;
      opacity: 99.2; /* Mờ 80% */
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      transition: opacity 0.3s, transform 0.3s;
      display: block;
    }

    .qr-cafe:hover img {
      opacity: 1; /* Rõ 100% khi di chuột */
      transform: scale(1.1); /* Phóng to nhẹ khi di chuột */
    }

    /* Hiệu ứng động vui vẻ cho chữ chính */
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
      40% {transform: translateY(-5px) rotate(1deg);}
      60% {transform: translateY(-2px) rotate(-1deg);}
    }
    /* CSS mới cho Popup ảnh phóng to */
    #qr-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9); /* Nền đen đậm mờ */
      display: none; /* Ẩn mặc định */
      justify-content: center;
      align-items: center;
      z-index: 9999; /* Luôn nằm trên cùng */
      cursor: pointer; /* Cho biết có thể đóng */
    }

    #qr-modal-overlay img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }
    /* --- Hết CSS cho Popup --- */
    
    /* Căn chỉnh lại để QR code không còn là liên kết download */
    .qr-cafe-image-container a {
      cursor: zoom-in; /* Con trỏ phóng to khi chạm/nhấn */
    }

    
    /* --- END CSS mới cho QR code và chữ --- */

    /* --- CSS mới cho Phần Tải App (Góc trên bên phải) --- */
    .app-download-links {
      position: fixed;
      top: 15px;
      right: 15px; /* Căn lề phải */
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-end; /* Căn lề phải cho cụm chữ */
      text-align: right;
    }

    .app-download-links a {
      color: #38bdf8; /* Màu xanh da trời sáng */
      font-size: 0.95rem;
      font-weight: bold;
      text-decoration: none; /* Bỏ gạch chân mặc định */
      margin-bottom: 5px;
      padding: 5px 8px;
      border-radius: 5px;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
      background: rgba(0, 0, 0, 0.2); /* Nền mờ nhẹ cho dễ đọc */
      transition: background 0.3s, color 0.3s, transform 0.2s;
      
      /* Hiệu ứng vui vẻ: Hơi rung nhẹ/lắc lư khi đứng yên */
      animation: gentle-wobble 4s ease-in-out infinite; 
    }

    .app-download-links a:hover {
      background: rgba(0, 0, 0, 0.5); /* Nền đậm hơn khi di chuột */
      color: #ffffff; /* Chữ trắng sáng khi di chuột */
      transform: scale(1.05); /* Phóng to nhẹ khi di chuột */
    }

    /* Hiệu ứng động lắc lư nhẹ */
    @keyframes gentle-wobble {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(0.5deg); }
      75% { transform: rotate(-0.5deg); }
    }
    /* --- END CSS mới cho Phần Tải App --- */

    

  </style>

    // --- Chức năng Popup/Modal cho QR code ---
function openQRModal(event) {
    // Ngăn chặn hành vi mặc định của thẻ <a> (lên đầu trang)
    event.preventDefault(); 
    
    const modal = document.getElementById('qr-modal-overlay');
    modal.style.display = 'flex';
}

function closeQRModal() {
    const modal = document.getElementById('qr-modal-overlay');
    // Đóng Modal khi người dùng nhấn vào bất cứ đâu trên lớp phủ
    modal.style.display = 'none';
}

// Ngăn chặn việc nhấn vào ảnh trong modal mà không đóng modal (chỉ đóng khi nhấn vào nền)
document.getElementById('qr-modal-overlay').querySelector('img').onclick = function(e) {
    e.stopPropagation();
};
// --- Hết chức năng Popup/Modal ---
