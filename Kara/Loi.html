<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_top">
  <title>YouTube Player - Karaoke Hana</title>
  <link rel="manifest" href="./manifest_tv.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <script async="" src="https://www.googletagmanager.com/gtag/js?id=G-JCB7VEJF1Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JCB7VEJF1Y');
  </script>
  <style>
    * {
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #playerContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 0;
      display: block;
    }

    /* 1. Xoay ngang: Lấp đầy tuyệt đối không co đen hai bên */
    @media (orientation: landscape) {
      #player {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 177.77vh;
        height: 100vh;
        min-width: 100vw;
        min-height: 56.25vw;
        transform: translate(-50%, -50%);
        border: none;
      }
    }

    /* 2. Xoay dọc: Thu gọn ngay ngắn ở giữa, chống phóng to */
    @media (orientation: portrait) {
      #player {
        position: absolute;
        width: 100vw;
        height: 56.25vw;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: none;
      }
    }

    /* 🟢 LOCAL PLAYER (Nhạc offline): Nằm đè lên trên khi phát nhạc offline (z-index: 10) */
    #localPlayer {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      object-fit: contain;
      background: #000;
      display: none;
      z-index: 10;
    }

    /* 🎨 BẢNG HIỆU CHÀO MỪNG: Nhỏ gọn, chỉ xuất hiện khi đúng video xe hơi */
    #welcomeBanner {
      position: absolute;
      bottom: 45px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99;
      background: rgba(0, 0, 0, 0.55);
      padding: 8px 20px;
      border-radius: 25px;
      border: 1.5px solid rgba(255, 221, 0, 0.5);
      backdrop-filter: blur(4px);
      box-shadow: 0 3px 10px rgba(0,0,0,0.7);
      
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.5s ease-in-out, visibility 1.5s ease-in-out;
      pointer-events: none;
    }

    .welcome-text {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.5px;
      background: linear-gradient(45deg, #ffdd00, #00ffcc, #ff99ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      animation: waveText 3s infinite ease-in-out;
    }

    @keyframes waveText {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
  </style>
</head>
<body>

  <!-- Bảng hiệu chào mừng động -->
  <div id="welcomeBanner">
    <div class="welcome-text">☕️ Chào mừng bạn đến với Karaoke Hana</div>
  </div>

  <!-- Khung chứa YouTube player -->
  <div id="playerContainer">
    <div id="player"></div>
  </div>

  <!-- Trình phát nhạc offline -->
  <video id="localPlayer" controls preload="auto" playsinline></video>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAIwBqg8EYLU7TQXfOO697C4D5p5_GeghQ",
      authDomain: "karaoke-home.firebaseapp.com",
      databaseURL: "https://karaoke-home-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "karaoke-home",
      storageBucket: "karaoke-home.firebasestorage.app",
      messagingSenderId: "285959719922",
      appId: "1:285959719922:web:6cb594ebb3ef854124796b"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let player;
    let currentRoomCode = null;
    let playlistRef = null;
    let commandRef = null;
    let currentPlayingKey = null;
    const WAITING_VIDEO_ID = "6BlfNIfGFfM"; // 🚗 Xe hơi huyền thoại

    let bannerTimer = null;
    let isLocalPlaying = false; // Cờ bọc thép trạng thái

    // 🌟 HÀM QUẢN LÝ BANNER: Kiểm tra nghiêm ngặt ID thực tế của Player
    function checkAndToggleBanner() {
      const banner = document.getElementById('welcomeBanner');
      if (!banner || isLocalPlaying || !player || !player.getVideoData) return;

      try {
        let currentVid = player.getVideoData().video_id;
        
        if (currentVid !== WAITING_VIDEO_ID) {
          if (bannerTimer) clearInterval(bannerTimer);
          bannerTimer = null;
          banner.style.opacity = '0';
          banner.style.visibility = 'hidden';
          return;
        }

        if (!bannerTimer) {
          let cycleBanner = () => {
            if (isLocalPlaying) return;
            let checkVidAgain = player.getVideoData ? player.getVideoData().video_id : '';
            if (checkVidAgain !== WAITING_VIDEO_ID) return;

            banner.style.opacity = '1';
            banner.style.visibility = 'visible';

            setTimeout(() => {
              banner.style.opacity = '0';
              banner.style.visibility = 'hidden';
            }, 4000);
          };

          cycleBanner();
          bannerTimer = setInterval(cycleBanner, 9000);
        }
      } catch (e) {}
    }

    // 1️⃣ KHỞI TẠO PLAYER
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: WAITING_VIDEO_ID,
        playerVars: {
          'autoplay': 1,
          'controls': 1,
          'rel': 0,
          'enablejsapi': 1,
          'playsinline': 1
        },
        events: {
          'onReady': (event) => {
            event.target.playVideo();
            setTimeout(checkAndToggleBanner, 1000);
          },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // 2️⃣ MÃ PHÒNG 2 CHIỀU
    function setRoomCode(code) {
      if (!code || currentRoomCode === code) return;
      currentRoomCode = code;

      if (playlistRef) playlistRef.off();
      if (commandRef) commandRef.off();

      playlistRef = db.ref(`rooms/${currentRoomCode}/playlist`);
      commandRef = db.ref(`rooms/${currentRoomCode}/command`);

      listenToPlaylist();
      listenToCommands();
    }

    // 🛑 DỪNG VÀ TIÊU DIỆT HOÀN TOÀN YOUTUBE KHI SANG OFFLINE
    function stopYouTubeCompletely() {
      isLocalPlaying = true;

      if (bannerTimer) clearInterval(bannerTimer);
      bannerTimer = null;
      const banner = document.getElementById('welcomeBanner');
      if (banner) {
        banner.style.opacity = '0';
        banner.style.visibility = 'hidden';
      }

      if (player) {
        if (player.stopVideo) player.stopVideo();
        if (player.mute) player.mute();
        if (player.loadVideoById) player.loadVideoById("");
      }

      const pContainer = document.getElementById('playerContainer');
      if (pContainer) pContainer.style.display = 'none';

      const localVid = document.getElementById('localPlayer');
      if (localVid) {
        localVid.style.display = 'block';
      }
    }

    // 🟢 BẬT LẠI YOUTUBE KHI VỀ ONLINE / XE HƠI
    function resumeYouTube() {
      isLocalPlaying = false;

      const localVid = document.getElementById('localPlayer');
      if (localVid) {
        localVid.pause();
        localVid.removeAttribute('src');
        localVid.load();
        localVid.style.display = 'none';
      }

      const pContainer = document.getElementById('playerContainer');
      if (pContainer) {
        pContainer.style.display = 'block';
      }

      if (player && player.unMute) {
        player.unMute();
      }
    }

    // 3️⃣ LẮNG NGHE PLAYLIST
    function listenToPlaylist() {
      playlistRef.orderByChild('timestamp').on('value', snapshot => {
        let playlist = [];
        snapshot.forEach(child => {
          let item = child.val();
          playlist.push({ key: child.key, ...item });
        });

        const localVid = document.getElementById('localPlayer');

        if (playlist.length === 0) {
          currentPlayingKey = null;
          if (localVid) {
            localVid.pause();
            localVid.removeAttribute('src');
            localVid.load();
          }
          resumeYouTube();
          if (player && player.loadVideoById) {
            player.loadVideoById(WAITING_VIDEO_ID);
            player.playVideo();
            setTimeout(checkAndToggleBanner, 500);
          }
        } else {
          let topSong = playlist[0];
          
          // XỬ LÝ NHẠC OFFLINE (LOCAL)
          if (topSong.type === 'local' || topSong.localKey) {
            if (topSong.key !== currentPlayingKey) {
              currentPlayingKey = topSong.key;
              stopYouTubeCompletely();
              
              if (localVid && topSong.url) {
                localVid.src = topSong.url;
                localVid.load();
                localVid.play().catch(e => console.log("Lỗi phát offline:", e));
              }
            }
            return;
          }

          // XỬ LÝ NHẠC YOUTUBE ONLINE
          if (localVid) {
            localVid.pause();
            localVid.removeAttribute('src');
            localVid.load();
          }
          resumeYouTube();

          if (topSong.key !== currentPlayingKey) {
            currentPlayingKey = topSong.key;
            if (topSong.videoId && player && player.loadVideoById) {
              if (bannerTimer) clearInterval(bannerTimer);
              bannerTimer = null;
              const banner = document.getElementById('welcomeBanner');
              if (banner) {
                banner.style.opacity = '0';
                banner.style.visibility = 'hidden';
              }

              player.loadVideoById(topSong.videoId);
              player.playVideo();
              setTimeout(checkAndToggleBanner, 1000);
            }
          }
        }
      });
    }

    // 4️⃣ LẮNG NGHE LỆNH REMOTE (ĐÃ VIẾT TƯỜNG MINH, CÔ LẬP TUYỆT ĐỐI NÚT PLAY/PAUSE/NEXT KHI ĐANG PHÁT OFFLINE)
    function listenToCommands() {
      commandRef.on('value', snapshot => {
        let cmd = snapshot.val();
        if (!cmd) return;
        commandRef.remove();

        try {
          const localVid = document.getElementById('localPlayer');

          switch (cmd.type) {
            case 'PLAY_NOW':
              if (cmd.typeSource === 'local' || cmd.localKey || cmd.url) {
                stopYouTubeCompletely();
                if (localVid && cmd.url) {
                  localVid.src = cmd.url;
                  localVid.load();
                  localVid.play().catch(e => {});
                }
                break;
              }
              if (cmd.videoId && player && player.loadVideoById) {
                if (localVid) {
                  localVid.pause();
                  localVid.removeAttribute('src');
                  localVid.load();
                }
                resumeYouTube();
                if (bannerTimer) clearInterval(bannerTimer);
                bannerTimer = null;
                const banner = document.getElementById('welcomeBanner');
                if (banner) {
                  banner.style.opacity = '0';
                  banner.style.visibility = 'hidden';
                }

                player.loadVideoById(cmd.videoId);
                player.playVideo();
                setTimeout(checkAndToggleBanner, 1000);
              }
              break;

            case 'PLAY':
              // 🟢 RÕ RÀNG VÀ TƯỜNG MINH: Nếu đang phát offline thì CHỈ ĐIỀU KHIỂN OFFLINE, CẤM CHẠM YOUTUBE
              if (isLocalPlaying) {
                if (localVid) {
                  localVid.play().catch(e => {});
                }
              } else {
                if (player && player.playVideo) {
                  player.playVideo();
                }
              }
              break;

            case 'PAUSE':
              // 🟢 RÕ RÀNG VÀ TƯỜNG MINH: Nếu đang phát offline thì CHỈ TẠM DỪNG OFFLINE, CẤM CHẠM YOUTUBE
              if (isLocalPlaying) {
                if (localVid) {
                  localVid.pause();
                }
              } else {
                if (player && player.pauseVideo) {
                  player.pauseVideo();
                }
              }
              break;

            case 'NEXT':
              if (isLocalPlaying) {
                if (localVid) {
                  localVid.pause();
                  localVid.removeAttribute('src');
                  localVid.load();
                }
              }
              if (player && player.stopVideo) {
                player.stopVideo();
              }
              if (playlistRef) {
                playlistRef.orderByChild('timestamp').limitToFirst(1).once('value', snap => {
                  snap.forEach(child => {
                    child.ref.remove();
                  });
                });
              }
              break;
          }
        } catch (e) {
          console.log("Lỗi lệnh:", e);
        }
      });
    }

    // 5️⃣ XỬ LÝ KHI THAY ĐỔI TRẠNG THÁI PLAYER
    function onPlayerStateChange(event) {
      if (isLocalPlaying) return;

      setTimeout(checkAndToggleBanner, 500);

      if (event.data === YT.PlayerState.ENDED) {
        if (playlistRef) {
          playlistRef.orderByChild('timestamp').limitToFirst(1).once('value', snap => {
            snap.forEach(child => {
              child.ref.remove();
            });
          });
        }
      }
    }

    window.setRoomCode = setRoomCode;
  </script>
</body>
</html>
