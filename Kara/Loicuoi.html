<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YouTube Player - Karaoke Hana</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #player {
      width: 100%;
      height: 100%;
    }

    /* 🎨 CSS CHO BẢNG HIỆU CHÀO MỪNG ĐỘNG (XUẤT HIỆN NGẮT QUÃNG TINH TẾ) */
    #welcomeBanner {
      position: absolute;
      top: 35px; /* Nằm gọn ở góc trên, không che mất màn hình xe hơi */
      left: 50%;
      transform: translateX(-50%);
      z-index: 99;
      background: rgba(0, 0, 0, 0.45); /* Nền đen mờ lịch sự */
      padding: 10px 28px;
      border-radius: 30px;
      border: 1px solid rgba(255, 221, 0, 0.4);
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      
      /* Hiệu ứng chuyển động ẩn/hiện mượt mà */
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.5s ease-in-out, visibility 1.5s ease-in-out;
      pointer-events: none;
    }

    .welcome-text {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 21px;
      font-weight: bold;
      text-align: center;
      background: linear-gradient(45deg, #ffdd00, #00ffcc, #ff99ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      animation: waveText 3s infinite ease-in-out;
    }

    /* Hiệu ứng chữ lượn sóng nhẹ nhàng */
    @keyframes waveText {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>

  <!-- Bảng hiệu chào mừng động -->
  <div id="welcomeBanner">
    <div class="welcome-text">☕️ Chào mừng bạn đến với Karaoke Hana</div>
  </div>

  <div id="player"></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAIwBqg8EYLU7TQXfOO697C4D5p5_GeghQ",
      authDomain: "karaoke-home.firebaseapp.com",
      databaseURL: "https://karaoke-home-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "karaoke-home",
      storageBucket: "karaoke-home.firebasestorage.app",
      messagingSenderId: "285959719922",
      appId: "1:285959719922:web:6cb594ebb3ef854124796b"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let player;
    let currentRoomCode = null;
    let playlistRef = null;
    let commandRef = null;
    let currentPlayingKey = null;
    const WAITING_VIDEO_ID = "6BlfNIfGFfM"; // 🚗 Xe hơi huyền thoại

    let bannerTimer = null;

    // 🌟 QUẢN LÝ HIỂN THỊ BẢNG HIỆU: Chỉ hiện khi ở màn hình xe hơi (Hiện 4 giây, nghỉ 8 giây để ngắm xe)
    function showWelcomeBanner(show) {
      const banner = document.getElementById('welcomeBanner');
      if (!banner) return;

      if (show) {
        if (bannerTimer) clearInterval(bannerTimer);

        let cycleBanner = () => {
          banner.style.opacity = '1';
          banner.style.visibility = 'visible';

          // Hiển thị trong 4 giây rồi ẩn đi
          setTimeout(() => {
            banner.style.opacity = '0';
            banner.style.visibility = 'hidden';
          }, 4000); 
        };

        // Chờ 2 giây sau khi về xe hơi mới bắt đầu chu kỳ đầu tiên
        setTimeout(() => {
          cycleBanner();
          // Lặp lại chu kỳ mỗi 12 giây (4s hiện chữ + 8s ngắm xe không bị che)
          bannerTimer = setInterval(cycleBanner, 12000);
        }, 2000);

      } else {
        // Khi phát nhạc thật -> Tắt ngay lập tức và dứt điểm
        if (bannerTimer) clearInterval(bannerTimer);
        banner.style.opacity = '0';
        banner.style.visibility = 'hidden';
      }
    }

    // 1️⃣ KHỞI TẠO PLAYER
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: WAITING_VIDEO_ID,
        playerVars: {
          'autoplay': 1,
          'controls': 1,
          'rel': 0,
          'enablejsapi': 1,
          'playsinline': 1
        },
        events: {
          'onReady': (event) => {
            event.target.playVideo();
            showWelcomeBanner(true); // Khởi động lên thấy xe hơi -> Bật bảng chào mừng ngắt quãng
          },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // 2️⃣ MÃ PHÒNG 2 CHIỀU: Nhận mã từ Android Studio
    function setRoomCode(code) {
      if (!code || currentRoomCode === code) return;
      currentRoomCode = code;

      if (playlistRef) playlistRef.off();
      if (commandRef) commandRef.off();

      playlistRef = db.ref(`rooms/${currentRoomCode}/playlist`);
      commandRef = db.ref(`rooms/${currentRoomCode}/command`);

      listenToPlaylist();
      listenToCommands();
    }

    // 🛑 [GIỮ NGUYÊN BẢN GỐC] Hàm dừng hẳn YouTube triệt tiêu hoàn toàn tiếng chạy ngầm khi dính nhạc offline
    function stopYouTubeCompletely() {
      currentPlayingKey = null;
      if (player && player.stopVideo) {
        player.stopVideo();
      }
      showWelcomeBanner(true); // Về xe hơi -> Bật bảng chào mừng
    }

    // 3️⃣ LẮNG NGHE PLAYLIST (Giữ nguyên vẹn cơ chế lọc bài offline chuẩn xác)
    function listenToPlaylist() {
      playlistRef.orderByChild('timestamp').on('value', snapshot => {
        let playlist = [];
        snapshot.forEach(child => {
          let item = child.val();
          
          // 🛡️ Bắt bài offline ngay khi quét qua Firebase
          if (item.type === 'local' || item.localKey) {
            stopYouTubeCompletely();
          } else {
            playlist.push({ key: child.key, ...item });
          }
        });

        if (playlist.length === 0) {
          currentPlayingKey = null;
          if (player && player.loadVideoById) {
            player.loadVideoById(WAITING_VIDEO_ID);
            player.playVideo();
            showWelcomeBanner(true); 
          }
        } else {
          let topSong = playlist[0];
          
          if (topSong.type === 'local' || topSong.localKey) {
            stopYouTubeCompletely();
            return;
          }

          if (topSong.key !== currentPlayingKey) {
            currentPlayingKey = topSong.key;
            if (topSong.videoId && player && player.loadVideoById) {
              showWelcomeBanner(false); // Phát nhạc online -> TẮT ngay bảng chào mừng
              player.loadVideoById(topSong.videoId);
              player.playVideo();
            }
          }
        }
      });
    }

    // 4️⃣ LẮNG NGHE LỆNH REMOTE (Giữ nguyên vẹn luồng điều khiển PLAY_NOW, NEXT, v.v.)
    function listenToCommands() {
      commandRef.on('value', snapshot => {
        let cmd = snapshot.val();
        if (!cmd) return;
        commandRef.remove();

        try {
          switch (cmd.type) {
            case 'PLAY_NOW':
              // 🛡️ Bắt lệnh PLAY_NOW nếu là nhạc offline -> Dừng YouTube và bật xe hơi kèm bảng chào
              if (cmd.typeSource === 'local' || cmd.localKey) {
                stopYouTubeCompletely();
                break;
              }
              if (cmd.videoId && player && player.loadVideoById) {
                showWelcomeBanner(false); // Phát nhạc online -> TẮT bảng chào mừng
                player.loadVideoById(cmd.videoId);
                player.playVideo();
              }
              break;
            case 'PLAY':
              if (player && player.playVideo) player.playVideo();
              break;
            case 'PAUSE':
              if (player && player.pauseVideo) player.pauseVideo();
              break;
            case 'NEXT':
              // 🟢 FIX LỖI NHẠC ONLINE ĐƠN LẺ: Khi bấm NEXT, dừng YouTube ngay, về xe hơi và auto-play
              if (player && player.stopVideo) {
                player.stopVideo();
              }
              if (player && player.loadVideoById) {
                player.loadVideoById(WAITING_VIDEO_ID);
                player.playVideo();
                showWelcomeBanner(true); // Về xe hơi -> Bật bảng chào mừng ngắt quãng
              }
              if (playlistRef) {
                playlistRef.orderByChild('timestamp').limitToFirst(1).once('value', snap => {
                  snap.forEach(child => {
                    child.ref.remove();
                  });
                });
              }
              break;
          }
        } catch (e) {
          console.log("Lỗi lệnh:", e);
        }
      });
    }

    // 5️⃣ XỬ LÝ KHI HẾT BÀI TỰ ĐỘNG
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        if (playlistRef) {
          playlistRef.orderByChild('timestamp').limitToFirst(1).once('value', snap => {
            snap.forEach(child => {
              child.ref.remove();
            });
          });
        }
      }
    }

    window.setRoomCode = setRoomCode;
  </script>
</body>
</html>
